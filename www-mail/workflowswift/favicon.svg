<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f1520"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accentBar)"/>

  <!-- Background glows -->
  <circle cx="1080" cy="140" r="240" fill="rgba(59,130,246,0.04)"/>
  <circle cx="960" cy="520" r="200" fill="rgba(20,184,166,0.03)"/>

  <!-- === MAIN CONTENT === -->
  <g transform="translate(80, 64)">
    <!-- AI Badge -->
    <rect x="0" y="0" width="128" height="38" rx="19" fill="rgba(20,184,166,0.12)" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="64" y="25" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="14" fill="#14b8a6" text-anchor="middle">AI-POWERED</text>

    <!-- Headline Line 1 -->
    <text x="0" y="76" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="52" fill="#ffffff">Free CRM Software</text>

    <!-- Headline Line 2 (solid teal, no gradient fill to avoid ImageMagick issues) -->
    <text x="0" y="142" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="52" fill="#14b8a6">That Replaces 6+ Tools</text>

    <!-- Subtitle -->
    <text x="0" y="240" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="22" fill="#9ca3af">Automated follow-ups, AI lead scoring, built-in calendar,</text>
    <text x="0" y="274" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="22" fill="#9ca3af">SMS &amp; email campaigns, deal pipelines — all free.</text>

    <!-- Tool pills -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="rgba(20,184,166,0.1)" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="85" y="23" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="13" fill="#14b8a6" text-anchor="middle">Calendly Alternative</text>

      <rect x="180" y="0" width="162" height="34" rx="17" fill="rgba(20,184,166,0.1)" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="261" y="23" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="13" fill="#14b8a6" text-anchor="middle">HubSpot Alternative</text>

      <rect x="352" y="0" width="122" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="413" y="23" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Mailchimp</text>

      <rect x="484" y="0" width="82" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="525" y="23" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Twilio</text>

      <rect x="576" y="0" width="82" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="617" y="23" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Zapier</text>
    </g>

    <!-- CTA -->
    <rect x="0" y="418" width="230" height="56" rx="12" fill="url(#ctaGrad)"/>
    <text x="115" y="454" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">Start Free  →</text>
  </g>

  <!-- === RIGHT SIDE VISUAL === -->
  <g transform="translate(820, 120)" opacity="0.55">
    <rect x="10" y="50" width="175" height="16" rx="8" fill="rgba(59,130,246,0.15)"/>
    <rect x="20" y="56" width="78" height="8" rx="4" fill="#3b82f6" opacity="0.45"/>

    <rect x="10" y="86" width="175" height="16" rx="8" fill="rgba(20,184,166,0.15)"/>
    <rect x="20" y="92" width="115" height="8" rx="4" fill="#14b8a6" opacity="0.4"/>

    <rect x="10" y="122" width="175" height="16" rx="8" fill="rgba(139,92,246,0.12)"/>
    <rect x="20" y="128" width="52" height="8" rx="4" fill="#8b5cf6" opacity="0.3"/>

    <!-- Calendar icon -->
    <rect x="30" y="170" width="130" height="90" rx="14" fill="rgba(20,184,166,0.05)" stroke="rgba(20,184,166,0.18)" stroke-width="2"/>
    <rect x="30" y="170" width="130" height="30" rx="14" fill="rgba(59,130,246,0.1)"/>
    <text x="95" y="240" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="26" fill="rgba(20,184,166,0.3)" text-anchor="middle">15</text>

    <!-- Decorative dots -->
    <circle cx="220" cy="40" r="4" fill="rgba(20,184,166,0.18)"/>
    <circle cx="330" cy="80" r="3" fill="rgba(59,130,246,0.15)"/>
    <circle cx="350" cy="200" r="4" fill="rgba(139,92,246,0.12)"/>
    <circle cx="230" cy="300" r="3" fill="rgba(20,184,166,0.1)"/>
  </g>

  <!-- === BRANDING === -->
  <g transform="translate(80, 576)">
    <text font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-weight="bold" font-size="16" fill="#ffffff">
      CoreSwift<tspan fill="#3b82f6">CRM</tspan>
    </text>
    <text x="145" y="2" font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#6b7280">coreswiftcrm.com</text>
  </g>

  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkflowSwift Mail</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<meta name="description" content="Your business mail: inbox, folders, labels and compose, with the same login as your WorkflowSwift account.">
<style>
  :root{
    /* colour */
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --accent:#4f46e5; --accent-soft:#eef2ff; --danger:#b91c1c; --warn:#92400e; --ok:#166534;
    /* elevation — four surfaces, page → overlay */
    --surface-0:#f6f7f9;  /* page background; static text and headings live here, never floats */
    --surface-1:#ffffff;  /* panels, sidebar, tables */
    --surface-2:#ffffff;  /* cards and anything clickable: buttons, inputs, rows, tiles */
    --surface-3:#ffffff;  /* overlays: dropdowns, modals, toasts */
    --surface-ref:#eef0f6; /* muted reference/explanatory surface — sinks: smaller type, never floats */
    /* elevation — light reads depth from shadow */
    --shadow-1:0 1px 2px rgba(17,24,39,.10), 0 2px 4px rgba(17,24,39,.06); /* raised */
    --shadow-2:0 12px 40px rgba(17,24,39,.22), 0 4px 14px rgba(17,24,39,.16); /* overlay */
    /* elevation — z-scale (no ad-hoc z-index values) */
    --z-sticky:10; --z-dropdown:20; --z-modal:30; --z-toast:40;
  }
  /* ── NIGHT MODE. This client is light-first, so the switch ADDS the dark palette. One attribute
     on <html> swaps it; every surface below is painted from these variables. In dark mode depth
     comes from the surface getting LIGHTER as it rises, so the shadows collapse to a hairline ring
     and the surfaces do the lifting — the same token names, different values, never the light
     shadow scale. color-scheme is set both ways or the scrollbars and date/inputs keep the other
     theme. */
  html[data-theme="dark"]{
    --ink:#e8eaed; --muted:#9aa0a6; --line:#2d3148;
    --accent:#818cf8; --accent-soft:#26264a; --danger:#f87171; --warn:#fbbf24; --ok:#34d399;
    --surface-0:#0f1117;
    --surface-1:#1a1d27;
    --surface-2:#222532;
    --surface-3:#2a2e3d;
    --surface-ref:#1a1d27;
    --shadow-1:0 0 0 1px rgba(255,255,255,.05);
    --shadow-2:0 0 0 1px rgba(255,255,255,.08), 0 20px 60px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  html[data-theme="light"]{color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--surface-0)}
  button{font:inherit;cursor:pointer}
  /* Interactive — surface-2, raised with shadow-1; hover/active raise, not just recolour. */
  .btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:7px 12px;box-shadow:var(--shadow-1)}
  .btn:hover{background:var(--surface-3);box-shadow:var(--shadow-2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0);box-shadow:var(--shadow-1)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.06);background:var(--accent)}
  .btn-ghost{border:0;background:transparent;padding:4px 6px;border-radius:6px;color:var(--muted);box-shadow:none}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink);box-shadow:var(--shadow-1)}
  .btn-danger{color:#fff;background:var(--danger);border-color:var(--danger)}
  input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);color:var(--ink);width:100%}
  label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  a{color:var(--accent)}
  /* layout */
  #app{height:100%}
  .mail{display:grid;grid-template-columns:220px 1fr;height:100%}
  .rail{background:var(--surface-1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px}
  .brand{font-weight:700;letter-spacing:.2px;margin:2px 0 12px}
  .folder{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:8px;cursor:pointer}
  .folder:hover{background:#f3f4f6}
  .folder.active{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:var(--shadow-1)}
  .folder .count{font-size:11px;color:var(--muted)}
  .rail h5{margin:14px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;grid-template-rows:auto 1fr;min-width:0}
  /* The storage banner (B206) spans the whole mail area above the list + reader, and stays until
     space is freed: it is rendered from live usage, so nothing dismisses it but deleting mail or
     upgrading. */
  .storage-banner{grid-column:1 / -1;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .list{border-right:1px solid var(--line);background:var(--surface-1);display:flex;flex-direction:column;min-width:0}
  .list-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rows{overflow-y:auto;overflow-x:hidden;flex:1;min-width:0}
  .row > span{min-width:0}
  .row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:18px 1fr auto;gap:8px}
  .row:hover{background:#f9fafb}
  .row.unread{background:#fbfcff}
  .row.unread .subj{font-weight:700}
  .row.sel{background:var(--accent-soft);box-shadow:none}
  .subj{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .from{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .when{font-size:11px;color:var(--muted);white-space:nowrap}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:#eef2ff;color:#3730a3;margin-left:6px;vertical-align:middle}
  .chip.ticket{background:#dcfce7;color:#166534}
  .chip.draft{background:#fef3c7;color:#92400e}
  .reader{overflow:auto;padding:16px 18px;background:var(--surface-1);min-width:0}
  .reader h2{margin:4px 0 6px;font-size:18px}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .body{white-space:pre-wrap;margin:14px 0;max-width:80ch}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .badge{padding:6px 10px;border-radius:8px;font-size:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .badge.ticket{background:#dcfce7;color:#166534}
  .badge.open{background:#fef3c7;color:var(--warn)}
  .empty{padding:28px;color:var(--muted);text-align:center}
  .meter{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
  .meter > i{display:block;height:100%;background:var(--accent)}
  .modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:var(--z-modal)}
  .modal{background:var(--surface-3);color:var(--ink);border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--shadow-2)}
  .modal h3{margin:0 0 8px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .setup{max-width:820px;margin:0 auto;padding:28px 18px 60px}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;box-shadow:var(--shadow-1)}
  button.card{font:inherit;color:var(--ink)}
  button.card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
  .rec{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:13px}
  .rec code{background:var(--surface-ref);padding:2px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%}
  .swatches{display:flex;gap:8px;margin-top:6px}
  .sw{width:22px;height:22px;border-radius:999px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:var(--ink)}
  .err{color:var(--danger);font-size:13px}
  .ok{color:var(--ok);font-size:13px}
  /* The user guide lives on this host too: /guide.html is the WorkflowSwift Mail guide, so the help
     a customer reads is about the screen they are looking at. */
  #mailGuideLink{position:fixed;left:14px;bottom:14px;z-index:var(--z-sticky);font-size:12px;color:var(--muted);text-decoration:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow-1)}
  #mailGuideLink:hover{color:var(--ink);background:var(--surface-3)}
  /* The night/day switch is always visible (no menu) and says what it will DO. */
  .theme-toggle{position:fixed;bottom:24px;right:84px;z-index:var(--z-sticky);display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;box-shadow:var(--shadow-1);cursor:pointer}
  .theme-toggle:hover{background:var(--surface-3);box-shadow:var(--shadow-2)}
  /* Dark-mode literals the surface tokens cannot reach (recessed tints, pastel chips, alerts). */
  html[data-theme="dark"] .row:hover{background:var(--surface-2);box-shadow:var(--shadow-1)}
  html[data-theme="dark"] .row.unread{background:#1f2430}
  html[data-theme="dark"] .folder:hover{background:var(--surface-2)}
  html[data-theme="dark"] .chip{background:#26264a;color:#c7d2fe}
  html[data-theme="dark"] .chip.ticket{background:#12291f;color:#6ee7b7}
  html[data-theme="dark"] .chip.draft{background:#2a2413;color:#fbbf24}
  html[data-theme="dark"] .badge.ticket{background:#12291f;color:#6ee7b7}
  html[data-theme="dark"] .badge.open{background:#2a2413;color:var(--warn)}
  html[data-theme="dark"] .modal-bg{background:rgba(0,0,0,.7)}
  html[data-theme="dark"] a{color:#a5b4fc}
  html[data-theme="dark"] .btn-primary{color:#0f1117}
  @media (max-width:860px){
    .mail{grid-template-columns:1fr}
    .rail{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center;gap:6px;padding:8px}
    .rail .brand,.rail h5,.rail .storage{display:none}
    .main{grid-template-columns:1fr}
    .list{max-height:44vh}
    .reader{border-top:1px solid var(--line)}
    /* On a phone the compose form plus the signature preview is taller than the screen, so the
       panel scrolls (the Send button is reached by scrolling inside it, which is what a phone
       composer does). Trim the preview and the message box so it is a short scroll, not a hunt. */
    .modal{padding:14px}
    .modal-foot{position:sticky;bottom:0;background:var(--surface-3);padding-top:8px}
    #cSigWrap,#sPreview{max-height:150px}
    #cBody{min-height:110px}
  }
</style>
<script id="theme-boot">/* Night/day applied before first paint, so the client never flashes the wrong theme. */
(function(){try{var t=null;try{var m=document.cookie.match(/(?:^|;\s*)ws_theme=([^;]+)/);if(m)t=m[1];}catch(e){}if(!t)t=localStorage.getItem('ws_mail_theme');if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<div id="app"><div class="empty">Loading WorkflowSwift Mail…</div></div>
<a id="mailGuideLink" href="/guide.html" target="_blank" rel="noopener">📖 User guide</a>
<button type="button" id="wsThemeToggle" class="theme-toggle" onclick="wsToggleTheme()" title="Switch day / night mode" aria-label="Switch day / night mode"><span id="wsThemeIcon" aria-hidden="true">🌙</span><span id="wsThemeLabel">Night mode</span></button>

<script>
// ── NIGHT / DAY MODE ───────────────────────────────────────────────────────────────────────────
// Read in <head> before paint (no flash), remembered per browser, and it follows the operating
// system until the person chooses. The label says what the button DOES, not what is on now.
function wsApplyTheme(name) {
  var t = (name === 'dark') ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('ws_mail_theme', t); } catch (e) {}
  try { document.cookie = 'ws_theme=' + t + ';domain=workflowswift.com;path=/;max-age=31536000;SameSite=Lax'; } catch (e) {}
  var lab = document.getElementById('wsThemeLabel');
  if (lab) lab.textContent = (t === 'dark') ? 'Day mode' : 'Night mode';
  var icon = document.getElementById('wsThemeIcon');
  if (icon) icon.textContent = (t === 'dark') ? '☀️' : '🌙';
  var b = document.getElementById('wsThemeToggle');
  if (b) b.title = (t === 'dark') ? 'Switch to day mode' : 'Switch to night mode';
}
function wsToggleTheme() {
  wsApplyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

/* The inline guide's CONTENT for this host (window.appGuidePages — the widget renders it as plain
   text, so no markup belongs in these strings). Three screens live here: the setup page, the
   mailbox chooser, and the mail client itself. Every claim below is measured in mail.js. */
window.appGuidePages = {
  setup: {
    title: "Set up your inbox",
    desc: "Six short steps that take you from a domain you already own to a mailbox that receives. Nothing here needs a technician and nothing is charged until a mailbox exists: add the domain, choose how it sends and how it receives, add the records your provider gives you (each with a Copy button), wait for Active, then create the addresses. Your 30 free days start at the first mailbox you create, not at signup — time spent waiting on DNS costs you nothing.",
    actions: [
      "Sending and receiving are two separate answers: your own Mailgun account or any SMTP service to send, Mailgun or SendGrid (or nowhere) to receive",
      "Every mail record stays DNS only (grey cloud) at Cloudflare; the inbox record is the one set to Proxied (orange cloud)",
      "Press Check again until the domain says Active, then create your mailboxes — the create button stays disabled until it is",
      "Nothing is deleted when the free month ends: the address keeps receiving and only sending pauses",
      "Catch-all, if you turn it on, means mail to any address at your domain you have not created still arrives — it appears under Everything else in the address filter"
    ]
  },
  choose: {
    title: "Choose a mailbox",
    desc: "One card per address on this account, each showing the address and how many messages it holds. Nothing opens behind your back — you pick the address you want to read. The same login covers every mailbox, and the Mailboxes button in the rail brings you back here at any time.",
    actions: [
      "Pick the address you want to read",
      "The count on each card is that address's own mail",
      "Reading a second address later: press Mailboxes in the left rail"
    ]
  },
  mail: {
    title: "Mail",
    desc: "Your mail in one place: the folder rail (Inbox, Unread, Favorites, Drafts, Sent, Archive, Spam, Trash) with live counts, an address filter that includes Everything else for catch-all arrivals, labels, and the storage meter. Incoming mail is never refused and nothing is deleted to make room for new mail.",
    actions: [
      "Open a message to reply, reply to all, forward, star, archive, move it, label it or assign it — or turn it into a support ticket",
      "Switch folder from the rail; the three-dot menu beside a folder creates a subfolder, marks all read or unread, empties Spam or Trash after naming the count, and sorts it",
      "Filter by address, or press a label in the rail, to narrow the list — press Refresh when new mail is due",
      "Storage: the meter shows used of allowance; as it fills, a banner tells you what to do, and only new attachments pause when it is full",
      "Signature in the rail sets THIS address's own block (name, title, company, phone and a short line) or turns it off; Compose and Reply add it for you",
      "Compose is the big button at the top of the rail; drafts are saved under Drafts and can be continued later"
    ]
  }
};
</script>
<script src="/inline-guide-widget.js?v=20261121b"></script>
<script src="/mail.js?v=20261121b"></script>
<script>/* After a reload the switch must describe what it will DO, so the icon and label are refreshed
   from the stored choice (the boot script already set the attribute). */
document.addEventListener('DOMContentLoaded',function(){try{wsApplyTheme(document.documentElement.getAttribute('data-theme')||'light');}catch(e){}});</script>
</body>
</html>

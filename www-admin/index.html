<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkflowSwift — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;margin:0}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px}
.input{border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;width:100%;font-size:14px;color:#111827}
.input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-success{background:#059669;color:#fff}.btn-success:hover{background:#047857}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{background:transparent;color:#6b7280}.btn-ghost:hover{background:#f3f4f6}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 12px;text-align:left;font-size:13px}
.table th{background:#f8fafc;color:#64748b;font-weight:600;border-bottom:2px solid #e2e8f0}

.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}

.main{margin-left:240px;padding:24px}
.tab-btn{display:block;width:100%;text-align:left;padding:10px 16px;font-size:14px;color:#374151;cursor:pointer;border:none;background:none;border-radius:6px;transition:all .1s}
.tab-btn:hover{background:#f3f4f6}

.sub-item.active{color:#2563eb;font-weight:600;background:#eff6ff}

<script>
const API='/api/v1';
let TOKEN=localStorage.getItem('ws_token')||'';
let app={tab:'dashboard',sub:'overview',data:{}};
// Last failed request's server message. api() otherwise swallows the body (returns null),
// so a refused write (e.g. the 403 on surface CRUD for non-admins, or the Duplicate slug
// error) had no way to reach the operator. showForm surfaces this on failure.
let LAST_ERR='';

async function api(path,opts={}){
  const h={...opts.headers,'Content-Type':'application/json'};
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(API+path,{...opts,headers:h});
  if(r.status===401){TOKEN='';localStorage.removeItem('ws_token');renderLogin();return null}
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg=(j&&(j.message||(typeof j.error==='string'&&j.error)))||msg;}catch(e){}
    LAST_ERR=String(msg);
    return null;
  }
  if(r.status===204)return null;
  LAST_ERR='';
  return r.json();
}

async function login(email,pw){
  const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  if(!r.ok){alert('Login failed');return}
  const d=await r.json();
  TOKEN=d.access_token||'';
  localStorage.setItem('ws_token',TOKEN);
  renderApp();
}

function logout(){TOKEN='';localStorage.removeItem('ws_token');renderLogin()}

function h(tag,props={},...children){
  const el=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='className')el.className=v;
    else if(k.startsWith('on'))el[k.toLowerCase()]=v;
    else el.setAttribute(k,v);
  });
  children.forEach(c=>{if(typeof c==='string')el.appendChild(document.createTextNode(c));else if(c)el.appendChild(c)});
  return el;
}

function showMsg(msg,type='info'){
  const el=h('div',{className:'fixed top-4 right-4 px-4 py-3 rounded-lg text-white text-sm font-semibold z-50 '+(type==='error'?'bg-red-600':'bg-green-600')},msg);
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function renderLogin(){
  document.body.innerHTML='';
  const div=h('div',{className:'flex items-center justify-center min-h-screen bg-gray-100'});
  const box=h('div',{className:'card w-full max-w-sm'});
  box.innerHTML=`
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">WorkflowSwift Admin</h1>
    <input id="le" class="input mb-3" placeholder="Email" value="swiftsoftware143@yahoo.com">
    <input id="lp" class="input mb-4" type="password" placeholder="Password">
    <button id="lb" class="btn btn-primary w-full">Log In</button>
    <p id="err" class="text-red-500 text-sm mt-3 hidden text-center"></p>
  `;
  box.querySelector('#lb').onclick=()=>{
    const e=box.querySelector('#le').value,p=box.querySelector('#lp').value;
    login(e,p).then(()=>{if(!TOKEN){const er=box.querySelector('#err');er.className='text-red-500 text-sm mt-3 text-center';er.textContent='Login failed';}});
  };
  div.appendChild(box);
  document.body.appendChild(div);
}

function renderApp(){
  document.body.innerHTML='';
  document.body.appendChild(h('div',{className:'sidebar'},sidebar()));
  document.body.appendChild(h('div',{className:'main'},content()));
}

const tabs=[
  {id:'dashboard',label:'📊 Dashboard',subs:['Overview','Brand Monitor','Competitor Watch','Prospecting']},
  {id:'workflows',label:'⚙️ Workflows',subs:['All Workflows','Instances','Templates']},
  {id:'automation',label:'🤖 Automation',subs:['Automations','Agents','Workspaces']},
  {id:'crm',label:'👥 CRM',subs:['Leads']},
  {id:'tags',label:'🏷️ Tags & Labels',subs:['Tags','Tag Groups']},
  {id:'integrations',label:'🔌 Integrations',subs:['My Integrations','Integration Targets','Provider Keys','API Keys','n8n Proxy','Bridge']},
  {id:'support',label:'🎫 Support',subs:['Tickets']},
  {id:'profile',label:'👤 Profile & Account',subs:['My Profile','Team','Plans & Credits','Invoices','Payments']},
  {id:'comms',label:'📧 Communications',subs:['Email Templates','Webhooks']},
  {id:'admin',label:'🛠️ Admin',subs:['Usage','Settings','Users','Portfolio Companies','Plans','Surfaces','Email Templates','Industry Sources','Site Config']},
];

function sidebar(){
  const nav=h('div',{className:'py-4'});
  nav.appendChild(h('div',{className:'px-4 py-2 text-lg font-bold text-gray-800'},'WorkflowSwift'));
  nav.appendChild(h('div',{className:'px-4 text-xs text-gray-400 mb-4'},'Admin Dashboard'));
  tabs.forEach(t=>{
    const btn=h('button',{className:'tab-btn'+(app.tab===t.id?' active':''),onclick:()=>{app.tab=t.id;app.sub=t.subs[0];renderApp()}},t.label);
    nav.appendChild(btn);
    if(app.tab===t.id){
      t.subs.forEach(s=>{
        const sid=s.toLowerCase().replace(/\s+&?\s*/g,'-').replace(/[^a-z0-9-]/g,'');
        const sub=h('button',{className:'sub-item'+(app.sub===sid?' active':''),onclick:()=>{app.sub=sid;renderApp()}},s);
        nav.appendChild(sub);
      });
    }
  });
  nav.appendChild(h('div',{className:'px-4 mt-6'},h('button',{className:'btn btn-ghost text-red-500 w-full',onclick:logout},'Log Out')));
  return nav;
}

function content(){
  const c=h('div',{});
  const t=app.tab,s=app.sub;

  if(t==='dashboard'){
    if(s==='overview')renderDashboardOverview(c);
    else if(s==='brand-monitor')renderCRUD(c,'brand-monitor','Brand Monitor',['name','query','active'],'/dashboard/brand-monitor');
    else if(s==='competitor-watch')renderCRUD(c,'competitor-watch','Competitor',['name','url','active'],'/dashboard/competitor-watch');
    else if(s==='prospecting')renderCRUD(c,'prospecting','Prospect',['name','industry','status'],'/dashboard/prospecting');
  }else if(t==='workflows'){
    if(s==='all-workflows')renderCRUD(c,'workflows','Workflow',['name','status','created_at'],'/workflows');
    else if(s==='instances')renderCRUD(c,'instances','Instance',['workflow_id','status','created_at'],'/instances');
    else if(s==='templates')renderCRUD(c,'templates','Template',['name','category','is_public'],'/templates');
  }else if(t==='automation'){
    if(s==='automations')renderCRUD(c,'automations','Automation',['name','trigger_type','enabled'],'/automations');
    else if(s==='agents')renderCRUD(c,'agents','Agent',['name','provider','is_active'],'/agents');
    else if(s==='workspaces')renderCRUD(c,'workspaces','Workspace',['name','created_at'],'/workspaces');
  }else if(t==='crm'){
    if(s==='leads')renderCRUD(c,'leads','Lead',['name','status','source'],'/leads');
  }else if(t==='tags'){
    if(s==='tags')renderCRUD(c,'tags','Tag',['name','color'],'/tags');
    else if(s==='tag-groups')renderCRUD(c,'tag-groups','Tag Group',['name','description'],'/tag-groups');
  }else if(t==='integrations'){
    if(s==='my-integrations')renderIntegrations(c);
    else if(s==='integration-targets')renderCRUD(c,'integration-targets','Integration Target',['name','provider','is_active'],'/integration-targets');
    else if(s==='provider-keys')renderProviderKeys(c);
    else if(s==='api-keys')renderCRUD(c,'api-keys','API Key',['name','key_prefix','is_active'],'/api-keys');
    else if(s==='n8n-proxy')renderN8N(c);
    else if(s==='bridge')renderBridge(c);
  }else if(t==='support'){
    if(s==='tickets')renderCRUD(c,'tickets','Ticket',['title','status','priority'],'/tickets');
  }else if(t==='profile'){
    if(s==='my-profile')renderProfile(c);
    else if(s==='team')renderCRUD(c,'team','Team Member',['name','email','role'],'/users');
    else if(s==='plans-credits')renderPlansCredits(c);
    else if(s==='invoices')renderList(c,'invoices','Invoice','/invoices');
    else if(s==='payments')renderCRUD(c,'payments','Payment Provider',['provider_type','is_active'],'/payment-providers');
  }else if(t==='comms'){
    if(s==='email-templates')renderCRUD(c,'email-templates','Email Template',['name','subject','template_type'],'/email-templates');
    else if(s==='webhooks')renderCRUD(c,'webhooks','Webhook',['name','url','is_active'],'/webhooks');
  }else if(t==='admin'){
    if(s==='usage')renderAdminUsage(c);
    else if(s==='settings')renderAdminSettings(c);
    else if(s==='users')renderAdminUsers(c);
    else if(s==='portfolio-companies')renderAdminPortfolio(c);
    else if(s==='plans')renderAdminPlans(c);
    else if(s==='surfaces')renderSurfaces(c);
    else if(s==='email-templates')renderCRUD(c,'admin-email-templates','Email Template',['name','subject'],'/admin/email-templates');
    else if(s==='industry-sources')renderIndustrySources(c);
    else if(s==='site-config')renderSiteConfig(c);
  }
  return c;
}

// --- Response envelope helpers ---
// The API answers lists under a NAMED key — {users:[…]}, {providers:[…]}, {agents:[…]},
// {sources:[…]}, {workflows:[…]}, {surfaces:[…]} — and only a few under {items:[…]}.
// renderCRUD read data.items only, so every named-envelope section rendered
// "No items yet." even when rows existed; with no rows rendered there was no Edit/Del
// button, so every per-row PUT/DELETE route stayed uncalled. Unwrap the envelope.
function unwrapList(d){
  if(Array.isArray(d))return d;
  if(!d||typeof d!=='object')return [];
  if(Array.isArray(d.items))return d.items;
  for(const k of Object.keys(d)){ if(Array.isArray(d[k]))return d[k]; }
  return [];
}
// Row identifier for the generic Edit/Del actions: several resources key on something
// other than `id` (payment providers on provider_type, sources on industry_slug, …).
function rowId(it){
  if(!it||typeof it!=='object')return '';
  return it.id||it.provider_type||it.slug||it.uuid||it.api_key_id||it.industry_slug||it.name||'';
}
// GET <ep>/<id> answers a NAMED single envelope too ({surface:{…}}, {user:{…}}), so the edit
// form prefilled every field blank. Unwrap one level when the payload is a wrapper object.
function unwrapOne(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return {};
  if(d.id||d.name||d.slug||d.provider_type)return d;
  for(const k of Object.keys(d)){
    const v=d[k];
    if(v&&typeof v==='object'&&!Array.isArray(v))return v;
  }
  return d;
}

// --- Generic CRUD ---
// `editFields` (optional) = the fields the Edit form exposes; without it Edit stays on
// ['name'] as before. Sections whose real shape is name/slug/description (surfaces) pass it
// so an edit can actually change the slug/description, not just the name.
async function renderCRUD(container,key,label,fields,ep,editFields){
  container.innerHTML=`<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">${label}s</h2><button class="btn btn-primary btn-sm" id="addBtn">+ Add</button></div><div id="list"><p class="text-gray-400 text-sm">Loading...</p></div></div>`;
  const data=await api(ep);
  const items=unwrapList(data);
  const list=container.querySelector('#list');
  if(!items.length){
    list.innerHTML='<p class="text-gray-400 text-sm">No items yet.</p>';
    container.querySelector('#addBtn').onclick=()=>showForm(key,label,fields,ep,null,()=>renderPage());
    return;
  }
  let cols=fields;
  if(!cols.length&&items[0])cols=Object.keys(items[0]).filter(k=>k!=='id'&&k!=='aid'&&k!=='updated_at'&&k!=='created_at').slice(0,5);
  const ef=(editFields||['name']).join(',');
  const thead=cols.map(f=>`<th>${f.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</th>`).join('');
  const tbody=items.map(it=>'<tr>'+cols.map(f=>`<td>${String(it[f]===undefined||it[f]===null?'':it[f])}</td>`).join('')+
    `<td class="text-right"><button class="btn btn-sm btn-ghost" onclick="event.preventDefault();editIt('${key}','${label}','${ep}','${rowId(it)}','${ef}')">Edit</button>`+
    `<button class="btn btn-sm btn-danger" onclick="event.preventDefault();delIt('${key}','${label}','${ep}','${rowId(it)}')">Del</button></td></tr>`).join('');
  list.innerHTML=`<table class="table"><thead><tr>${thead}<th style="width:140px"></th></tr></thead><tbody>${tbody}</tbody></table>`;
  container.querySelector('#addBtn').onclick=()=>showForm(key,label,cols,ep,null,()=>renderPage());
}

function renderPage(){renderApp()}
window.editIt=function(key,label,ep,id,ef){showForm(key,label,ef?ef.split(','):['name'],ep,id,renderPage)}
window.delIt=async function(key,label,ep,id){if(!confirm('Delete?'))return;const r=await api(ep+'/'+id,{method:'DELETE'});showMsg(r?'Deleted':('Delete failed: '+LAST_ERR),r?undefined:'error');renderPage()}

async function showForm(key,label,fields,ep,id,cb){
  const data=id?await api(ep+'/'+id):null;
  const item=unwrapOne(data);
  const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
  const box=h('div',{className:'modal-box'});
  box.innerHTML=`<h2 class="text-lg font-bold mb-4">${id?'Edit':'Add'} ${label}</h2><form id="mf">`+
    fields.map(f=>`<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${f.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</label><input class="input" name="${f}" value="${item[f]===undefined||item[f]===null?'':String(item[f]).replace(/"/g,'&quot;')}"></div>`).join('')+
    `</form><div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Save</button></div>`;
  box.querySelector('#cancelBtn').onclick=()=>modal.remove();
  box.querySelector('#saveBtn').onclick=async()=>{
    // Skip blank inputs: an empty string is not "unset" server-side — POST /surfaces would
    // store slug='' instead of slugifying the name, and PUT uses COALESCE (blank can't clear).
    const body={};box.querySelectorAll('#mf input').forEach(inp=>{if(String(inp.value).trim()!=='')body[inp.name]=inp.value});
    const r=await api(id?ep+'/'+id:ep,{method:id?'PUT':'POST',body:JSON.stringify(body)});
    if(r)showMsg('Saved!');else showMsg('Error saving: '+LAST_ERR,'error');
    if(r){modal.remove();if(cb)cb();}
  };
  modal.appendChild(box);document.body.appendChild(modal);
}

// --- Surfaces (tenant-wide definition; the ONLY place they may be created) ---
// The API refuses writes from non-admin tokens with 403 "Admin access required" and refuses a
// duplicate per-tenant slug with 409 — both now reach the operator via LAST_ERR above.
// Fields are the API's real ones (name, slug, description); slug may be omitted and is
// slugified from name. The user-facing app only *selects* from this registry.
function renderSurfaces(c){
  renderCRUD(c,'surfaces','Surface',['name','slug','description'],'/surfaces',['name','slug','description']);
}

// --- Dashboard ---
function renderDashboardOverview(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">Dashboard Overview</h2><div id="stats" class="grid grid-cols-3 gap-4"><p class="text-gray-400">Loading...</p></div></div>';
  api('/dashboard/stats').then(d=>{
    const s=c.querySelector('#stats');
    if(!d||!d.stats){s.innerHTML='<p class="text-gray-400">No stats available.</p>';return}
    s.innerHTML=[{l:'Workflows',v:d.stats.total_workflows||d.total_workflows||0},{l:'Instances',v:d.stats.total_instances||d.total_instances||0},{l:'Credits',v:d.stats.credits||d.credits||0}]
      .map(x=>`<div class="card text-center"><div class="text-3xl font-bold text-blue-600">${x.v}</div><div class="text-sm text-gray-500">${x.l}</div></div>`).join('');
  }).catch(()=>c.querySelector('#stats').innerHTML='<p class="text-red-400">Failed.</p>');
}

function renderIntegrations(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">My Integrations</h2><div id="idata"></div></div>';
  api('/integrations').then(d=>{
    const el=c.querySelector('#idata');
    if(!d||!d.items||!d.items.length){el.innerHTML='<p class="text-gray-400 text-sm">No integrations configured.</p>';return}
    el.innerHTML=d.items.map(i=>`<div class="flex justify-between items-center p-3 border-b"><div><strong>${i.provider||i.name}</strong><span class="text-xs text-gray-500 ml-2">${i.is_active?'Active':'Inactive'}</span></div><div class="flex gap-2"><button class="btn btn-sm btn-ghost">Test</button><button class="btn btn-sm btn-danger">Remove</button></div></div>`).join('');
  });
}

function renderProviderKeys(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">Provider Keys</h2><p class="text-xs text-gray-400 mb-4">Per-user API keys for third-party providers.</p><div id="pkdata"></div></div>';
  renderCRUD(c.querySelector('#pkdata'),'provider-keys','Provider Key',['provider','key_prefix','is_active'],'/provider-keys');
}

function renderN8N(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">n8n Proxy</h2><div id="n8ndata"></div></div>';
  api('/n8n/health').then(d=>{
    c.querySelector('#n8ndata').innerHTML=d?`<div class="p-4 bg-green-50 rounded-lg"><p class="text-green-700 font-semibold">✅ n8n Connected</p><pre class="text-xs text-green-600 mt-2 overflow-x-auto">${JSON.stringify(d,null,2)}</pre></div>`:'<p class="text-red-400">n8n unreachable.</p>';
  });
}

function renderBridge(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">Bridge (OpenClaw)</h2><div id="bridata"></div></div>';
  api('/bridge-tasks').then(d=>{
    const el=c.querySelector('#bridata');
    if(!d||!d.tasks||!d.tasks.length){el.innerHTML='<p class="text-gray-400 text-sm">No pending bridge tasks.</p>';return}
    el.innerHTML=d.tasks.map(t=>`<div class="p-3 border-b"><strong>${t.name||t.id}</strong><span class="text-xs text-gray-500 ml-2">${t.status}</span></div>`).join('');
  });
}

function renderProfile(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">My Profile</h2><div id="pdata"><p class="text-gray-400">Loading...</p></div></div>';
  api('/auth/me').then(d=>{
    if(!d){c.querySelector('#pdata').innerHTML='<p class="text-red-400">Failed.</p>';return}
    c.querySelector('#pdata').innerHTML=`
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs text-gray-500">Name</label><p class="font-semibold">${d.name||d.user?.name||'-'}</p></div>
        <div><label class="text-xs text-gray-500">Email</label><p class="font-semibold">${d.email||d.user?.email||'-'}</p></div>
        <div><label class="text-xs text-gray-500">Role</label><p class="font-semibold">${d.role||d.user?.role||'-'}</p></div>
        <div><label class="text-xs text-gray-500">Account</label><p class="font-semibold">${d.account_name||d.user?.account_name||'-'}</p></div>
      </div>`;
  });
}

function renderPlansCredits(c){
  c.innerHTML=`<div class="space-y-4">
    <div class="card"><h2 class="text-xl font-bold mb-4">My Plan</h2><div id="pldata"><p class="text-gray-400 text-sm">Loading...</p></div></div>
    <div class="card"><h2 class="text-xl font-bold mb-4">Credits</h2><div id="crdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>
  </div>`;
  api('/plans').then(d=>{
    const el=c.querySelector('#pldata');
    if(!d||!d.plans||!d.plans.length){el.innerHTML='<p class="text-gray-400 text-sm">No plans.</p>';return}
    el.innerHTML=d.plans.map(p=>`<div class="flex justify-between p-3 border-b"><div><strong>${p.name}</strong><span class="text-xs text-gray-500 ml-2">${p.slug}</span></div><span class="font-semibold text-sm">$${p.price_monthly||p.price||0}/mo</span></div>`).join('');
  });
  api('/credits/balance').then(d=>{
    c.querySelector('#crdata').innerHTML=`<div class="text-center py-4"><div class="text-4xl font-bold text-blue-600">${d&&d.balance||0}</div><div class="text-xs text-gray-500 mt-1">credits remaining</div></div>`;
  });
}

function renderList(c,key,label,ep){
  c.innerHTML=`<div class="card"><h2 class="text-xl font-bold mb-4">${label}s</h2><div id="ldata"></div></div>`;
  api(ep).then(d=>{
    const el=c.querySelector('#ldata');
    if(!d||!d.items||!d.items.length){el.innerHTML='<p class="text-gray-400 text-sm">No items.</p>';return}
    el.innerHTML=`<table class="table"><tbody>`+d.items.map(i=>`<tr><td>${i.id||'-'}</td><td class="text-xs text-gray-500">${JSON.stringify(i).slice(0,80)}</td></tr>`).join('')+'</tbody></table>';
  });
}

// Generic single-setting editor (any key in admin_settings is editable here).
async function editSetting(key){
  const d=await api('/admin/settings/'+encodeURIComponent(key));
  if(!d){alert('Could not load setting '+key);return}
  const cur=typeof d.value==='string'?d.value:JSON.stringify(d.value,null,2);
  const next=prompt('Value for "'+key+'" (text or JSON):',cur);
  if(next===null)return;
  let value=next;
  try{value=JSON.parse(next)}catch(e){/* keep as plain text */}
  const r=await api('/admin/settings/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({value})});
  alert(r?'Saved '+key:'Save failed for '+key);
  if(r)renderPage();
}

function renderAdminSettings(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">Platform Settings</h2><div id="sdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>'
   +'<div class="card mt-4"><h2 class="text-xl font-bold mb-1">Email Provider</h2>'
   +'<p class="text-xs text-gray-500 mb-4">Pick the transport WorkflowSwift sends with. These credentials live in the database and are read at send time &mdash; no server environment variables are consulted. Save, then send a test to prove it works.</p>'
   +'<div id="emailform" class="grid grid-cols-2 gap-3"></div>'
   +'<div class="flex gap-2 mt-4"><button class="btn btn-primary btn-sm" id="esave">Save email provider</button>'
   +'<button class="btn btn-sm btn-ghost" id="etest">Send test email</button></div>'
   +'<pre id="eresult" class="text-xs text-gray-600 mt-3 whitespace-pre-wrap"></pre></div>';

  api('/admin/settings').then(d=>{
    const el=c.querySelector('#sdata');
    if(!el)return;
    const items=(d&&d.items)||[];
    if(!items.length){el.innerHTML='<p class="text-gray-400 text-sm">No settings.</p>';return}
    el.innerHTML=items.map(s=>{
      const shown=typeof s.value==='string'?s.value:JSON.stringify(s.value);
      return '<div class="flex justify-between p-3 border-b"><div><strong>'+s.key+'</strong><span class="text-xs text-gray-500 ml-2">'+String(shown||'').slice(0,90)+'</span></div><button class="btn btn-sm btn-ghost" data-k="'+s.key+'">Edit</button></div>';
    }).join('');
    el.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>editSetting(b.getAttribute('data-k')));
  });

  api('/admin/settings/email').then(d=>{
    const form=c.querySelector('#emailform');
    if(!form)return;
    const v=(d&&d.value)||{};
    const f=(id,label,ph,val)=>'<div><label class="text-xs text-gray-500">'+label+'</label><input id="'+id+'" class="input" placeholder="'+(ph||'')+'" value="'+String(val==null?'':val).replace(/"/g,'&quot;')+'"></div>';
    form.innerHTML='<div><label class="text-xs text-gray-500">Provider</label><select id="e_provider" class="input">'
      +['smtp','mailgun','sendgrid','sendiio'].map(p=>'<option value="'+p+'"'+((v.provider||'smtp')===p?' selected':'')+'>'+p+'</option>').join('')
      +'</select></div>'
      +f('e_from_address','From address','billing@yourdomain.com',v.from_address)
      +f('e_from_name','From name','WorkflowSwift',v.from_name)
      +f('e_api_url','API URL (mailgun / sendgrid / sendiio)','https://api.mailgun.net/v3/<domain>/messages',v.api_url)
      +f('e_api_key','API key (leave the mask to keep the stored key)','',v.api_key)
      +f('e_smtp_host','SMTP host','smtp.mailgun.org',v.smtp_host)
      +f('e_smtp_port','SMTP port','587',v.smtp_port||587)
      +f('e_smtp_username','SMTP username','postmaster@yourdomain.com',v.smtp_username)
      +f('e_smtp_password','SMTP password (leave the mask to keep it)','',v.smtp_password)
      +'<div><label class="text-xs text-gray-500">SMTP encryption</label><select id="e_smtp_encryption" class="input">'
      +['tls','ssl','none'].map(p=>'<option value="'+p+'"'+((v.smtp_encryption||'tls')===p?' selected':'')+'>'+p+'</option>').join('')
      +'</select></div>';
  });

  const esave=c.querySelector('#esave'), etest=c.querySelector('#etest');
  if(esave)esave.onclick=async()=>{
    const g=id=>{const e=c.querySelector('#'+id);return e?e.value:''};
    const value={provider:g('e_provider'),from_address:g('e_from_address'),from_name:g('e_from_name'),
      api_url:g('e_api_url'),api_key:g('e_api_key'),smtp_host:g('e_smtp_host'),
      smtp_port:parseInt(g('e_smtp_port')||'587',10),smtp_username:g('e_smtp_username'),
      smtp_password:g('e_smtp_password'),smtp_encryption:g('e_smtp_encryption')};
    const r=await api('/admin/settings/email',{method:'PUT',body:JSON.stringify({value,description:'Email provider configuration'})});
    c.querySelector('#eresult').textContent=r?'Saved email provider: '+value.provider:'Save failed.';
  };
  if(etest)etest.onclick=async()=>{
    const to=prompt('Send a test email to:');if(!to)return;
    c.querySelector('#eresult').textContent='Sending...';
    const r=await api('/admin/settings/email/test',{method:'POST',body:JSON.stringify({to})});
    c.querySelector('#eresult').textContent=r?JSON.stringify(r,null,2):'Request failed.';
  };
}

// Init
// This script sits in <head>, so it runs BEFORE the parser has created <body> and
// document.body is still null — renderApp()/renderLogin() both start with
// document.body.innerHTML='' and threw "Cannot set properties of null", leaving
// admin.workflowswift.com a blank page for every account. Wait for the DOM instead.
function boot(){ if(TOKEN)renderApp();else renderLogin(); }
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>

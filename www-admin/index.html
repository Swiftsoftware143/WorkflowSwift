<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkflowSwift — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;margin:0}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px}
.input{border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;width:100%;font-size:14px;color:#111827}
.input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-success{background:#059669;color:#fff}.btn-success:hover{background:#047857}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{background:transparent;color:#6b7280}.btn-ghost:hover{background:#f3f4f6}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 12px;text-align:left;font-size:13px}
.table th{background:#f8fafc;color:#64748b;font-weight:600;border-bottom:2px solid #e2e8f0}
.table td{border-bottom:1px solid #f1f5f9}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.sidebar{width:240px;background:#fff;min-height:100vh;border-right:1px solid #e5e7eb;position:fixed;top:0;left:0;overflow-y:auto;z-index:10}
.main{margin-left:240px;padding:24px}
.tab-btn{display:block;width:100%;text-align:left;padding:10px 16px;font-size:14px;color:#374151;cursor:pointer;border:none;background:none;border-radius:6px;transition:all .1s}
.tab-btn:hover{background:#f3f4f6}
.tab-btn.active{background:#eff6ff;color:#2563eb;font-weight:600}
.sub-item{padding:6px 16px 6px 36px;font-size:13px;color:#6b7280;cursor:pointer;border:none;background:none;display:block;width:100%;text-align:left;border-radius:4px}
.sub-item:hover{background:#f3f4f6;color:#374151}
.sub-item.active{color:#2563eb;font-weight:600;background:#eff6ff}
</style>
<script>
const API='/api/v1';
let TOKEN=localStorage.getItem('ws_token')||'';
// Active impersonation: {admin_token, tenant_id, user_name, expires_at}. While set, TOKEN is the
// tenant-scoped 15-minute JWT POST /impersonate minted, so every panel call acts as that
// tenant. Stop calls POST /stop-impersonation for real and restores the admin token.
let IMPERSONATION=null;
// The console holds TWO sessions during a support call and they are stored in two places on purpose:
// `localStorage['ws_token']` is the OPERATOR's own sign-in (line 37 — the only thing login() writes,
// a day long), and the tenant's 15-minute impersonation token lives under its OWN sessionStorage
// keys together with the record the banner needs. Measured live 2026-10-16 (audit ws-imp-reload,
// card t_b44d6384): the tenant token used to exist in the `TOKEN` variable ONLY, so a page reload —
// or ANY navigation, since this console has no client-side routing — silently dropped the support
// session: banner and Stop control went with it and the console quietly became the operator again,
// with no notice and no way back to the tenant except re-impersonating. A reload now re-adopts the
// parked session, and every path that ends a session (Log Out, a 401, a failed identity read)
// clears BOTH halves, so the tenant half can never outlive the operator's sign-out (the FunnelSwift
// class: a parked token one click from restoring a session that was supposed to be over).
const IMP_TOKEN_KEY='ws_impersonation_token', IMP_REC_KEY='ws_impersonation';
function readParkedImpersonation(){
  try{
    const t=sessionStorage.getItem(IMP_TOKEN_KEY)||'';
    const r=JSON.parse(sessionStorage.getItem(IMP_REC_KEY)||'null');
    if(!t||!r||!r.tenant_id)return null;
    // The record carries the server's own expires_in, so an expired support session is not a
    // session: it is never adopted, it is dropped.
    if(!(Number(r.expires_at)>Math.floor(Date.now()/1000)))return null;
    return {token:t,rec:r};
  }catch(e){return null}
}
function clearImpersonation(){
  try{sessionStorage.removeItem(IMP_TOKEN_KEY);sessionStorage.removeItem(IMP_REC_KEY)}catch(e){}
  IMPERSONATION=null;
}
// The ONE way a session ends. Every caller goes through it: the Log Out control, api()'s 401 arm
// and a failed identity read. Nothing the console holds may still be live after a sign-out.
function clearSession(){
  TOKEN='';ME=null;
  try{localStorage.removeItem('ws_token')}catch(e){}
  clearImpersonation();
  renderLogin();
}
// Adopt a parked support session. boot() calls this only once the OPERATOR's own /auth/me has been
// read, so a parked tenant token can never stand alone in front of a dead operator session.
function adoptImpersonation(){
  const had=!!sessionStorage.getItem(IMP_REC_KEY);
  const parked=readParkedImpersonation();
  if(!parked){if(had)clearImpersonation();return false}
  const own=localStorage.getItem('ws_token')||'';
  if(!own){clearImpersonation();return false}
  IMPERSONATION={admin_token:own,tenant_id:parked.rec.tenant_id,user_name:parked.rec.user_name,
    expires_at:parked.rec.expires_at};
  TOKEN=parked.token;
  return true;
}
// This account's own /auth/me payload, read once per page load. It carries `perm_is_super_admin`,
// the SAME flag the backend's admin middleware enforces, so the console can stop showing the
// operator-only Admin tab to a tenant user whose calls under it would all answer 403.
let ME=null;
function showAdminTab(){return !!(ME&&ME.perm_is_super_admin)&&!IMPERSONATION;}
let app={tab:'dashboard',sub:'overview',data:{}};
// Last failed request's server message. api() otherwise swallows the body (returns null),
// so a refused write (e.g. the 403 on surface CRUD for non-admins, or the Duplicate slug
// error) had no way to reach the operator. showForm surfaces this on failure.
let LAST_ERR='';

/* Provider-preset destinations. GET /provider-presets carries a `base_url` per preset, and for the
   platform's OWN destinations that value is LOOPBACK: measured live 2026-10-15, `coreswift` and
   `coreswift_crm` are `http://localhost:8084` (the CoreSwift hub this app pushes into, read from its
   CORESWIFT_URL) and `n8n` is `http://localhost:5678`. Those are the addresses the SERVER dials —
   neither reachable nor owned by the operator choosing a preset — so printing them in the picker
   named the destination in terms useless to the person picking it (the sibling consoles mask the
   same class: kanban t_ff1f0d6b on FunnelSwift, b76f8e1 on ADASwift). A public base_url still
   prints; an internal one is named instead of quoted. */
function publicBase(u){
  const s=String(u==null?'':u).trim();
  if(!s)return '';
  return /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|host\.docker\.internal|[A-Za-z0-9_-]+\.internal|10\.[0-9]|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/i.test(s)?'':s;
}
function presetLabel(p){
  const pub=publicBase(p&&p.base_url);
  const where=pub?' — '+escHtml(pub):((p&&p.base_url)?' — in-platform':'');
  return escHtml((p&&p.name)||'')+' ('+escHtml((p&&p.key)||'')+')'+where;
}

async function api(path,opts={}){
  const h={...opts.headers,'Content-Type':'application/json'};
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(API+path,{...opts,headers:h});
  if(r.status===401){
    // A refused TENANT session falls back to the operator's own sign-in instead of ending it: the
    // support token lasts 15 minutes, the operator's a day. Any other 401 ends the session whole.
    const own=IMPERSONATION?(localStorage.getItem('ws_token')||''):'';
    if(own){clearImpersonation();TOKEN=own;renderPage();showMsg('The support session ended; you are back as yourself','error');return null}
    clearSession();return null;
  }
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg=(j&&(j.message||(typeof j.error==='string'&&j.error)))||msg;}catch(e){}
    LAST_ERR=String(msg);
    return null;
  }
  if(r.status===204)return null;
  LAST_ERR='';
  return r.json();
}

async function loadMe(){
  // One read of who we are, so the sidebar knows whether the Admin tab is ours. api() answers null
  // (and switches to the login screen) on a 401.
  const r=await api('/auth/me');
  if(r&&r.user)ME=r.user;
}

async function login(email,pw){
  const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  if(!r.ok){alert('Login failed');return}
  const d=await r.json();
  TOKEN=d.access_token||'';
  localStorage.setItem('ws_token',TOKEN);
  // A fresh sign-in starts with no support session: anything parked belongs to the session that
  // just ended, and `ws_token` is about to point at a different operator's day.
  clearImpersonation();
  await loadMe();
  renderApp();
}

// Signing out ends EVERY session this console holds — the operator's own and a parked support
// session — through the one clearSession() the other ending paths use too.
function logout(){clearSession()}

function h(tag,props={},...children){
  const el=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='className')el.className=v;
    else if(k.startsWith('on'))el[k.toLowerCase()]=v;
    else el.setAttribute(k,v);
  });
  children.forEach(c=>{if(typeof c==='string')el.appendChild(document.createTextNode(c));else if(c)el.appendChild(c)});
  return el;
}

function showMsg(msg,type='info'){
  const el=h('div',{className:'fixed top-4 right-4 px-4 py-3 rounded-lg text-white text-sm font-semibold z-50 '+(type==='error'?'bg-red-600':'bg-green-600')},msg);
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function renderLogin(){
  document.body.innerHTML='';
  const div=h('div',{className:'flex items-center justify-center min-h-screen bg-gray-100'});
  const box=h('div',{className:'card w-full max-w-sm'});
  box.innerHTML=`
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">WorkflowSwift Admin</h1>
    <input id="le" class="input mb-3" placeholder="Email" autocomplete="username">
    <input id="lp" class="input mb-4" type="password" placeholder="Password">
    <button id="lb" class="btn btn-primary w-full">Log In</button>
    <p class="text-center mt-3"><a href="https://app.workflowswift.com/forgot-password.html" class="text-sm text-blue-600 hover:underline">Forgot password?</a></p>
    <p id="err" class="text-red-500 text-sm mt-3 hidden text-center"></p>
  `;
  box.querySelector('#lb').onclick=()=>{
    const e=box.querySelector('#le').value,p=box.querySelector('#lp').value;
    login(e,p).then(()=>{if(!TOKEN){const er=box.querySelector('#err');er.className='text-red-500 text-sm mt-3 text-center';er.textContent='Login failed';}});
  };
  div.appendChild(box);
  document.body.appendChild(div);
}

function renderApp(){
  document.body.innerHTML='';
  document.body.appendChild(h('div',{className:'sidebar'},sidebar()));
  const main=h('div',{className:'main'},content());
  if(IMPERSONATION)main.insertBefore(impersonationBanner(),main.firstChild);
  document.body.appendChild(main);
  if(window.inlineGuidePage)window.inlineGuidePage(app.tab+':'+app.sub);
}

function impersonationBanner(){
  const b=h('div',{className:'card'});
  b.style.borderLeft='4px solid #f59e0b';b.style.background='#fffbeb';b.style.marginBottom='16px';
  const row=h('div',{className:'flex items-center justify-between gap-3'});
  const left=h('div',{});
  left.appendChild(h('strong',{},'Impersonating '+(IMPERSONATION.user_name||IMPERSONATION.tenant_id)));
  left.appendChild(h('span',{className:'text-xs text-gray-500 ml-2'},
    'tenant '+IMPERSONATION.tenant_id+' \u00b7 token expires '+(IMPERSONATION.expires_at?new Date(IMPERSONATION.expires_at*1000).toLocaleTimeString():'-')));
  row.appendChild(left);
  row.appendChild(h('button',{className:'btn btn-sm btn-danger',onclick:stopImpersonation},'Stop impersonation'));
  b.appendChild(row);
  return b;
}

async function startImpersonation(tenantId){
  if(!tenantId)return showMsg('This row has no tenant id','error');
  if(!confirm('Start impersonating tenant '+tenantId+'? The panel will act as that tenant.'))return;
  const r=await api('/impersonate',{method:'POST',body:JSON.stringify({tenant_id:tenantId})});
  if(!r||!r.impersonation_token){showMsg('Impersonate failed: '+(LAST_ERR||'no token returned'),'error');return}
  IMPERSONATION={admin_token:TOKEN,tenant_id:r.tenant_id,user_name:r.user_name,
    expires_at:Math.floor(Date.now()/1000)+(r.expires_in||900)};
  // PARK the tenant session before the panel acts as it. `ws_token` is left alone: it is the
  // operator's OWN sign-in and is the way back (Stop restores it, and a reload needs it to prove an
  // operator session is still behind the parked one).
  try{
    sessionStorage.setItem(IMP_TOKEN_KEY,r.impersonation_token);
    sessionStorage.setItem(IMP_REC_KEY,JSON.stringify({tenant_id:r.tenant_id,user_name:r.user_name,
      expires_at:IMPERSONATION.expires_at}));
  }catch(e){}
  TOKEN=r.impersonation_token;
  showMsg('Impersonating '+(r.user_name||r.tenant_id));
  renderPage();
}
async function stopImpersonation(){
  const was=IMPERSONATION?(IMPERSONATION.user_name||IMPERSONATION.tenant_id):'tenant';
  // Restore the admin token FIRST: the stop call must go out as the admin, not as the
  // short-lived impersonation token the server just minted. The operator's session is the one this
  // console keeps in `ws_token`, so the way back survives a reload that dropped the in-memory copy.
  const own=(IMPERSONATION&&IMPERSONATION.admin_token)||localStorage.getItem('ws_token')||'';
  if(own)TOKEN=own;
  // The tenant session is over BEFORE the call, so a refused stop cannot leave it parked (and a
  // reload can never resurrect it).
  clearImpersonation();
  const r=await api('/stop-impersonation',{method:'POST',body:JSON.stringify({})});
  showMsg(r?('Stopped impersonating '+was):('Stop failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
  renderPage();
}
window.startImpersonation=startImpersonation;

// kanban t_zz-tickets — the slug a sub-item's panel actually matches. `content()` compares
// app.sub against the SLUG ('tickets', 'all-workflows'), but the TAB button used to store the
// sub's LABEL ('Tickets', 'All Workflows') in app.sub — so clicking any sidebar tab rendered an
// EMPTY panel until the operator clicked the sub-item underneath it. Measured live 2026-10-14:
// click '🎫 Support' -> main innerHTML length 11, 0 `.card`, no + Add; click 'Tickets' -> the
// panel. Same for '⚙️ Workflows' -> 'All Workflows'. One slug function, used by both callers.
const subSlug=s=>s.toLowerCase().replace(/\s+&?\s*/g,'-').replace(/[^a-z0-9-]/g,'');

// Panes that belong to the platform operator even though they sit under a tenant tab.
// "Payments" is the gateway configuration the operator manages; a tenant opening it used to get a
// raw 403 from GET /api/v1/payment-providers and an empty card.
const OPERATOR_ONLY_SUBS=new Set(['Payments']);
function subLabel(t,s){const tab=tabs.find(x=>x.id===t);if(!tab)return '';const hit=tab.subs.find(x=>subSlug(x)===s);return hit||''}
const tabs=[
  {id:'dashboard',label:'📊 Dashboard',subs:['Overview','Brand Monitor','Competitor Watch','Prospecting']},
  {id:'workflows',label:'⚙️ Workflows',subs:['All Workflows','Instances','Templates']},
  {id:'automation',label:'🤖 Automation',subs:['Automations','Agents','Workspaces']},
  {id:'crm',label:'👥 CRM',subs:['Leads']},
  {id:'tags',label:'🏷️ Tags & Labels',subs:['Tags','Tag Groups']},
  {id:'integrations',label:'🔌 Integrations',subs:['Integration Targets','Destination Values','Provider Keys','API Keys','n8n Proxy','Bridge']},
  {id:'support',label:'🎫 Support',subs:['Tickets']},
  {id:'profile',label:'👤 Profile & Account',subs:['My Profile','Team','Plans & Credits','Email Branding','Invoices','Payments','Checkout Sessions']},
  {id:'comms',label:'📧 Communications',subs:['Webhooks']},
  {id:'admin',label:'🛠️ Admin',subs:['Usage','Settings','Users','Accounts','Portfolio Companies','Plans','Plan Requests','Surfaces','Email Templates','Industry Sources','Site Config']},
];

function sidebar(){
  const nav=h('div',{className:'py-4'});
  nav.appendChild(h('div',{className:'px-4 py-2 text-lg font-bold text-gray-800'},'WorkflowSwift'));
  nav.appendChild(h('div',{className:'px-4 text-xs text-gray-400 mb-4'},'Admin Dashboard'));
  // The Admin tab is the operator surface: every sub under it calls /admin/* (or the admin-level
  // CRUDs), all of which answer 403 "Admin access required" to a tenant user. Same rule the
  // ADASwift / FunnelSwift / CoreSwift consoles adopted: an operator-only screen is not offered to
  // a non-operator. showAdminTab() also hides it while impersonating a tenant, whose token is not an
  // admin token.
  tabs.filter(t=>t.id!=='admin'||showAdminTab()).forEach(t=>{
    const btn=h('button',{className:'tab-btn'+(app.tab===t.id?' active':''),onclick:()=>{app.tab=t.id;app.sub=subSlug(t.subs[0]);renderApp()}},t.label);
    nav.appendChild(btn);
    if(app.tab===t.id){
      // Operator-only subs, hidden from a tenant for the same reason the Admin tab is:
      // "Payments" is the platform's payment-gateway configuration and its route answers 403
      // to a non-operator. Showing it produced a raw 403 pane (measured 2026-10-17).
      t.subs.filter(s=>showAdminTab()||!OPERATOR_ONLY_SUBS.has(s)).forEach(s=>{
        const sid=subSlug(s);
        const sub=h('button',{className:'sub-item'+(app.sub===sid?' active':''),onclick:()=>{app.sub=sid;renderApp()}},s);
        nav.appendChild(sub);
      });
    }
  });
  // kanban t_06354530 — the fleet guide standard: the console links its admin guide on its OWN
  // origin, and it is reachable from the console nav rather than merely served. Literal markup (not
  // h('a',{href:…})) on purpose: the served shell must CARRY `href="/admin-guide.html"` as bytes, so
  // a grep for the entry point finds it.
  nav.insertAdjacentHTML('beforeend','<div class="px-4 mt-4"><a id="admin-guide-link" class="btn btn-ghost w-full" href="/admin-guide.html" style="text-decoration:none">📘 Admin Guide</a></div>');
  nav.appendChild(h('div',{className:'px-4 mt-6'},h('button',{className:'btn btn-ghost text-red-500 w-full',onclick:logout},'Log Out')));
  return nav;
}

function content(){
  const c=h('div',{});
  const t=app.tab,s=app.sub;

  if(t==='dashboard'){
    if(s==='overview')renderDashboardOverview(c);
    else if(s==='brand-monitor')renderCRUD(c,'brand-monitor','Brand Monitor',['name','query','active'],'/dashboard/brand-monitor',false);
    else if(s==='competitor-watch')renderCRUD(c,'competitor-watch','Competitor',['name','url','active'],'/dashboard/competitor-watch',false);
    else if(s==='prospecting')renderCRUD(c,'prospecting','Prospect',['name','industry','status'],'/dashboard/prospecting',false);
  }else if(t==='workflows'){
    if(s==='all-workflows')renderCRUD(c,'workflows','Workflow',['name','status','created_at'],'/workflows');
    // kanban t_zz-tickets (instances arm) — measured live 2026-10-14 against this app's own API:
    // POST /instances answers 405 (the route table serves GET|PUT /instances/{id} only), so this
    // panel's + Add minted nothing; and `instance_handler::update_instance` reads ONLY
    // `req.get("status")`, so the default ['name'] Edit box prefilled the instance name and saved it
    // into a request field nothing looks at — a green 200 and no change. Edit now offers the one
    // field the route honours, and the create control is therefore withdrawn.
    else if(s==='instances')renderCRUD(c,'instances','Instance',['workflow_id','status','created_at'],'/instances',['status'],undefined,false);
    // Templates are HAND-WRITTEN, not renderCRUD (kanban t_be118f36). POST /templates REQUIRES
    // `steps: Vec<TemplateStep>`, and a flat text form cannot express a step list — which is why
    // `+ Add` was withdrawn. The panel now authors the steps WITH the template: renderTemplates.
    else if(s==='templates')renderTemplates(c);
  }else if(t==='automation'){
    if(s==='automations')renderCRUD(c,'automations','Automation',['name','trigger_type','enabled'],'/automations');
    else if(s==='agents')renderCRUD(c,'agents','Agent',['name','provider','is_active'],'/agents',false);
    else if(s==='workspaces')renderCRUD(c,'workspaces','Workspace',['name','created_at'],'/workspaces',false);
  }else if(t==='crm'){
    if(s==='leads')renderCRUD(c,'leads','Lead',['name','status','source'],'/leads');
  }else if(t==='tags'){
    if(s==='tags')renderCRUD(c,'tags','Tag',['name','color'],'/tags',null,{label:'Unassign',fn:'unassignTag'});
    else if(s==='tag-groups')renderCRUD(c,'tag-groups','Tag Group',['name','description'],'/tag-groups',['name','description']);
  }else if(t==='integrations'){
    if(s==='integration-targets')renderIntegrationTargets(c);
    else if(s==='destination-values')renderDestinationValues(c);
    else if(s==='provider-keys')renderProviderKeys(c);
    else if(s==='api-keys')renderApiKeys(c);
    else if(s==='n8n-proxy')renderN8N(c);
    else if(s==='bridge')renderBridge(c);
  }else if(t==='support'){
    // kanban t_zz-tickets — measured live 2026-10-14 against this app's own API: this panel's form
    // fields and its first COLUMN were written with a key the handler does not have. The row JSON
    // from GET|POST /tickets carries `subject` (never `title`), so the first column rendered BLANK
    // on every row; `handlers::tickets_handler::CreateInput` REQUIRES `subject`, so the console's
    // own Add body ({title,status,priority}) was refused 422 "missing field `subject`"; and
    // `UpdateInput` accepts {subject,description,status,priority} — a PUT of {"name":…} answered a
    // green 200 and changed NOTHING, because no field of that name exists and every column is
    // COALESCE'd against its current value. All three now use the API's real field names.
    if(s==='tickets')renderCRUD(c,'tickets','Ticket',['subject','status','priority'],'/tickets',['subject','description','status','priority'],undefined,['subject','description','status','priority']);
  }else if(t==='profile'){
    // Defence in depth, the same shape as the Admin tab's below: a stale app.sub or a restored
    // session must not land a tenant on an operator-only pane.
    if(!showAdminTab()&&OPERATOR_ONLY_SUBS.has(subLabel(t,s))){
      c.appendChild(h('div',{className:'card'},
        h('h2',{className:'text-xl font-bold mb-4'},'Access Denied'),
        h('p',{className:'text-sm text-gray-500'},'Payment provider settings are available to the platform operator only.')));
      return c;
    }
    if(s==='my-profile')renderProfile(c);
    else if(s==='email-branding')renderBranding(c);
    else if(s==='team')renderCRUD(c,'team','Team Member',['name','email','role'],{list:'/users',create:'/users/invite',del:'/users'},false);
    else if(s==='plans-credits')renderPlansCredits(c);
    else if(s==='invoices')renderList(c,'invoices','Invoice','/invoices');
    else if(s==='payments')renderPaymentProviders(c);
    else if(s==='checkout-sessions')renderCheckoutSessions(c);
  }else if(t==='comms'){
    // The Communications -> Email Templates panel is GONE (kanban t_00e7b709). It called the
    // tenant-scoped `/email-templates` family, and every arm of that family was dead: create
    // answered 500 (its INSERT omitted the NOT NULL template_type), list answered
    // {"items":[],"count":0} over a table with rows, get/put answered 500, and its DELETE removed a
    // system-wide template for ANY authenticated caller. Templates are platform-wide, not
    // per-account (src/email.rs resolves them with no `aid` filter), and the super-admin-gated
    // Admin -> Email Templates panel (`/admin/email-templates`) is the one surface for them.
    if(s==='webhooks')renderCRUD(c,'webhooks','Webhook',['name','url','is_active'],'/webhooks',['name','url','is_active']);
  }else if(t==='admin'){
    // Defence in depth for the sidebar gate above: a deep link / stale app.tab must not reach an
    // operator-only screen either. Every Admin sub calls /admin/* and answers 403 for a non-operator.
    if(!showAdminTab()){
      c.appendChild(h('div',{className:'card'},
        h('h2',{className:'text-xl font-bold mb-4'},'Access Denied'),
        h('p',{className:'text-sm text-gray-500'},'The Admin screens are available to the platform operator only.')));
      return c;
    }
    if(s==='usage')renderAdminUsage(c);
    else if(s==='settings')renderAdminSettings(c);
    else if(s==='users')renderAdminUsers(c);
    else if(s==='accounts')renderAdminAccounts(c);
    else if(s==='portfolio-companies')renderAdminPortfolio(c);
    else if(s==='plans')renderAdminPlans(c);
    else if(s==='plan-requests')renderPlanRequests(c);
    else if(s==='surfaces')renderSurfaces(c);
    // kanban t_ws-mailtpl — the Add AND Edit field lists must carry every column the API writes.
    // They carried ['name','subject'] only, so: (a) a create sent no template_type, the handler
    // defaulted it to 'custom', and no sender selects that type - measured live 2026-10-14, the
    // resolver returns 0 rows for it; (b) is_default was never sendable, and the resolver's own
    // predicate is `template_type = $1 AND (is_default = true OR is_default IS NULL)`; and (c) the
    // BODY - the thing the screen exists to change - could not be edited at all, though
    // admin_update_email_template sets body/html_body/is_html/template_type for any of them.
    else if(s==='email-templates')renderCRUD(c,'admin-email-templates','Email Template',
      ['name','template_type','subject','body','html_body','is_default'],
      '/admin/email-templates',
      ['name','template_type','subject','body','html_body','is_default']);
    else if(s==='industry-sources')renderIndustrySources(c);
    else if(s==='site-config')renderSiteConfig(c);
  }
  return c;
}

// --- Response envelope helpers ---
// The API answers lists under a NAMED key — {users:[…]}, {providers:[…]}, {agents:[…]},
// {sources:[…]}, {workflows:[…]}, {surfaces:[…]} — and only a few under {items:[…]}.
// renderCRUD read data.items only, so every named-envelope section rendered
// "No items yet." even when rows existed; with no rows rendered there was no Edit/Del
// button, so every per-row PUT/DELETE route stayed uncalled. Unwrap the envelope.
function unwrapList(d){
  if(Array.isArray(d))return d;
  if(!d||typeof d!=='object')return [];
  if(Array.isArray(d.items))return d.items;
  // kanban t_zz-tickets (templates arm) — a NAMED array key must beat "whichever array comes first".
  // `GET /api/v1/templates` answers ONE envelope, `{templates, available_public, plan}`, and
  // serde_json serialises the object alphabetically, so the first array in `Object.keys` is
  // `available_public` — the plan's public-template catalogue (3 rows, fields
  // id/name/description/category/industry_name). The Templates panel therefore listed the WRONG
  // collection: the tenant's own `templates` (5 rows, incl. aid-scoped ones) were never shown, and
  // its "Is Public" column read a key those rows do not carry, so it rendered blank on every row
  // (measured live 2026-10-14: API `templates` = 5 rows with is_public, panel = 3 rows without it).
  for(const k of ['templates']) if(Array.isArray(d[k])) return d[k];
  for(const k of Object.keys(d)){ if(Array.isArray(d[k]))return d[k]; }
  return [];
}
// Row identifier for the generic Edit/Del actions: several resources key on something
// other than `id` (payment providers on provider_type, sources on industry_slug, …).
function rowId(it){
  if(!it||typeof it!=='object')return '';
  return it.id||it.provider_type||it.slug||it.uuid||it.api_key_id||it.industry_slug||it.name||'';
}
// GET <ep>/<id> answers a NAMED single envelope too ({surface:{…}}, {user:{…}}), so the edit
// form prefilled every field blank. Unwrap one level when the payload is a wrapper object.
function unwrapOne(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return {};
  if(d.id||d.name||d.slug||d.provider_type)return d;
  for(const k of Object.keys(d)){
    const v=d[k];
    if(v&&typeof v==='object'&&!Array.isArray(v))return v;
  }
  return d;
}

// --- Generic CRUD ---
// `editFields` (optional) = the fields the Edit form exposes; without it Edit stays on
// ['name'] as before. Sections whose real shape is name/slug/description (surfaces) pass it
// so an edit can actually change the slug/description, not just the name.
// `addFields` (optional) = the fields the ADD form exposes when they differ from the COLUMN set —
// a resource whose table is deliberately narrow (Plans) still needs its whole settable surface in
// the Add form. Omitted -> the columns are also the Add form, exactly as before.
async function renderCRUD(container,key,label,fields,ep,editFields,extraAction,addFields){
  // `ep` is normally the resource path. It may also be {list,create,del} when a resource's list and
  // its create live at different paths (Team: GET /users, POST /users/invite).
  const EP=(typeof ep==='string')?{list:ep,create:ep,del:ep}:ep;
  // `editFields === false` means this resource has NO update route, so no Edit button is rendered —
  // a button that cannot do anything is worse than no button. Measured live on this app's own API:
  // GET and PUT <ep>/{id} both answer 405 Method Not Allowed for the brand-monitor, competitor-watch,
  // prospecting, agents, workspaces and Team panels; admin/email-templates serves PUT but no
  // GET-by-id, so its Edit could open only once the form stopped fetching the row.
  const canEdit=editFields!==false;
  const ef=(editFields&&editFields!==false)?editFields:['name'];
  // `addFields === false` is the same rule for the CREATE route, and it is measured, not assumed
  // (2026-10-14): POST /instances answers 405 Method Not Allowed — the route table serves only
  // GET|PUT /instances/{id} — so the Instances panel's + Add could never write anything. A button
  // that cannot do anything is worse than no button — this file's own rule, one arm over.
  // (The Templates panel used to be the second row here: POST /templates REQUIRES `steps`, and a flat
  // text form cannot express one. It is hand-written now — see renderTemplates, kanban t_be118f36 —
  // so `+ Add` is back there, backed by a real step editor.)
  const canAdd=addFields!==false;
  container.innerHTML=`<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">${label}s</h2>${canAdd?'<button class="btn btn-primary btn-sm" id="addBtn">+ Add</button>':''}</div><div id="list"><p class="text-gray-400 text-sm">Loading...</p></div></div>`;
  const data=await api(EP.list);
  const items=unwrapList(data);
  const list=container.querySelector('#list');
  const openAdd=()=>showForm(key,label,(addFields&&addFields.length)?addFields:fields,EP,null,()=>renderPage());
  if(!items.length){
    list.innerHTML='<p class="text-gray-400 text-sm">No items yet.</p>';
    const ab=container.querySelector('#addBtn'); if(ab)ab.onclick=openAdd;
    return;
  }
  let cols=fields;
  if(!cols.length&&items[0])cols=Object.keys(items[0]).filter(k=>k!=='id'&&k!=='aid'&&k!=='updated_at'&&k!=='created_at').slice(0,5);
  const thead=cols.map(f=>`<th>${f.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</th>`).join('');
  // kanban t_ws-team-role — a `role` column shows the WRITTEN role, never the database's own enum
  // (`user`, `company_admin`, ...). Same roleLabel the Profile screen uses; an unknown value is
  // shown as-is and a missing one as an em-dash, so an operator reads a role, not a column value.
  const cellVal=(f,v)=>f==='role'?escHtml(roleLabel(v)):escHtml(String(v===undefined||v===null?'':v));
  // DO NOT DRAW A DELETE THE API WILL REFUSE (measured live 2026-10-14). `remove_user` answers
  // 422 "Cannot remove yourself" for the caller's own row and 403 "Cannot remove the super admin"
  // for a super-admin row, and the Team table drew a Del button on both - the exact "a button that
  // cannot do anything is worse than no button" this file's own rule forbids. `ME` is the
  // /auth/me payload read once per page load; when it is absent (a 401 that has already switched
  // the screen to login) only the super-admin arm applies, so a failed read never hides a real
  // control. Every other row keeps its Del button.
  const canDel=it=>{
    const r=String((it&&it.role)||'').toLowerCase();
    if(r==='super_admin')return false;
    if(ME&&ME.id&&String(rowId(it))===String(ME.id))return false;
    return true;
  };
  const tbody=items.map(it=>'<tr>'+cols.map(f=>`<td>${cellVal(f,it[f])}</td>`).join('')+
    `<td class="text-right">`+(extraAction?`<button class="btn btn-sm btn-ghost" data-extra="${escHtml(rowId(it))}">${extraAction.label}</button>`:'')
    +(canEdit?`<button class="btn btn-sm btn-ghost" data-edit="${escHtml(rowId(it))}">Edit</button>`:'')
    +(canDel(it)?`<button class="btn btn-sm btn-danger" data-del="${escHtml(rowId(it))}">Del</button>`:'')+'</td></tr>').join('');
  list.innerHTML=`<table class="table"><thead><tr>${thead}<th style="width:140px"></th></tr></thead><tbody>${tbody}</tbody></table>`;
  // Bound by DATA attribute (no inline onclick string) and handed the ROW OBJECT the list already
  // has, so opening Edit never issues GET <ep>/{id} — the route six of these panels do not serve.
  list.querySelectorAll('button[data-edit]').forEach(b=>b.onclick=(ev)=>{ev.preventDefault();
    const id=b.getAttribute('data-edit');const it=items.find(x=>String(rowId(x))===String(id));
    showForm(key,label,ef,EP,id,renderPage,it);});
  list.querySelectorAll('button[data-del]').forEach(b=>b.onclick=(ev)=>{ev.preventDefault();
    delIt(key,label,EP.del,b.getAttribute('data-del'));});
  if(extraAction)list.querySelectorAll('button[data-extra]').forEach(b=>b.onclick=(ev)=>{ev.preventDefault();
    window[extraAction.fn](b.getAttribute('data-extra'));});
  const ab=container.querySelector('#addBtn'); if(ab)ab.onclick=openAdd;
}

function renderPage(){renderApp()}
window.editIt=function(key,label,ep,id,ef,row){showForm(key,label,ef?ef.split(','):['name'],ep,id,renderPage,row)}
window.delIt=async function(key,label,ep,id){if(!confirm('Delete?'))return;const r=await api(ep+'/'+id,{method:'DELETE'});showMsg(r?'Deleted':('Delete failed: '+LAST_ERR),r?undefined:'error');renderPage()}

async function showForm(key,label,fields,ep,id,cb,row){
  const EP=(typeof ep==='string')?{list:ep,create:ep}:ep;
  // Prefer the row the caller already has from the list; only fall back to GET <ep>/{id} when the
  // caller has none (the portfolio panel passes its row in). admin/email-templates has PUT but no
  // GET-by-id, so this is also what lets its Edit open at all.
  let item=row||null;
  if(!item&&id)item=unwrapOne(await api(EP.list+'/'+id));
  if(!item)item={};
  const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
  const box=h('div',{className:'modal-box'});
  // kanban t_ws-team-role — a `role` field is a LABELLED select, not a free-text box an operator
  // has to fill with the database's own enum. The invite route accepts exactly these two tenant
  // roles (src/handlers/user_handler.rs invite_user refuses any other), so offering them as
  // written names removes the guess and the 422 that came with a typo.
  const INVITABLE_ROLES=[['team_member','Team member'],['company_admin','Company admin']];
  const fieldBox=f=>{
    const lab=f.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());
    if(f==='role'){
      const cur=String(item.role==null||item.role===''?'team_member':item.role);
      const opts=INVITABLE_ROLES.map(([v,t])=>`<option value="${v}"${v===cur?' selected':''}>${t}</option>`).join('');
      return `<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${lab}</label><select class="input" name="${f}">${opts}</select></div>`;
    }
    // kanban t_ws-mailtpl — a template_type is a SELECT of the types this app's senders actually
    // ask for (measured in src: welcome, password_reset, team_invite, workflow_notify,
    // purchase_confirmed, email_test). A free-text box is how the dead 'custom' row got minted: the
    // handler defaults an absent template_type to 'custom', and the sender resolver
    // (`WHERE template_type = $1 AND (is_default = true OR is_default IS NULL)`) selects 'custom'
    // for nobody, so a template created without this field could never be sent and the panel gave
    // an operator no way to see why.
    const TEMPLATE_TYPES=['welcome','password_reset','team_invite','workflow_notify','purchase_confirmed','email_test'];
    if(f==='template_type'){
      const cur=String(item.template_type==null||item.template_type===''?'welcome':item.template_type);
      const opts=TEMPLATE_TYPES.map(v=>`<option value="${v}"${v===cur?' selected':''}>${v}</option>`).join('');
      return `<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${lab}</label><select class="input" name="${f}">${opts}</select></div>`;
    }
    // Booleans must be REAL booleans in the JSON body: a text input hands back the string "true",
    // and the handler reads these with `as_bool()`, which answers None for a string and then
    // applies its default. A select keeps the payload typed.
    if(f==='is_default'||f==='is_html'){
      const cur=String(item[f]===undefined||item[f]===null?(f==='is_html'?'true':'false'):item[f]);
      const opts=['true','false'].map(v=>`<option value="${v}"${v===cur?' selected':''}>${v}</option>`).join('');
      return `<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${lab}</label><select class="input" name="${f}">${opts}</select></div>`;
    }
    // The wording itself is prose, not a one-line token: a single-line <input> cannot be edited
    // honestly. Same name= contract, so the collector below is unchanged.
    if(f==='body'||f==='html_body'){
      // NOTE, measured on this app's own API 2026-10-14: `admin_list_email_templates` selects
      // id/name/subject/template_type/is_html/is_default and NOT body/html_body, and
      // `admin/email-templates/{id}` serves PUT but no GET, so the stored wording cannot be SHOWN
      // here. The collector below skips a blank input, and the PUT uses COALESCE, so an empty box
      // leaves the stored wording untouched. The hint says exactly that rather than showing an
      // empty box the operator would read as "this template has no body".
      const v=item[f]===undefined||item[f]===null?'':String(item[f]);
      return `<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${lab}</label><textarea class="input" name="${f}" rows="6" style="width:100%;font-family:ui-monospace,monospace" placeholder="Leave empty to keep the wording already stored">${v.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea></div>`;
    }
    return `<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${lab}</label><input class="input" name="${f}" value="${item[f]===undefined||item[f]===null?'':String(item[f]).replace(/"/g,'&quot;')}"></div>`;
  };
  box.innerHTML=`<h2 class="text-lg font-bold mb-4">${id?'Edit':'Add'} ${label}</h2><form id="mf">`+
    fields.map(fieldBox).join('')+
    `</form><div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Save</button></div>`;
  box.querySelector('#cancelBtn').onclick=()=>modal.remove();
  box.querySelector('#saveBtn').onclick=async()=>{
    // Skip blank inputs: an empty string is not "unset" server-side — POST /surfaces would
    // store slug='' instead of slugifying the name, and PUT uses COALESCE (blank can't clear).
    const body={};box.querySelectorAll('#mf input,#mf textarea,#mf select').forEach(inp=>{if(String(inp.value).trim()!=='')body[inp.name]=inp.value});
    // `EP.bools` names the fields the BACKEND reads with `as_bool()`. A select hands back the
    // STRING "true"/"false"; `as_bool()` answers None for a string, so the handler would silently
    // apply its default - the same class as the `credit_cost` string/i32 422 fixed above.
    ['is_default','is_html'].forEach(k=>{if(k in body)body[k]=(String(body[k]).toLowerCase()==='true')});
    // `EP.ints` names the fields the BACKEND declares as a number. An <input> hands back a STRING,
    // and `credit_cost: Option<i32>` refuses `"7"` with
    // 422 `invalid type: string "7", expected i32` (measured live against this app's own API
    // 2026-10-14) - which is why Save on the Industry Sources panel never stored anything even when
    // the route existed. Only the named fields are coerced, and only when the text is a finite
    // number, so a text field whose value merely LOOKS numeric is left exactly as typed.
    ((EP&&EP.ints)||[]).forEach(k=>{
      if(k in body){const n=Number(body[k]); if(String(body[k]).trim()!==''&&Number.isFinite(n))body[k]=n;}
    });
    // `EP.upsert` marks a resource whose ONLY write is an upsert POST (admin/industry-sources:
    // POST /admin/industry-sources is `ON CONFLICT (industry_slug, source_name) DO UPDATE`, and its
    // /{id} route serves DELETE only, so the generic Edit's PUT answered 405 Method Not Allowed -
    // measured live 2026-10-14, and this file's own rule is that a button which cannot do anything
    // is worse than no button). Edit saves with the same POST the Add form uses.
    const upsert=!!EP.upsert;
    const r=await api((id&&!upsert)?(EP.list+'/'+id):EP.create,{method:(id&&!upsert)?'PUT':'POST',body:JSON.stringify(body)});
    if(r)showMsg('Saved!');else showMsg('Error saving: '+LAST_ERR,'error');
    if(r){modal.remove();if(cb)cb();}
  };
  modal.appendChild(box);document.body.appendChild(modal);
}

// Fields are the API's real ones (name, slug, description); slug may be omitted and is

// --- Plan requests (2026-10-19) --------------------------------------------------------------
// WHY THIS SCREEN EXISTS: the customer's Plan & Billing screen files "Plan request — <plan>" as a
// real ticket with source='plan_request' (POST /tickets). `GET /tickets` is TENANT-SCOPED, and this
// console's own Support > Tickets panel calls exactly that route — so the request sat inside the
// customer's workspace and the operator could not see it without impersonating them first. Measured
// live 2026-10-19: a customer filed one (201) and a super-admin session's ticket list answered 200
// without it, while /admin/tickets was 404. The super-admin read route now exists; this panel is
// its screen. Read across workspaces, act by status only — the customer's words are not editable
// from here.
function renderPlanRequests(c){
  const card=h('div',{className:'card'});
  card.appendChild(h('h2',{className:'text-xl font-bold mb-2'},'Plan requests'));
  card.appendChild(h('p',{className:'text-sm text-gray-500 mb-4'},
    'Every workspace that asked to move to a paid plan. Nothing is charged when a request is filed: '
    +'our team makes the switch on the workspace, then marks the request handled here. Marking it '
    +'emails the customer straight away, so nobody is left waiting on an answer.'));
  const bar=h('div',{className:'flex items-center gap-3 mb-3'});
  const note=h('span',{className:'text-xs text-gray-500'},'loading…');
  const refresh=h('button',{className:'btn btn-sm btn-outline',onClick:()=>load()},'Refresh');
  bar.appendChild(refresh); bar.appendChild(note);
  card.appendChild(bar);
  const body=h('div',{});
  card.appendChild(body);
  c.appendChild(card);

  async function load(){
    note.textContent='loading…';
    while(body.firstChild)body.removeChild(body.firstChild);
    const d=await api('/admin/tickets?source=plan_request&per_page=100');
    if(d===null){
      note.textContent='';
      body.appendChild(h('div',{className:'text-sm text-red-600'},
        'Could not read the queue: '+(LAST_ERR||'request failed')));
      return;
    }
    const rows=(d&&(d.items||d.tickets))||[];
    const isOpen=r=>!/^(closed|resolved|done)$/i.test(String((r&&r.status)||'open'));
    const open=rows.filter(isOpen).length;
    note.textContent=rows.length+' request(s) — '+open+' still open';
    if(!rows.length){
      body.appendChild(h('div',{className:'text-sm text-gray-500'},
        'No plan requests yet. A customer who presses “Request this plan” on their Plan & Billing '
        +'screen appears here with the workspace it came from.'));
      return;
    }
    const tbl=h('table',{className:'table',id:'planRequestsTable'});
    const head=h('tr',{});
    ['Workspace','Request','Status','Filed',''].forEach(x=>head.appendChild(h('th',{},x)));
    tbl.appendChild(h('thead',{},head));
    const tb=h('tbody',{});
    rows.forEach(r=>{
      const tr=h('tr',{});
      tr.appendChild(h('td',{className:'font-medium'}, r.account_name||'(unknown workspace)'));
      tr.appendChild(h('td',{className:'text-xs'}, r.subject||''));
      tr.appendChild(h('td',{},h('span',{className:'badge '+(isOpen(r)?'badge-yellow':'badge-green')},
        String(r.status||'open'))));
      tr.appendChild(h('td',{className:'text-xs text-gray-500'},String(r.created_at||'').slice(0,10)));
      const td=h('td',{});
      if(isOpen(r)){
        const b=h('button',{className:'btn btn-sm btn-outline',onClick:async()=>{
          b.disabled=true; b.textContent='Saving…';
          const ok=await api('/admin/tickets/'+r.id,{method:'PUT',body:JSON.stringify({status:'closed'})});
          if(ok===null){
            b.disabled=false; b.textContent='Mark handled';
            body.appendChild(h('div',{className:'text-sm text-red-600 mt-2'},
              'Could not update that request: '+(LAST_ERR||'request failed')));
            return;
          }
          showMsg('Marked handled');
          load();
        }},'Mark handled');
        td.appendChild(b);
      }
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    body.appendChild(tbl);
  }
  load();
}

// --- Templates (kanban t_be118f36) ----------------------------------------------------------
// HAND-WRITTEN, not renderCRUD, for the same reason Integration Targets is: a template is not a
// flat row of text. `POST /api/v1/templates` REQUIRES `steps: Vec<TemplateStep>` — measured live
// 2026-10-14: this console's old Add body `{name,category,description}` answered
// `422 Failed to deserialize the JSON body into the target type: missing field `steps`` — while
// `{…, steps: []}` answered 201. The console had NO step editor at all (`GET /templates/{id}/steps`
// is read-only; the only step writers are import/export), so a template created from here could only
// ever be an empty shell — which is why `+ Add` was WITHDRAWN rather than shipped as a button that
// cannot work. This is the step editor that closes it: a template is authored WITH its steps — add,
// name, configure, move up/down, remove — and the panel refuses to save the empty shell the API
// would happily store and `POST /templates/{id}/install` would later refuse ("Template has no
// steps").
//
// The step-1 rule is stated on the step itself, not discovered at Save: the API refuses a template
// whose lowest `sort_order` is not a Data Card ("...would be step 1 of the workflow this template
// installs") because install copies these steps into a new workflow verbatim, and the Builder
// refuses a workflow that opens with anything else.
//
// Two vocabularies are READ, never written here, because the app owns them:
//  * step types — exactly the types the engine can execute (`src/execution.rs`
//    EXECUTABLE_STEP_TYPES; the same arrays www-app's Builder offers, and the app-side test
//    `the_console_picker_offers_only_executable_step_types` now pins BOTH consoles to it). A step
//    type with no executor is a step that silently does nothing.
//  * Notify channels — built from `GET /notify/channels`, the channels THIS install can deliver on.
//    `email`/`sms` are fail-closed until the matching sender exists under Admin > Settings, and the
//    write path refuses a step that names one of them without a sender.
const STEP_TYPES = [
  { k:'data-card', label:'Data Card', hint:"Always step 1 — pulls the run's data from a named dashboard widget." },
  { k:'ai-action', label:'AI Action', hint:'Sends your prompt to the AI provider key you connected under Provider Keys (0 credits — it runs on YOUR key).' },
  { k:'notify', label:'Notify', hint:"Reaches your account's own people, or POSTs the run data to a webhook you own." },
  { k:'delay', label:'Delay / Wait', hint:'Parks the instance until due; the execution worker advances it.' },
  { k:'fork', label:'Fork', hint:'Splits the run into parallel branches.' },
];
const STEP_TYPES_EXTRA = [
  { k:'http-request', label:'HTTP Request', hint:'Calls your URL with the method you choose, inside this run.' },
  { k:'action', label:'Action', hint:'The same outbound call, for API actions.' },
  { k:'render_video', label:'Render Video', hint:'Calls your provider endpoint and logs the result under Renditions.' },
  { k:'render_image', label:'Render Image', hint:'Calls your provider endpoint and logs the result under Renditions.' },
  { k:'render_audio', label:'Render Audio', hint:'Calls your provider endpoint and logs the result under Renditions.' },
  { k:'condition', label:'Condition' }, { k:'webhook', label:'Webhook' }, { k:'manual', label:'Manual / Approval' },
];
const ALL_STEP_TYPES = STEP_TYPES.concat(STEP_TYPES_EXTRA);
const stepTypeLabel = k => ((ALL_STEP_TYPES.filter(t=>t.k===k)[0])||{}).label||k;
const stepTypeHint = k => ((ALL_STEP_TYPES.filter(t=>t.k===k)[0])||{}).hint||'';
// The four AI providers this app can really call (src/ai_llm.rs AI_PROVIDERS): an AI Action step
// naming anything else is refused on the way in.
const AI_PROVIDER_SLOTS=[['openai','OpenAI'],['anthropic','Anthropic'],['deepseek','DeepSeek'],['gemini','Google Gemini']];
const NOTIFY_CHANNEL_LABELS={webhook:'Webhook',email:'Email',sms:'SMS'};
const NOTIFY_SCOPE_LABELS={all_users:'All account users',billing_contact:'Billing contact',user:'One named account user'};
function tplStepSummary(s){const c=(s&&s.config&&typeof s.config==='object')?s.config:{};
  return c.widget_name||c.prompt||c.url||c.recipient_scope||c.endpoint||(c.duration_seconds?(c.duration_seconds+'s'):'')
    ||(Array.isArray(c.branches)?(c.branches.length+' branch(es)'):'')||'—';}
const tplCfg=s=>(s&&s.cfg&&typeof s.cfg==='object')?s.cfg:{};

function renderTemplates(c){
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Templates</h2>'
    +'<button class="btn btn-primary btn-sm" id="tplAdd">+ Add Template</button></div>'
    +'<p class="text-xs text-gray-400 mb-4">A template is a reusable blueprint, and creating one saves its STEPS with it. Step 1 must be a Data Card — install copies these steps into a new workflow, and the Builder refuses a workflow that opens with anything else.</p>'
    +'<div id="tplList"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const list=c.querySelector('#tplList');
  // Ownership is the API's own answer (`is_mine` on every row): `update_template` and
  // `delete_template` scope by `aid`, so Edit/Del on a platform (aid IS NULL) template answer 404 —
  // measured live. The panel draws those controls only on rows that really carry them.
  const load=async()=>{
    const d=await api('/templates');
    if(d===null){list.innerHTML='<p class="text-red-400 text-sm">Could not load templates: '+escHtml(LAST_ERR||'request failed')+'</p>';return}
    const items=unwrapList(d);
    if(!items.length){list.innerHTML='<p class="text-gray-400 text-sm">No templates yet.</p>';return}
    list.innerHTML='<table class="table"><thead><tr><th>Name</th><th>Category</th><th>Public</th><th>Owner</th><th style="width:210px"></th></tr></thead><tbody>'
      +items.map(t=>'<tr><td><strong>'+escHtml(t.name)+'</strong></td><td>'+escHtml(t.category)+'</td>'
        +'<td>'+(t.is_public?'Yes':'No')+'</td>'
        +'<td>'+(t.is_mine?'Yours':'<span class="text-gray-400" title="A platform template, shared with every account — your account cannot edit or delete it">Platform</span>')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-ghost" data-steps="'+escHtml(t.id)+'">Steps</button>'
        +(t.is_mine?'<button class="btn btn-sm btn-ghost" data-edit="'+escHtml(t.id)+'">Edit</button>'
                   +'<button class="btn btn-sm btn-danger" data-del="'+escHtml(t.id)+'">Del</button>':'')
        +'</td></tr>').join('')+'</tbody></table>';
    list.querySelectorAll('[data-steps]').forEach(b=>b.onclick=()=>{
      const t=items.find(x=>String(x.id)===b.getAttribute('data-steps'));if(t)showTemplateSteps(t);});
    list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
      const t=items.find(x=>String(x.id)===b.getAttribute('data-edit'));
      if(t)showForm('templates','Template',['name','category','description'],'/templates',t.id,load,t);});
    list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const t=items.find(x=>String(x.id)===b.getAttribute('data-del'));if(!t)return;
      if(!confirm('Delete the template "'+t.name+'" and its steps?'))return;
      const r=await api('/templates/'+encodeURIComponent(t.id),{method:'DELETE'});
      showMsg(r?'Template deleted':('Delete failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
      if(r)load();});
  };
  c.querySelector('#tplAdd').onclick=()=>showTemplateForm(load);
  load();
}

// The Steps viewer. It is also the honest answer to "why will this template not install?" — an
// empty template is refused by `POST /templates/{id}/install` with "Template has no steps", and four
// of the five seeded platform templates are empty.
async function showTemplateSteps(t){
  const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
  const box=h('div',{className:'modal-box'});box.style.maxWidth='780px';box.style.maxHeight='80vh';box.style.overflow='auto';
  box.innerHTML='<h2 class="text-lg font-bold mb-3">'+escHtml(t.name)+' — steps</h2><div id="ts_body"><p class="text-gray-400 text-sm">Loading...</p></div>'
    +'<div class="flex justify-end mt-4"><button class="btn btn-ghost" id="ts_close">Close</button></div>';
  modal.appendChild(box);document.body.appendChild(modal);
  box.querySelector('#ts_close').onclick=()=>modal.remove();
  const body=box.querySelector('#ts_body');
  const d=await api('/templates/'+encodeURIComponent(t.id)+'/steps');
  if(d===null){body.innerHTML='<p class="text-red-400 text-sm">Could not read the steps: '+escHtml(LAST_ERR||'request failed')+'</p>';return}
  const steps=(d&&d.steps)||[];
  if(!steps.length){body.innerHTML='<p class="text-sm text-red-500">This template has no steps, and installing it is refused ("Template has no steps"). A template created from this panel always carries its steps, so this row predates the editor.</p>';return}
  body.innerHTML='<table class="table"><thead><tr><th>#</th><th>Type</th><th>Name</th><th>Configuration</th></tr></thead><tbody>'
    +steps.map((s,i)=>'<tr><td>'+(i+1)+'</td><td class="text-xs">'+escHtml(stepTypeLabel(s.step_type))+'</td>'
      +'<td>'+escHtml(s.name)+'</td><td class="text-xs text-gray-600">'+escHtml(tplStepSummary(s))+'</td></tr>').join('')
    +'</tbody></table>';
}

// The Add form: template metadata + the step editor that `POST /templates` requires.
async function showTemplateForm(onSaved){
  // Read the vocabularies the write path validates. A failed read degrades to the smallest honest
  // set (webhook is always deliverable; `webhook` needs no provider) instead of blocking the form.
  const vocab={channels:['webhook'],scopes:['all_users','billing_contact','user'],people:[],industries:[]};
  const chd=await api('/notify/channels');
  if(chd&&Array.isArray(chd.channels)&&chd.channels.length)vocab.channels=chd.channels;
  if(chd&&Array.isArray(chd.scopes)&&chd.scopes.length)vocab.scopes=chd.scopes;
  const rcd=await api('/notify/recipients');
  if(rcd&&Array.isArray(rcd.recipients))vocab.people=rcd.recipients;
  const ind=await api('/industries');
  if(ind&&Array.isArray(ind.industries))vocab.industries=ind.industries;

  const steps=[{type:'data-card',name:'',desc:'',cfg:{}}];
  const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
  const box=h('div',{className:'modal-box'});box.style.maxWidth='880px';box.style.maxHeight='88vh';box.style.overflow='auto';
  box.innerHTML='<h2 class="text-lg font-bold mb-1">Add Template</h2>'
    +'<p class="text-xs text-gray-500 mb-4">The steps below are saved WITH the template — that is what the API requires, and what “install as workflow” copies into a new workflow.</p>'
    +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Name</label>'
    +'<input class="input" id="tp_name" placeholder="Weekly lead follow-up"></div>'
    +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Category</label>'
    +((vocab.industries.length)
      ? '<select class="input" id="tp_cat">'+vocab.industries.map(i=>'<option value="'+escHtml(i.slug)+'">'+escHtml(i.name)+'</option>').join('')+'</select>'
        +'<div class="text-xs text-gray-500 mt-1">The same category list the industry picker uses.</div>'
      : '<input class="input" id="tp_cat_text" placeholder="operations">'
        +'<div class="text-xs text-gray-500 mt-1">The category list could not be read — type the slug. It is required (the column is NOT NULL).</div>')
    +'</div>'
    +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Description</label>'
    +'<textarea class="input" id="tp_desc" rows="2" placeholder="What this blueprint is for"></textarea></div>'
    +'<div class="flex items-center justify-between mt-4 mb-2"><span class="text-xs font-bold text-gray-500">STEPS</span>'
    +'<button class="btn btn-ghost btn-sm" id="tp_addstep">+ Add step</button></div>'
    +'<div id="tp_steps"></div>'
    +'<div id="tp_msg" class="text-sm mt-3"></div>'
    +'<div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" id="tp_cancel">Cancel</button>'
    +'<button class="btn btn-primary" id="tp_save">Save Template</button></div>';
  modal.appendChild(box);document.body.appendChild(modal);
  const stepsEl=box.querySelector('#tp_steps'),msgEl=box.querySelector('#tp_msg'),saveBtn=box.querySelector('#tp_save');

  // Every field is bound into the `steps` model on input, so a RE-PAINT (add / remove / move /
  // change type / change channel) never loses what is already typed.
  const sync=()=>{
    stepsEl.querySelectorAll('[data-i][data-f]').forEach(el=>{const i=+el.getAttribute('data-i');steps[i][el.getAttribute('data-f')]=el.value;});
    stepsEl.querySelectorAll('[data-i][data-c]').forEach(el=>{const i=+el.getAttribute('data-i');steps[i].cfg=steps[i].cfg||{};steps[i].cfg[el.getAttribute('data-c')]=el.value;});
  };
  const cfgInput=(i,key,label,type,ph)=>'<div class="mt-2"><label class="block text-xs font-medium text-gray-500 mb-1">'+label+'</label>'
    +'<input class="input" '+(type?'type="'+type+'" ':'')+'data-i="'+i+'" data-c="'+key+'" placeholder="'+escHtml(ph||'')+'" '
    +'value="'+escHtml(tplCfg(steps[i])[key]==null?'':tplCfg(steps[i])[key])+'"></div>';
  const cfgArea=(i,key,label,ph)=>'<div class="mt-2"><label class="block text-xs font-medium text-gray-500 mb-1">'+label+'</label>'
    +'<textarea class="input" rows="2" data-i="'+i+'" data-c="'+key+'" placeholder="'+escHtml(ph||'')+'">'
    +escHtml(tplCfg(steps[i])[key]==null?'':tplCfg(steps[i])[key])+'</textarea></div>';
  const cfgSelect=(i,key,label,opts,cur)=>'<div class="mt-2"><label class="block text-xs font-medium text-gray-500 mb-1">'+label+'</label>'
    +'<select class="input" data-i="'+i+'" data-c="'+key+'">'
    +opts.map(o=>'<option value="'+escHtml(o[0])+'"'+(String(cur)===String(o[0])?' selected':'')+'>'+escHtml(o[1])+'</option>').join('')
    +'</select></div>';

  // Per-step-type configuration. The fields are the ones the engine's executor for that type reads
  // (`src/execution.rs`), so a saved step is runnable, not just stored.
  const cfgFields=(i)=>{
    const s=steps[i],c=tplCfg(s);
    let out='<div class="mt-2"><label class="block text-xs font-medium text-gray-500 mb-1">Description (optional)</label>'
      +'<input class="input" data-i="'+i+'" data-f="desc" placeholder="What this step does" value="'+escHtml(s.desc||'')+'"></div>';
    switch(s.type){
      case 'data-card':
        out+=cfgInput(i,'widget_name','Widget name — which dashboard widget feeds this run','text','Leads this week');break;
      case 'ai-action':
        out+=cfgSelect(i,'provider','Provider — the one whose key this step runs on',AI_PROVIDER_SLOTS,c.provider||'');
        out+=cfgArea(i,'prompt','Prompt','Summarise the incoming lead and draft a reply');break;
      case 'notify': {
        const chan=String(c.channel||vocab.channels[0]||'webhook');
        out+=cfgSelect(i,'channel','Channel — only the channels this install can deliver on',vocab.channels.map(x=>[x,NOTIFY_CHANNEL_LABELS[x]||x]),chan);
        if(chan==='webhook'){
          out+=cfgInput(i,'recipient','Webhook URL','text','https://hooks.example.com/incoming');
          out+=cfgArea(i,'message','Message (optional)','The workflow ran');
        }else{
          const scope=String(c.recipient_scope||vocab.scopes[0]||'all_users');
          out+=cfgSelect(i,'recipient_scope',"Recipient — your account's own people only",vocab.scopes.map(x=>[x,NOTIFY_SCOPE_LABELS[x]||x]),scope);
          if(scope==='user'){
            out+=cfgSelect(i,'recipient_user_id','Account user',vocab.people.map(p=>[p.user_id,(p.name||p.email)+(p.billing_contact?' — billing contact':'')+(chan==='sms'&&!p.has_phone?' (no phone)':'')]),c.recipient_user_id||'');
            if(!vocab.people.length)out+='<div class="text-xs text-gray-500 mt-1">No people on this account yet.</div>';
          }
          if(chan==='email')out+=cfgInput(i,'subject','Subject','text','WorkflowSwift notification');
          out+=cfgArea(i,'message','Message','The workflow ran');
        }
        break;
      }
      case 'delay': case 'wait':
        out+=cfgInput(i,'duration_seconds','Wait (seconds)','number','60');break;
      case 'fork':
        out+=cfgArea(i,'branches','Branches (one per line)','branch-a');break;
      case 'http-request': case 'action':
        out+=cfgSelect(i,'method','Method',[['GET','GET'],['POST','POST'],['PUT','PUT'],['PATCH','PATCH'],['DELETE','DELETE']],c.method||'POST');
        out+=cfgInput(i,'url','URL — called inside this run, as your account','text','https://api.example.com/lead');break;
      case 'webhook':
        out+=cfgInput(i,'url','Webhook URL','text','https://hooks.example.com/incoming');break;
      case 'render_video': case 'render_image': case 'render_audio':
        out+=cfgInput(i,'provider','Provider','text','heygen');
        out+=cfgInput(i,'endpoint','Endpoint','text','https://api.provider.com/render');break;
      default: break;
    }
    return out;
  };

  const stepRow=(i)=>{
    const s=steps[i];
    let typeOpts='';
    [['Core step types',STEP_TYPES],['More',STEP_TYPES_EXTRA]].forEach(g=>{
      typeOpts+='<optgroup label="'+g[0]+'">'+g[1].map(t=>'<option value="'+t.k+'"'+(t.k===s.type?' selected':'')+'>'+t.label+'</option>').join('')+'</optgroup>';
    });
    const head='<div class="flex items-center gap-2"><span class="text-xs font-bold" style="min-width:16px">'+(i+1)+'</span>'
      +'<select class="input" data-i="'+i+'" data-f="type" style="max-width:200px">'+typeOpts+'</select>'
      +'<input class="input" data-i="'+i+'" data-f="name" placeholder="Step name (e.g. Fetch this week\'s leads)" value="'+escHtml(s.name||'')+'">'
      +'<button class="btn btn-sm btn-ghost" data-mv="'+i+'" data-dir="-1"'+(i===0?' disabled':'')+' title="Move up">↑</button>'
      +'<button class="btn btn-sm btn-ghost" data-mv="'+i+'" data-dir="1"'+(i===steps.length-1?' disabled':'')+' title="Move down">↓</button>'
      +'<button class="btn btn-sm btn-danger" data-rm="'+i+'" title="Remove this step">✕</button></div>';
    let note='';
    if(i===0){
      note='<div class="text-xs mt-1 '+(s.type==='data-card'?'text-gray-500':'text-red-500')+'">'
        +(s.type==='data-card'?"Step 1 — the Data Card that pulls the run's data."
          :'Step 1 must be a Data Card: install copies these steps into a new workflow, and the API refuses a template that would open with anything else.')+'</div>';
    }else if(stepTypeHint(s.type)){note='<div class="text-xs text-gray-500 mt-1">'+escHtml(stepTypeHint(s.type))+'</div>';}
    return '<div class="card" style="padding:10px;margin-bottom:8px;border:1px solid #e5e7eb">'+head+note+cfgFields(i)+'</div>';
  };

  const bindRows=()=>{
    stepsEl.querySelectorAll('[data-i][data-f]').forEach(el=>{
      const on=()=>{const i=+el.getAttribute('data-i');steps[i][el.getAttribute('data-f')]=el.value;};
      el.oninput=on;el.onchange=on;});
    stepsEl.querySelectorAll('[data-i][data-c]').forEach(el=>{
      const on=()=>{const i=+el.getAttribute('data-i');steps[i].cfg=steps[i].cfg||{};steps[i].cfg[el.getAttribute('data-c')]=el.value;};
      el.oninput=on;el.onchange=on;});
    // The three controls whose VALUE changes the fields below them re-paint: a step's type, and a
    // Notify step's channel and recipient scope.
    stepsEl.querySelectorAll('[data-f="type"],[data-c="channel"],[data-c="recipient_scope"]').forEach(el=>{
      el.onchange=()=>{sync();paint();};});
    stepsEl.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
      sync();const i=+b.getAttribute('data-mv'),j=i+(+b.getAttribute('data-dir'));
      if(j<0||j>=steps.length)return;const swap=steps[i];steps[i]=steps[j];steps[j]=swap;paint();});
    stepsEl.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
      sync();steps.splice(+b.getAttribute('data-rm'),1);paint();});
  };
  const paint=()=>{stepsEl.innerHTML=steps.map((s,i)=>stepRow(i)).join('');bindRows();};

  box.querySelector('#tp_cancel').onclick=()=>modal.remove();
  box.querySelector('#tp_addstep').onclick=()=>{sync();steps.push({type:'manual',name:'',desc:'',cfg:{}});paint();};
  saveBtn.onclick=async()=>{
    sync();
    const name=box.querySelector('#tp_name').value.trim();
    const catEl=box.querySelector('#tp_cat')||box.querySelector('#tp_cat_text');
    const cat=catEl?catEl.value.trim():'';
    const desc=box.querySelector('#tp_desc').value.trim();
    const problems=[];
    if(!name)problems.push('Give the template a name.');
    if(!cat)problems.push('Pick a category — the column is required.');
    if(!steps.length)problems.push('Add at least one step: POST /templates requires `steps`, and install refuses an empty template.');
    steps.forEach((s,i)=>{
      if(!String(s.name||'').trim())problems.push('Step '+(i+1)+' needs a name.');
      if(s.type==='ai-action'&&!String(tplCfg(s).provider||'').trim())problems.push('Step '+(i+1)+' (AI Action) must name a provider.');
      if(s.type==='notify'&&!String(tplCfg(s).channel||'').trim())problems.push('Step '+(i+1)+' (Notify) must name a channel.');
    });
    if(steps.length&&steps[0].type!=='data-card')problems.push('Step 1 must be a Data Card — move the Data Card to the top.');
    if(problems.length){msgEl.innerHTML=problems.map(p=>'<div class="text-red-500">• '+escHtml(p)+'</div>').join('');return}
    msgEl.innerHTML='';
    const payload={name:name,category:cat,steps:steps.map((s,i)=>{
      const cfg={};
      Object.keys(tplCfg(s)).forEach(k=>{
        const v=tplCfg(s)[k];
        if(v===undefined||v===null||String(v).trim()==='')return;
        if(k==='branches')cfg[k]=String(v).split('\n').map(x=>x.trim()).filter(Boolean);
        else if(k==='duration_seconds'){const n=Number(v);cfg[k]=Number.isFinite(n)?n:String(v);}
        else cfg[k]=v;
      });
      const step={step_type:s.type,name:String(s.name).trim(),sort_order:i,config:cfg};
      if(String(s.desc||'').trim()!=='')step.description=String(s.desc).trim();
      return step;
    })};
    if(desc!=='')payload.description=desc;
    saveBtn.disabled=true;
    const r=await api('/templates',{method:'POST',body:JSON.stringify(payload)});
    saveBtn.disabled=false;
    if(r){showMsg('Template created with '+payload.steps.length+' step(s)');modal.remove();if(onSaved)onSaved();}
    else msgEl.innerHTML='<div class="text-red-500">The API refused it: '+escHtml(LAST_ERR||'request failed')+'</div>';
  };
  paint();
}

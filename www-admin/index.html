<script>
const API='/api/v1';
let TOKEN=localStorage.getItem('ws_token')||'';
// Active impersonation: {admin_token, tenant_id, user_name, expires_at}. While set, TOKEN is the
// tenant-scoped 15-minute JWT POST /impersonate minted, so every panel call acts as that
// tenant. Stop calls POST /stop-impersonation for real and restores the admin token.
let IMPERSONATION=null;
let app={tab:'dashboard',sub:'overview',data:{}};
// Last failed request's server message. api() otherwise swallows the body (returns null),
// so a refused write (e.g. the 403 on surface CRUD for non-admins, or the Duplicate slug
// error) had no way to reach the operator. showForm surfaces this on failure.
let LAST_ERR='';

async function api(path,opts={}){
  const h={...opts.headers,'Content-Type':'application/json'};
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(API+path,{...opts,headers:h});
  if(r.status===401){TOKEN='';localStorage.removeItem('ws_token');renderLogin();return null}
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{const j=await r.json();msg=(j&&(j.message||(typeof j.error==='string'&&j.error)))||msg;}catch(e){}
    LAST_ERR=String(msg);
    return null;
  }
  if(r.status===204)return null;
  LAST_ERR='';
  return r.json();
}

async function login(email,pw){
  const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  if(!r.ok){alert('Login failed');return}
  const d=await r.json();
  TOKEN=d.access_token||'';
  localStorage.setItem('ws_token',TOKEN);
  renderApp();
}

function logout(){TOKEN='';localStorage.removeItem('ws_token');renderLogin()}

function h(tag,props={},...children){
  const el=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='className')el.className=v;
    else if(k.startsWith('on'))el[k.toLowerCase()]=v;
    else el.setAttribute(k,v);
  });
  children.forEach(c=>{if(typeof c==='string')el.appendChild(document.createTextNode(c));else if(c)el.appendChild(c)});
  return el;
}

function showMsg(msg,type='info'){
  const el=h('div',{className:'fixed top-4 right-4 px-4 py-3 rounded-lg text-white text-sm font-semibold z-50 '+(type==='error'?'bg-red-600':'bg-green-600')},msg);
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function renderLogin(){
  document.body.innerHTML='';
  const div=h('div',{className:'flex items-center justify-center min-h-screen bg-gray-100'});
  const box=h('div',{className:'card w-full max-w-sm'});
  box.innerHTML=`
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">WorkflowSwift Admin</h1>
    <input id="le" class="input mb-3" placeholder="Email" value="swiftsoftware143@yahoo.com">
    <input id="lp" class="input mb-4" type="password" placeholder="Password">
    <button id="lb" class="btn btn-primary w-full">Log In</button>
    <p id="err" class="text-red-500 text-sm mt-3 hidden text-center"></p>
  `;
  box.querySelector('#lb').onclick=()=>{
    const e=box.querySelector('#le').value,p=box.querySelector('#lp').value;
    login(e,p).then(()=>{if(!TOKEN){const er=box.querySelector('#err');er.className='text-red-500 text-sm mt-3 text-center';er.textContent='Login failed';}});
  };
  div.appendChild(box);
  document.body.appendChild(div);
}

function renderApp(){
  document.body.innerHTML='';
  document.body.appendChild(h('div',{className:'sidebar'},sidebar()));
  const main=h('div',{className:'main'},content());
  if(IMPERSONATION)main.insertBefore(impersonationBanner(),main.firstChild);
  document.body.appendChild(main);
}

function impersonationBanner(){
  const b=h('div',{className:'card'});
  b.style.borderLeft='4px solid #f59e0b';b.style.background='#fffbeb';b.style.marginBottom='16px';
  const row=h('div',{className:'flex items-center justify-between gap-3'});
  const left=h('div',{});
  left.appendChild(h('strong',{},'Impersonating '+(IMPERSONATION.user_name||IMPERSONATION.tenant_id)));
  left.appendChild(h('span',{className:'text-xs text-gray-500 ml-2'},
    'tenant '+IMPERSONATION.tenant_id+' \u00b7 token expires '+(IMPERSONATION.expires_at?new Date(IMPERSONATION.expires_at*1000).toLocaleTimeString():'-')));
  row.appendChild(left);
  row.appendChild(h('button',{className:'btn btn-sm btn-danger',onclick:stopImpersonation},'Stop impersonation'));
  b.appendChild(row);
  return b;
}

async function startImpersonation(tenantId){
  if(!tenantId)return showMsg('This row has no tenant id','error');
  if(!confirm('Start impersonating tenant '+tenantId+'? The panel will act as that tenant.'))return;
  const r=await api('/impersonate',{method:'POST',body:JSON.stringify({tenant_id:tenantId})});
  if(!r||!r.impersonation_token){showMsg('Impersonate failed: '+(LAST_ERR||'no token returned'),'error');return}
  IMPERSONATION={admin_token:TOKEN,tenant_id:r.tenant_id,user_name:r.user_name,
    expires_at:Math.floor(Date.now()/1000)+(r.expires_in||900)};
  TOKEN=r.impersonation_token;
  showMsg('Impersonating '+(r.user_name||r.tenant_id));
  renderPage();
}
async function stopImpersonation(){
  const was=IMPERSONATION?(IMPERSONATION.user_name||IMPERSONATION.tenant_id):'tenant';
  // Restore the admin token FIRST: the stop call must go out as the admin, not as the
  // short-lived impersonation token the server just minted.
  if(IMPERSONATION&&IMPERSONATION.admin_token)TOKEN=IMPERSONATION.admin_token;
  const r=await api('/stop-impersonation',{method:'POST',body:JSON.stringify({})});
  IMPERSONATION=null;
  showMsg(r?('Stopped impersonating '+was):('Stop failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
  renderPage();
}
window.startImpersonation=startImpersonation;

const tabs=[
  {id:'dashboard',label:'📊 Dashboard',subs:['Overview','Brand Monitor','Competitor Watch','Prospecting']},
  {id:'workflows',label:'⚙️ Workflows',subs:['All Workflows','Instances','Templates']},
  {id:'automation',label:'🤖 Automation',subs:['Automations','Agents','Workspaces']},
  {id:'crm',label:'👥 CRM',subs:['Leads']},
  {id:'tags',label:'🏷️ Tags & Labels',subs:['Tags','Tag Groups']},
  {id:'integrations',label:'🔌 Integrations',subs:['Integration Targets','Destination Values','Provider Keys','API Keys','n8n Proxy','Bridge']},
  {id:'support',label:'🎫 Support',subs:['Tickets']},
  {id:'profile',label:'👤 Profile & Account',subs:['My Profile','Team','Plans & Credits','Email Branding','Invoices','Payments','Checkout Sessions']},
  {id:'comms',label:'📧 Communications',subs:['Webhooks']},
  {id:'admin',label:'🛠️ Admin',subs:['Usage','Settings','Users','Accounts','Portfolio Companies','Plans','Surfaces','Email Templates','Industry Sources','Site Config']},
];

function sidebar(){
  const nav=h('div',{className:'py-4'});
  nav.appendChild(h('div',{className:'px-4 py-2 text-lg font-bold text-gray-800'},'WorkflowSwift'));
  nav.appendChild(h('div',{className:'px-4 text-xs text-gray-400 mb-4'},'Admin Dashboard'));
  tabs.forEach(t=>{
    const btn=h('button',{className:'tab-btn'+(app.tab===t.id?' active':''),onclick:()=>{app.tab=t.id;app.sub=t.subs[0];renderApp()}},t.label);
    nav.appendChild(btn);
    if(app.tab===t.id){
      t.subs.forEach(s=>{
        const sid=s.toLowerCase().replace(/\s+&?\s*/g,'-').replace(/[^a-z0-9-]/g,'');
        const sub=h('button',{className:'sub-item'+(app.sub===sid?' active':''),onclick:()=>{app.sub=sid;renderApp()}},s);
        nav.appendChild(sub);
      });
    }
  });
  // kanban t_06354530 — the fleet guide standard: the console links its admin guide on its OWN
  // origin, and it is reachable from the console nav rather than merely served. Literal markup (not
  // h('a',{href:…})) on purpose: the served shell must CARRY `href="/admin-guide.html"` as bytes, so
  // a grep for the entry point finds it.
  nav.insertAdjacentHTML('beforeend','<div class="px-4 mt-4"><a id="admin-guide-link" class="btn btn-ghost w-full" href="/admin-guide.html" style="text-decoration:none">📘 Admin Guide</a></div>');
  nav.appendChild(h('div',{className:'px-4 mt-6'},h('button',{className:'btn btn-ghost text-red-500 w-full',onclick:logout},'Log Out')));
  return nav;
}

function content(){
  const c=h('div',{});
  const t=app.tab,s=app.sub;

  if(t==='dashboard'){
    if(s==='overview')renderDashboardOverview(c);
    else if(s==='brand-monitor')renderCRUD(c,'brand-monitor','Brand Monitor',['name','query','active'],'/dashboard/brand-monitor');
    else if(s==='competitor-watch')renderCRUD(c,'competitor-watch','Competitor',['name','url','active'],'/dashboard/competitor-watch');
    else if(s==='prospecting')renderCRUD(c,'prospecting','Prospect',['name','industry','status'],'/dashboard/prospecting');
  }else if(t==='workflows'){
    if(s==='all-workflows')renderCRUD(c,'workflows','Workflow',['name','status','created_at'],'/workflows');
    else if(s==='instances')renderCRUD(c,'instances','Instance',['workflow_id','status','created_at'],'/instances');
    else if(s==='templates')renderCRUD(c,'templates','Template',['name','category','is_public'],'/templates');
  }else if(t==='automation'){
    if(s==='automations')renderCRUD(c,'automations','Automation',['name','trigger_type','enabled'],'/automations');
    else if(s==='agents')renderCRUD(c,'agents','Agent',['name','provider','is_active'],'/agents');
    else if(s==='workspaces')renderCRUD(c,'workspaces','Workspace',['name','created_at'],'/workspaces');
  }else if(t==='crm'){
    if(s==='leads')renderCRUD(c,'leads','Lead',['name','status','source'],'/leads');
  }else if(t==='tags'){
    if(s==='tags')renderCRUD(c,'tags','Tag',['name','color'],'/tags',null,{label:'Unassign',fn:'unassignTag'});
    else if(s==='tag-groups')renderCRUD(c,'tag-groups','Tag Group',['name','description'],'/tag-groups',['name','description']);
  }else if(t==='integrations'){
    if(s==='integration-targets')renderIntegrationTargets(c);
    else if(s==='destination-values')renderDestinationValues(c);
    else if(s==='provider-keys')renderProviderKeys(c);
    else if(s==='api-keys')renderApiKeys(c);
    else if(s==='n8n-proxy')renderN8N(c);
    else if(s==='bridge')renderBridge(c);
  }else if(t==='support'){
    if(s==='tickets')renderCRUD(c,'tickets','Ticket',['title','status','priority'],'/tickets');
  }else if(t==='profile'){
    if(s==='my-profile')renderProfile(c);
    else if(s==='email-branding')renderBranding(c);
    else if(s==='team')renderCRUD(c,'team','Team Member',['name','email','role'],'/users');
    else if(s==='plans-credits')renderPlansCredits(c);
    else if(s==='invoices')renderList(c,'invoices','Invoice','/invoices');
    else if(s==='payments')renderCRUD(c,'payments','Payment Provider',['provider_type','is_active'],'/payment-providers');
    else if(s==='checkout-sessions')renderCheckoutSessions(c);
  }else if(t==='comms'){
    // The Communications -> Email Templates panel is GONE (kanban t_00e7b709). It called the
    // tenant-scoped `/email-templates` family, and every arm of that family was dead: create
    // answered 500 (its INSERT omitted the NOT NULL template_type), list answered
    // {"items":[],"count":0} over a table with rows, get/put answered 500, and its DELETE removed a
    // system-wide template for ANY authenticated caller. Templates are platform-wide, not
    // per-account (src/email.rs resolves them with no `aid` filter), and the super-admin-gated
    // Admin -> Email Templates panel (`/admin/email-templates`) is the one surface for them.
    if(s==='webhooks')renderCRUD(c,'webhooks','Webhook',['name','url','is_active'],'/webhooks',['name','url','is_active']);
  }else if(t==='admin'){
    if(s==='usage')renderAdminUsage(c);
    else if(s==='settings')renderAdminSettings(c);
    else if(s==='users')renderAdminUsers(c);
    else if(s==='accounts')renderAdminAccounts(c);
    else if(s==='portfolio-companies')renderAdminPortfolio(c);
    else if(s==='plans')renderAdminPlans(c);
    else if(s==='surfaces')renderSurfaces(c);
    else if(s==='email-templates')renderCRUD(c,'admin-email-templates','Email Template',['name','subject'],'/admin/email-templates');
    else if(s==='industry-sources')renderIndustrySources(c);
    else if(s==='site-config')renderSiteConfig(c);
  }
  return c;
}

// --- Response envelope helpers ---
// The API answers lists under a NAMED key — {users:[…]}, {providers:[…]}, {agents:[…]},
// {sources:[…]}, {workflows:[…]}, {surfaces:[…]} — and only a few under {items:[…]}.
// renderCRUD read data.items only, so every named-envelope section rendered
// "No items yet." even when rows existed; with no rows rendered there was no Edit/Del
// button, so every per-row PUT/DELETE route stayed uncalled. Unwrap the envelope.
function unwrapList(d){
  if(Array.isArray(d))return d;
  if(!d||typeof d!=='object')return [];
  if(Array.isArray(d.items))return d.items;
  for(const k of Object.keys(d)){ if(Array.isArray(d[k]))return d[k]; }
  return [];
}
// Row identifier for the generic Edit/Del actions: several resources key on something
// other than `id` (payment providers on provider_type, sources on industry_slug, …).
function rowId(it){
  if(!it||typeof it!=='object')return '';
  return it.id||it.provider_type||it.slug||it.uuid||it.api_key_id||it.industry_slug||it.name||'';
}
// GET <ep>/<id> answers a NAMED single envelope too ({surface:{…}}, {user:{…}}), so the edit
// form prefilled every field blank. Unwrap one level when the payload is a wrapper object.
function unwrapOne(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return {};
  if(d.id||d.name||d.slug||d.provider_type)return d;
  for(const k of Object.keys(d)){
    const v=d[k];
    if(v&&typeof v==='object'&&!Array.isArray(v))return v;
  }
  return d;
}

// --- Generic CRUD ---
// `editFields` (optional) = the fields the Edit form exposes; without it Edit stays on
// ['name'] as before. Sections whose real shape is name/slug/description (surfaces) pass it
// so an edit can actually change the slug/description, not just the name.
async function renderCRUD(container,key,label,fields,ep,editFields,extraAction){
  container.innerHTML=`<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">${label}s</h2><button class="btn btn-primary btn-sm" id="addBtn">+ Add</button></div><div id="list"><p class="text-gray-400 text-sm">Loading...</p></div></div>`;
  const data=await api(ep);
  const items=unwrapList(data);
  const list=container.querySelector('#list');
  if(!items.length){
    list.innerHTML='<p class="text-gray-400 text-sm">No items yet.</p>';
    container.querySelector('#addBtn').onclick=()=>showForm(key,label,fields,ep,null,()=>renderPage());
    return;
  }
  let cols=fields;
  if(!cols.length&&items[0])cols=Object.keys(items[0]).filter(k=>k!=='id'&&k!=='aid'&&k!=='updated_at'&&k!=='created_at').slice(0,5);
  const ef=(editFields||['name']).join(',');
  const thead=cols.map(f=>`<th>${f.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</th>`).join('');
  const tbody=items.map(it=>'<tr>'+cols.map(f=>`<td>${String(it[f]===undefined||it[f]===null?'':it[f])}</td>`).join('')+
    `<td class="text-right">`+(extraAction?`<button class="btn btn-sm btn-ghost" onclick="event.preventDefault();${extraAction.fn}('${rowId(it)}')">${extraAction.label}</button>`:'')+`<button class="btn btn-sm btn-ghost" onclick="event.preventDefault();editIt('${key}','${label}','${ep}','${rowId(it)}','${ef}')">Edit</button>`+
    `<button class="btn btn-sm btn-danger" onclick="event.preventDefault();delIt('${key}','${label}','${ep}','${rowId(it)}')">Del</button></td></tr>`).join('');
  list.innerHTML=`<table class="table"><thead><tr>${thead}<th style="width:140px"></th></tr></thead><tbody>${tbody}</tbody></table>`;
  container.querySelector('#addBtn').onclick=()=>showForm(key,label,cols,ep,null,()=>renderPage());
}

function renderPage(){renderApp()}
window.editIt=function(key,label,ep,id,ef){showForm(key,label,ef?ef.split(','):['name'],ep,id,renderPage)}
window.delIt=async function(key,label,ep,id){if(!confirm('Delete?'))return;const r=await api(ep+'/'+id,{method:'DELETE'});showMsg(r?'Deleted':('Delete failed: '+LAST_ERR),r?undefined:'error');renderPage()}

async function showForm(key,label,fields,ep,id,cb){
  const data=id?await api(ep+'/'+id):null;
  const item=unwrapOne(data);
  const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
  const box=h('div',{className:'modal-box'});
  box.innerHTML=`<h2 class="text-lg font-bold mb-4">${id?'Edit':'Add'} ${label}</h2><form id="mf">`+
    fields.map(f=>`<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">${f.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</label><input class="input" name="${f}" value="${item[f]===undefined||item[f]===null?'':String(item[f]).replace(/"/g,'&quot;')}"></div>`).join('')+
    `</form><div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Save</button></div>`;
  box.querySelector('#cancelBtn').onclick=()=>modal.remove();
  box.querySelector('#saveBtn').onclick=async()=>{
    // Skip blank inputs: an empty string is not "unset" server-side — POST /surfaces would
    // store slug='' instead of slugifying the name, and PUT uses COALESCE (blank can't clear).
    const body={};box.querySelectorAll('#mf input').forEach(inp=>{if(String(inp.value).trim()!=='')body[inp.name]=inp.value});
    const r=await api(id?ep+'/'+id:ep,{method:id?'PUT':'POST',body:JSON.stringify(body)});
    if(r)showMsg('Saved!');else showMsg('Error saving: '+LAST_ERR,'error');
    if(r){modal.remove();if(cb)cb();}
  };
  modal.appendChild(box);document.body.appendChild(modal);
}

// --- Surfaces (tenant-wide definition; the ONLY place they may be created) ---
// The API refuses writes from non-admin tokens with 403 "Admin access required" and refuses a
// duplicate per-tenant slug with 409 — both now reach the operator via LAST_ERR above.
// Fields are the API's real ones (name, slug, description); slug may be omitted and is
// slugified from name. The user-facing app only *selects* from this registry.
function renderSurfaces(c){
  renderCRUD(c,'surfaces','Surface',['name','slug','description'],'/surfaces',['name','slug','description']);
}

// --- Dashboard ---
function renderDashboardOverview(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">Dashboard Overview</h2><div id="stats" class="grid grid-cols-3 gap-4"><p class="text-gray-400">Loading...</p></div></div>';
  api('/dashboard/stats').then(d=>{
    const s=c.querySelector('#stats');
    if(!d||!d.stats){s.innerHTML='<p class="text-gray-400">No stats available.</p>';return}
    // The three keys GET /dashboard/stats really returns. This read used to ask for
    // `total_instances` and `credits`, neither of which the handler has EVER returned, so both
    // tiles rendered a permanent 0 — measured live on this console's default page: "Instances 0"
    // with a running instance committed, "Credits 0" with 5 credits on the account. The running
    // count is `active_instances`; credits live on Plans & Credits (kanban t_3a8ccd2a).
    s.innerHTML=[{l:'Workflows',v:d.stats.total_workflows||0},{l:'Active instances',v:d.stats.active_instances||0},{l:'Templates',v:d.stats.total_templates||0}]
      .map(x=>`<div class="card text-center"><div class="text-3xl font-bold text-blue-600">${x.v}</div><div class="text-sm text-gray-500">${x.l}</div></div>`).join('');
  }).catch(()=>c.querySelector('#stats').innerHTML='<p class="text-red-400">Failed.</p>');
}

// --- Integration Targets (GET/POST/PUT/DELETE /integration-targets) --------------------------
// Hand-written, NOT renderCRUD (kanban t_cb839034). A target's destination is EITHER a literal
// `webhook_url` OR a `provider_preset` key from the catalogue, and that second choice has to be a
// SELECT bound to GET /provider-presets. renderCRUD renders one plain-text input per
// field name, so it could not express the choice — which is why the column `provider_preset` had
// NO writer at all (5/5 live targets NULL) while
// integration_dispatch_handler::forward_dispatch was already reading it to turn a target into a
// URL, and why the 8-row catalogue the app serves had no caller anywhere in this console.
function renderIntegrationTargets(c){
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Integration Targets</h2><button class="btn btn-primary btn-sm" id="tgtAdd">+ Add</button></div>'
    +'<p class="text-xs text-gray-400 mb-4">A target needs a URL source: a webhook URL, or a provider preset from the catalogue (GET /provider-presets) whose base_url the dispatch resolves and appends the step\'s path to. Targets are aid-scoped.</p>'
    +'<div id="tgtList"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const list=c.querySelector('#tgtList');
  const load=async()=>{
    const d=await api('/integration-targets');
    if(d===null){list.innerHTML='<p class="text-red-400 text-sm">Could not load targets: '+escHtml(LAST_ERR||'request failed')+'</p>';return}
    const items=(d&&d.integration_targets)||[];
    if(!items.length){list.innerHTML='<p class="text-gray-400 text-sm">No targets yet.</p>';return}
    list.innerHTML='<table class="table"><thead><tr><th>Name</th><th>Provider</th><th>Preset</th><th>Webhook URL</th><th>Active</th><th style="width:130px"></th></tr></thead><tbody>'
      +items.map(t=>'<tr><td><strong>'+escHtml(t.name)+'</strong></td><td>'+escHtml(t.provider)+'</td>'
        +'<td>'+(t.provider_preset?escHtml(t.provider_preset):'<span class="text-gray-400">none</span>')+'</td>'
        +'<td class="text-xs">'+(t.webhook_url?escHtml(t.webhook_url):'<span class="text-gray-400">none</span>')+'</td>'
        +'<td>'+(t.is_active?'Active':'Inactive')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-ghost" data-edit="'+escHtml(t.id)+'">Edit</button>'
        +'<button class="btn btn-sm btn-danger" data-del="'+escHtml(t.id)+'">Del</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(b.getAttribute('data-edit')));
    list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Delete this target?'))return;
      const id=b.getAttribute('data-del');
      const r=await api('/integration-targets/'+encodeURIComponent(id),{method:'DELETE'});
      showMsg(r?'Deleted':('Delete failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
      if(r)load();
    });
  };
  const form=async(id)=>{
    // The catalogue is the app's own routable-provider list; if it cannot be read, a literal-URL
    // target is still perfectly creatable, so this degrades to "none" instead of blocking the form.
    let presets=[];
    const pd=await api('/provider-presets');
    if(pd&&pd.providers)presets=pd.providers;
    let item={};
    if(id){const d=await api('/integration-targets');const it=((d&&d.integration_targets)||[]).find(x=>x.id===id);if(it)item=it}
    const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
    const box=h('div',{className:'modal-box'});
    box.innerHTML='<h2 class="text-lg font-bold mb-4">'+(id?'Edit':'Add')+' Integration Target</h2>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Name</label><input class="input" id="tg_name" value="'+escHtml(item.name||'')+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Provider label</label><input class="input" id="tg_provider" value="'+escHtml(item.provider||'webhook')+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Provider preset</label>'
      +'<select class="input" id="tg_preset"><option value="">none (route by webhook URL)</option>'
      +presets.map(p=>'<option value="'+escHtml(p.key)+'"'+(item.provider_preset===p.key?' selected':'')+'>'+escHtml(p.name)+' ('+escHtml(p.key)+')'+(p.base_url?' — '+escHtml(p.base_url):'')+'</option>').join('')
      +'</select></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Webhook URL</label>'
      +'<input class="input" id="tg_url" value="'+escHtml(item.webhook_url||'')+'" placeholder="https://… (leave blank when a preset routes the target)"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Active</label>'
      +'<input type="checkbox" id="tg_active" '+(item.is_active===false?'':'checked')+'></div>'
      +'<div id="tg_msg" class="text-sm mb-2"></div>'
      +'<div class="flex justify-end gap-2"><button class="btn btn-ghost" id="tg_cancel">Cancel</button><button class="btn btn-primary" id="tg_save">Save</button></div>';
    box.querySelector('#tg_cancel').onclick=()=>modal.remove();
    box.querySelector('#tg_save').onclick=async()=>{
      const preset=box.querySelector('#tg_preset').value;
      const url=box.querySelector('#tg_url').value.trim();
      const msg=box.querySelector('#tg_msg');
      if(preset===''&&url===''){msg.className='text-sm mb-2 text-red-500';msg.textContent='A target needs a webhook URL or a provider preset.';return}
      // provider_preset goes as null when "none" is chosen so the field can be CLEARED; the API reads
      // an absent field as "leave alone" and an explicit null as "clear" (same contract as api_key).
      const body={name:box.querySelector('#tg_name').value.trim()||'Target',
                  provider:box.querySelector('#tg_provider').value.trim()||'webhook',
                  provider_preset:preset===''?null:preset,
                  webhook_url:url,
                  is_active:box.querySelector('#tg_active').checked};
      const r=await api(id?'/integration-targets/'+encodeURIComponent(id):'/integration-targets',{method:id?'PUT':'POST',body:JSON.stringify(body)});
      if(r){showMsg('Saved!');modal.remove();load()}
      else{msg.className='text-sm mb-2 text-red-500';msg.textContent='Error saving: '+(LAST_ERR||'request failed')}
    };
    modal.appendChild(box);document.body.appendChild(modal);
  };
  c.querySelector('#tgtAdd').onclick=()=>form(null);
  load();
}

const PROVIDER_SLOTS = [
  ['openai','OpenAI'], ['anthropic','Anthropic'], ['deepseek','DeepSeek'], ['gemini','Google Gemini'],
  ['mailgun','Mailgun'], ['sendgrid','SendGrid'], ['sendiio','Sendiio'], ['mailchimp','Mailchimp'],

];

// Written out by hand because the generic renderCRUD form CANNOT work for a credential:
// it renders one plain-text input per field name, and this panel was declared as
// ['provider','key_prefix','is_active'] — so there was no input for the secret at all.
// Every save posted {provider,key_prefix,is_active}, and the API correctly answered
// 400 "api_key is required": the admin side had NO SLOT to enter a key. `key_prefix`
// is not even a property of the response, so that list column was always blank too.
function renderProviderKeys(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-2">Provider Keys</h2>'
    +'<p class="text-xs text-gray-400 mb-4">Per-account API keys for the providers this platform uses. '
    +'Values are encrypted at rest and reads only ever return a mask.</p>'
    +'<div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end mb-5">'
    +'<div><label class="block text-xs font-medium text-gray-500 mb-1">Provider</label>'
    +'<select id="pk_provider" class="input">'
    +PROVIDER_SLOTS.map(function(s){return '<option value="'+s[0]+'">'+s[1]+' ('+s[0]+')</option>'}).join('')
    +'</select></div>'
    +'<div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">API key</label>'
    +'<input id="pk_key" class="input" type="password" autocomplete="new-password" '
    +'placeholder="paste the provider key (stored encrypted)"></div>'
    +'<div><button class="btn btn-primary" id="pk_save">Save key</button></div>'
    +'</div><div id="pkdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';

  const list=c.querySelector('#pkdata');
  const short=(p)=>{const i=PROVIDER_SLOTS.findIndex(s=>s[0]===p);return i>=0?PROVIDER_SLOTS[i][1]:p};

  const load=async()=>{
    const d=await api('/provider-keys');
    const items=(d&&d.provider_keys)||[];
    if(!items.length){
      list.innerHTML='<p class="text-gray-400 text-sm">No provider keys stored yet. Pick a provider above, paste its key and press Save — an empty slot is fine, it is filled when the key arrives.</p>';
      return;
    }
    list.innerHTML='<table class="table"><thead><tr><th>Provider</th><th>Key</th><th>Stored</th><th>Active</th><th></th></tr></thead><tbody>'
      +items.map(k=>'<tr><td><strong>'+short(k.provider)+'</strong>'
        +'<span class="text-xs text-gray-400 ml-2">'+k.provider+'</span></td>'
        +'<td>'+(k.api_key||'(empty)')+'</td>'
        +'<td class="text-xs text-gray-500">'+String(k.updated_at||k.created_at||'').slice(0,10)+'</td>'
        +'<td>'+(k.is_active?'Yes':'No')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-danger" data-del="'+k.provider+'">Delete</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
      const p=b.getAttribute('data-del');
      if(!confirm('Delete the stored key for '+p+'?'))return;
      const r=await api('/provider-keys/'+encodeURIComponent(p),{method:'DELETE'});
      showMsg(r?'Deleted '+p:('Delete failed: '+LAST_ERR),r?undefined:'error');
      load();
    });
  };

  c.querySelector('#pk_save').onclick=async()=>{
    const provider=c.querySelector('#pk_provider').value;
    const api_key=c.querySelector('#pk_key').value.trim();
    if(!api_key){showMsg('Paste the key value first — an empty value is rejected by the API.','error');return}
    const r=await api('/provider-keys',{method:'POST',body:JSON.stringify({provider,api_key})});
    if(r){showMsg('Stored key for '+provider);c.querySelector('#pk_key').value='';load();}
    else showMsg('Save failed: '+LAST_ERR,'error');
  };

  load();
}

// --- API Keys (tenant-scoped: POST /api-keys -> {key, prefix, message}) ---
// Stripped out of the generic renderCRUD for exactly the reason an API key is not a CRUD
// row: the value exists in the clear exactly once. POST /api-keys answers
// {key, prefix, message:"Save this key — it will not be shown again"} and GET /api-keys
// only ever returns `prefix`. The panel was declared with a `key_prefix` column, which is
// not a property of the response at all (so that column rendered blank), and its form only
// posted `name` — a key created from this console was therefore never displayed and could
// never be used by anything. This panel shows the value once, with the API's own warning,
// and keeps the prefix in the list as the only identifier that survives.
function renderApiKeys(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-2">API Keys</h2>'
    +'<p class="text-xs text-gray-400 mb-4">Bearer credentials for the WorkflowSwift API and the Swift Market Intel Chrome extension. '
    +'The key value is returned once, at creation — afterwards only its prefix is readable.</p>'
    +'<div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end mb-5">'
    +'<div class="md:col-span-3"><label class="block text-xs font-medium text-gray-500 mb-1">Name</label>'
    +'<input id="ak_name" class="input" placeholder="what this key is for (e.g. market-intel-extension)"></div>'
    +'<div><button class="btn btn-primary" id="ak_create">Create key</button></div></div>'
    +'<div id="aknew"></div><div id="akdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';

  const list=c.querySelector('#akdata');

  const showOnce=function(k){
    c.querySelector('#aknew').innerHTML='<div class="p-3 mb-4 rounded-lg bg-amber-50 border border-amber-300">'
      +'<p class="text-sm font-semibold text-amber-800 mb-1">Copy this key now — it will not be shown again.</p>'
      +'<div class="flex items-center gap-2"><code class="text-xs break-all bg-white border rounded px-2 py-1 flex-1">'+escHtml(k.key)+'</code>'
      +'<button class="btn btn-sm" id="ak_copy">Copy</button></div></div>';
    const b=c.querySelector('#ak_copy');
    if(b)b.onclick=function(){
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(k.key).then(function(){showMsg('API key copied')},function(){showMsg('Copy blocked — select the value above','error')});
      }else showMsg('Copy blocked — select the value above','error');
    };
  };

  const load=async()=>{
    const d=await api('/api-keys');
    if(d===null){list.innerHTML='<p class="text-red-400 text-sm">'+escHtml(LAST_ERR||'Could not load API keys')+'</p>';return}
    const items=unwrapList(d);
    if(!items.length){list.innerHTML='<p class="text-gray-400 text-sm">No API keys yet. Name one above and press Create — the value is shown once, right after it is minted.</p>';return}
    list.innerHTML='<table class="table"><thead><tr><th>Name</th><th>Key prefix</th><th>Created</th><th>Last used</th><th>Active</th><th style="width:100px"></th></tr></thead><tbody>'
      +items.map(k=>'<tr><td><strong>'+escHtml(k.name||'-')+'</strong></td>'
        +'<td class="text-xs text-gray-500">'+escHtml(k.prefix||'-')+'…</td>'
        +'<td class="text-xs text-gray-500">'+String(k.created_at||'').slice(0,10)+'</td>'
        +'<td class="text-xs text-gray-500">'+(k.last_used_at?String(k.last_used_at).slice(0,16).replace('T',' '):'never')+'</td>'
        +'<td>'+(k.is_active?'Yes':'No')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-danger" data-del="'+escHtml(k.id)+'">Delete</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
      const id=b.getAttribute('data-del');
      if(!confirm('Delete this API key? Anything using it stops working immediately.'))return;
      const r=await api('/api-keys/'+encodeURIComponent(id),{method:'DELETE'});
      showMsg(r?'API key deleted':('Delete failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
      load();
    });
  };

  c.querySelector('#ak_create').onclick=async()=>{
    const name=(c.querySelector('#ak_name').value||'').trim()||'default';
    const r=await api('/api-keys',{method:'POST',body:JSON.stringify({name})});
    if(!r||!r.key){
      // No `key` in the answer means the mint never ran: the plan gate answers 402
      // ("API access is not included in your current plan…"). LAST_ERR holds the API's own
      // sentence, so show that verbatim instead of a generic failure.
      showMsg('Create failed: '+(LAST_ERR||'no key returned'),'error');return;
    }
    c.querySelector('#ak_name').value='';
    showMsg('API key created');
    showOnce(r);
    load();
  };

  load();
}

// Escape anything that came out of the API or an operator's typing before it is
// concatenated into innerHTML — a key *name* is free text.
function escHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

// ── EMAIL BRANDING (per-account identity on transactional email) ────────────────────
// The per-account email-branding backend (kanban t_c3cfe7ba) shipped with NO screen in this
// console: GET|PUT /api/v1/settings/branding carries brand_name/brand_color, the logo BYTES
// go to POST|DELETE /api/v1/settings/branding/logo as `multipart/form-data` (field `file`), the
// fleet-wide upload convention; the public GET /api/v1/branding/logo/{account_id} streams it
// back for a mail client's <img src>. A backend route with no UI is a defect.
async function renderBranding(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">&#127912; Email Branding</h2><div id="bdata"><p class="text-gray-400">Loading...</p></div></div>';
  const host=c.querySelector('#bdata');
  const d=await api('/settings/branding');
  if(d===null&&LAST_ERR){host.innerHTML='<p class="text-red-400">Could not load branding: '+LAST_ERR+'</p>';return}
  const doc=d||{};
  const branded=!!(doc.brand_name||doc.logo_url);
  host.innerHTML='';
  const badge=h('span',{className:'badge',style:branded?'background:#d1fae5;color:#065f46':'background:#fef3c7;color:#92400e'},branded?'branded':'not branded');
  const head=h('div',{className:'flex items-center gap-3 mb-2'},h('span',{className:'font-semibold'},'Your branding on transactional email'),badge);
  host.appendChild(head);
  host.appendChild(h('p',{className:'text-sm text-gray-500 mb-4'},'This is what your customers see at the top of the workflow and account emails sent for your account. Leave it empty to send with WorkflowSwift\'s own identity.'));

  const wrap=h('div',{className:'grid grid-cols-2 gap-6'});
  const left=h('div',{}),right=h('div',{});
  wrap.appendChild(left);wrap.appendChild(right);host.appendChild(wrap);

  const nameIn=h('input',{className:'input mb-3',placeholder:'e.g. Acme Corp',maxlength:'60'});nameIn.value=doc.brand_name||'';
  left.appendChild(h('label',{className:'text-xs text-gray-500'},'Brand display name'));
  left.appendChild(nameIn);
  const colorIn=h('input',{className:'input'});colorIn.value=/^#[0-9a-fA-F]{3,8}$/.test(doc.brand_color||'')?doc.brand_color:'#4f46e5';
  const picker=h('input',{type:'color',style:'width:44px;height:34px;padding:2px;border:1px solid #cbd5e1;border-radius:8px;background:#fff'});
  picker.value=/^#[0-9a-fA-F]{6}$/.test(colorIn.value)?colorIn.value:'#4f46e5';
  picker.oninput=()=>{colorIn.value=picker.value};
  colorIn.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(colorIn.value.trim()))picker.value=colorIn.value.trim()};
  left.appendChild(h('label',{className:'text-xs text-gray-500 mt-2'},'Brand colour'));
  left.appendChild(h('div',{className:'flex items-center gap-2'},picker,colorIn));
  left.appendChild(h('p',{className:'text-xs text-gray-400 mt-1'},'A hex colour such as #4f46e5. It draws the rule under your logo.'));
  const saveBtn=h('button',{className:'btn btn-primary mt-4'},'Save branding');
  saveBtn.onclick=async()=>{
    saveBtn.disabled=true;saveBtn.textContent='Saving...';
    const r=await api('/settings/branding',{method:'PUT',body:JSON.stringify({brand_name:nameIn.value.trim(),brand_color:colorIn.value.trim()})});
    saveBtn.disabled=false;saveBtn.textContent='Save branding';
    if(r){showMsg('Email branding saved','success');renderApp();}else showMsg('Save failed: '+LAST_ERR,'error');
  };
  left.appendChild(saveBtn);

  right.appendChild(h('label',{className:'text-xs text-gray-500'},'Logo'));
  const box=h('div',{style:'border:1px dashed #cbd5e1;border-radius:10px;height:110px;display:flex;align-items:center;justify-content:center;background:#f8fafc;overflow:hidden'});
  if(doc.logo_url){const img=h('img',{alt:doc.brand_name||'Your logo',style:'max-width:100%;max-height:100%'});img.src=doc.logo_url;box.appendChild(img);}
  else box.appendChild(h('span',{className:'text-xs text-gray-400'},'No logo yet'));
  right.appendChild(box);
  const fileIn=h('input',{type:'file',accept:'image/png,image/jpeg,image/webp,image/gif',style:'display:none'});
  fileIn.onchange=async()=>{
    const f=fileIn.files&&fileIn.files[0];if(!f)return;
    if(f.size>2*1024*1024){showMsg('That image is larger than 2 MB','error');fileIn.value='';return}
    const fd=new FormData();fd.append('file',f,f.name||'logo');const res=await fetch(API+'/settings/branding/logo',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});
    const j=await res.json().catch(()=>({}));
    if(!res.ok){showMsg('Upload failed: '+(j.message||j.error||('HTTP '+res.status)),'error');fileIn.value='';return}
    showMsg('Logo uploaded','success');renderApp();
  };
  right.appendChild(fileIn);
  const pickBtn=h('button',{className:'btn btn-ghost btn-sm mt-2'},doc.logo_url?'Replace logo':'Upload logo');
  pickBtn.onclick=()=>fileIn.click();
  const btns=h('div',{className:'flex gap-2'},pickBtn);
  if(doc.logo_url){
    const rmBtn=h('button',{className:'btn btn-ghost btn-sm'},'Remove');
    rmBtn.onclick=async()=>{if(!confirm('Remove your email logo?'))return;const r=await api('/settings/branding/logo',{method:'DELETE'});if(r){showMsg('Logo removed','success');renderApp();}else showMsg('Remove failed: '+LAST_ERR,'error');};
    btns.appendChild(rmBtn);
  }
  right.appendChild(btns);
  right.appendChild(h('p',{className:'text-xs text-gray-400 mt-2'},'PNG, JPEG, WebP or GIF, up to 2 MB.'));
}

// Generic single-setting editor (any key in admin_settings is editable here).
async function editSetting(key){
  const d=await api('/admin/settings/'+encodeURIComponent(key));
  if(!d){alert('Could not load setting '+key);return}
  const cur=typeof d.value==='string'?d.value:JSON.stringify(d.value,null,2);
  const next=prompt('Value for "'+key+'" (text or JSON):',cur);
  if(next===null)return;
  let value=next;
  try{value=JSON.parse(next)}catch(e){/* keep as plain text */}
  const r=await api('/admin/settings/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({value})});
  alert(r?'Saved '+key:'Save failed for '+key);
  if(r)renderPage();
}

// ── Accounts: the platform-wide list + the bulk retire write (kanban t_265ce9f9) ──────────────
// The read is the same platform-gated list the Users (Tenants) panel already uses
// (GET /admin/accounts). Selection is a per-row checkbox plus a select-all header; the ONE write is
// POST /admin/accounts/bulk-delete, which answers PER ID — a row the backend refuses (the account
// you are signed in as, a portfolio company, this app's own workspace, or one whose `WFS <id>` n8n
// mirrors cannot be retired) keeps its reason on screen instead of vanishing behind a generic
// failure. The single-account DELETE (/admin/accounts/{id}) is the same operation for one row; this
// panel is the batch form of it, so the operator no longer needs a psql session to clear junk.
function renderAdminAccounts(c){
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Accounts</h2>'+
    '<button class="btn btn-danger btn-sm" id="accDel" disabled>Delete selected</button></div>'+
    '<p class="text-xs text-gray-400 mb-4">Every account on this platform. Tick rows and press <b>Delete selected</b> to remove them permanently, with all their data. Three are refused by rule and cannot be forced here: the account you are signed in as, a portfolio company (SwiftImpact / ZaarHub / Giraudy) and this app\'s own workspace — the reason is kept next to the row that was kept.</p>'+
    '<div id="accdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const btn=c.querySelector('#accDel');
  // Refusals from the last write, rendered ONCE on the re-render that follows it.
  let reasons=[];
  const box=()=>Array.from(c.querySelectorAll('.acc-chk'));
  const sync=()=>{
    const picked=box().filter(b=>b.checked);
    btn.disabled=picked.length===0;
    btn.textContent=picked.length?('Delete selected ('+picked.length+')'):'Delete selected';
    const a=c.querySelector('#accAll');
    if(a)a.checked=box().length>0&&picked.length===box().length;
  };
  const load=()=>api('/admin/accounts').then(d=>{
    const items=(d&&d.accounts)||(d&&d.items)||[];
    const el=c.querySelector('#accdata');
    if(!items.length){el.innerHTML='<p class="text-gray-400 text-sm">No accounts yet.</p>';sync();return}
    el.innerHTML='<table class="table"><thead><tr><th style="width:32px"><input type="checkbox" id="accAll" title="Select all"></th><th>Name</th><th>Slug</th><th>Plan</th><th>Active</th><th>Created</th><th></th></tr></thead><tbody>'+
      items.map(i=>{
        // The API answers the tier nested as plan:{name,slug}; the flat spellings stay as fallback.
        const cur=(i.plan&&(i.plan.slug||i.plan.name))||i.plan_slug||i.plan_name||'';
        const aid=i.id||i.account_id||'';
        return '<tr data-acc="'+aid+'">'+
        '<td><input type="checkbox" class="acc-chk" value="'+aid+'"></td>'+
        '<td class="acc-name"><strong>'+(i.name||'-')+'</strong></td>'+
        '<td>'+(i.account_slug||i.slug||'-')+'</td>'+
        '<td>'+(cur||'-')+'</td>'+
        '<td><span class="badge '+(i.is_active?'bg-green-100 text-green-700':'bg-red-100 text-red-700')+'">'+(i.is_active?'Active':'Inactive')+'</span></td>'+
        '<td class="text-xs text-gray-400">'+((i.created_at||'').slice(0,10))+'</td>'+
        '<td class="text-right"><button class="btn btn-sm btn-ghost" onclick="event.preventDefault();startImpersonation(\''+aid+'\')">Impersonate</button></td>'+
      '</tr>'}).join('')+'</tbody></table>';
    const a=el.querySelector('#accAll');
    if(a)a.addEventListener('change',()=>{box().forEach(b=>{b.checked=a.checked});sync()});
    box().forEach(b=>b.addEventListener('change',sync));
    // The reason a row was KEPT — written into that row's name cell, so it is not a generic toast.
    reasons.forEach(f=>{
      const note=document.createElement('div');
      note.className='text-xs text-red-600';
      note.textContent=f.error;
      const row=el.querySelector('tr[data-acc="'+f.id+'"]');
      const cell=row&&row.querySelector('td.acc-name');
      if(cell)cell.appendChild(note);
      else el.appendChild(note);
    });
    reasons=[];
    sync();
  });
  btn.onclick=async()=>{
    const ids=box().filter(b=>b.checked).map(b=>b.value).filter(Boolean);
    if(!ids.length)return;
    if(!confirm('Delete '+ids.length+' account(s)? This permanently removes the account and all of its data. This cannot be undone.'))return;
    btn.disabled=true;
    const r=await api('/admin/accounts/bulk-delete',{method:'POST',body:JSON.stringify({ids})});
    if(!r){showMsg('Delete failed: '+LAST_ERR,'error');load();return}
    const failed=(r&&r.failed)||[];
    reasons=failed;
    const n=(r&&typeof r.deleted==='number')?r.deleted:0;
    showMsg(n+' account(s) deleted'+(failed.length?(' — '+failed.length+' refused or not found'):''),failed.length?'error':'success');
    load();
  };
  load();
}

// --- Integration destination values (GET /integration-destinations) ---------------------------
// The provider / action / destination-type lists come from the destination CATALOGUE route
// GET /integration-destinations: its 3-level cascade (no params -> providers, ?provider= ->
// actions, ?provider=&action= -> destination types) is exactly the shape this panel needs.
// Before kanban t_92388cf3 all three lists were hardcoded here (3 providers, 3-3-2 types), so the
// panel could not reach catalogue tuples /values DOES serve — e.g. coreswift / add_note / category.
// The value lookup itself is unchanged: GET /integration-destinations/values?provider=&
// destination_type= answers 400 unless BOTH params are present, so Load stays disabled until a
// destination type is picked.
function renderDestinationValues(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-1">Integration Destination Values</h2>'
   +'<p class="text-xs text-gray-400 mb-4">The values a step can target for a provider + destination type (GET /integration-destinations/values). Provider, action and destination type are read from the destination catalogue (GET /integration-destinations); the <b>source</b> line says whether the values are live from the provider API or the built-in fallback.</p>'
   +'<div class="flex gap-3 items-end mb-4">'
   +'<div><label class="text-xs text-gray-500">Provider</label><select id="dvprov" class="input"><option value="">Loading&hellip;</option></select></div>'
   +'<div><label class="text-xs text-gray-500">Action</label><select id="dvact" class="input"><option value="">&mdash;</option></select></div>'
   +'<div><label class="text-xs text-gray-500">Destination type</label><select id="dvtype" class="input"><option value="">&mdash;</option></select></div>'
   +'<button class="btn btn-primary btn-sm" id="dvload" disabled>Load values</button></div>'
   +'<div id="dvdata"><p class="text-gray-400 text-sm">Pick a provider and load.</p></div></div>';
  const psel=c.querySelector('#dvprov'),asel=c.querySelector('#dvact'),tsel=c.querySelector('#dvtype');
  const dbox=c.querySelector('#dvdata'),lbtn=c.querySelector('#dvload');
  const fill=(sel,rows,ph)=>{ sel.innerHTML=(rows.length?'':'<option value="">'+escHtml(ph)+'</option>')
    +rows.map(r=>'<option value="'+escHtml(r.v)+'">'+escHtml(r.l)+'</option>').join(''); };
  const fail=(what)=>{ dbox.innerHTML='<p class="text-red-500 text-sm">'+escHtml(what)+' failed: '+escHtml(LAST_ERR||'request failed')+'</p>'; lbtn.disabled=true; };
  const loadTypes=async()=>{
    fill(tsel,[],'pick an action'); lbtn.disabled=true;
    if(!psel.value||!asel.value)return;
    const d=await api('/integration-destinations?provider='+encodeURIComponent(psel.value)+'&action='+encodeURIComponent(asel.value));
    if(!d)return fail('Destination catalogue');
    const rows=((d&&d.destinations)||[]).map(x=>({v:x.type,l:x.label||x.type}));
    fill(tsel,rows,'this action targets nothing');
    lbtn.disabled=!rows.length;
    if(!rows.length)dbox.innerHTML='<p class="text-gray-400 text-sm">No destination types for '+escHtml(psel.value)+' / '+escHtml(asel.value)+'.</p>';
  };
  const loadActions=async()=>{
    fill(asel,[],'no actions'); fill(tsel,[],'pick an action'); lbtn.disabled=true;
    if(!psel.value)return;
    const d=await api('/integration-destinations?provider='+encodeURIComponent(psel.value));
    if(!d)return fail('Destination catalogue');
    const rows=((d&&d.actions)||[]).map(x=>({v:x.key,l:x.label||x.key}));
    fill(asel,rows,'no actions');
    if(!rows.length){ dbox.innerHTML='<p class="text-gray-400 text-sm">This provider has no destination catalogue rows.</p>'; return; }
    dbox.innerHTML='<p class="text-gray-400 text-sm">Pick a destination type and load.</p>';
    await loadTypes();
  };
  psel.onchange=loadActions; asel.onchange=loadTypes;
  (async()=>{
    const d=await api('/integration-destinations');
    if(!d)return fail('Destination catalogue');
    const provs=((d&&d.providers)||[]).map(x=>({v:x.key,l:x.name||x.key}));
    fill(psel,provs,'no providers');
    if(!psel.value){lbtn.disabled=true;return}
    // Land on a provider that actually HAS catalogue rows: the providers are listed by name, and
    // the platform's own list is mostly email/AI/API providers with no destinations at all. The
    // scan stops at the first hit (coreswift), so it is two requests, not twenty.
    for(const key of provs.map(x=>x.v)){
      psel.value=key; await loadActions();
      if(asel.value)break;
    }
  })();
  lbtn.onclick=async()=>{
    if(!psel.value||!tsel.value)return;
    dbox.innerHTML='<p class="text-gray-400 text-sm">Loading...</p>';
    const d=await api('/integration-destinations/values?provider='+encodeURIComponent(psel.value)+'&destination_type='+encodeURIComponent(tsel.value));
    if(!d){dbox.innerHTML='<p class="text-red-500 text-sm">Request failed: '+escHtml(LAST_ERR)+'</p>';return}
    const vals=(d&&d.values)||[];
    dbox.innerHTML='<p class="text-xs text-gray-400 mb-2">source: '+escHtml(String(d.source||'-'))+' ('+vals.length+' value'+(vals.length===1?'':'s')+')</p>'
     +(vals.length?'<table class="table"><thead><tr><th>Value id</th><th>Label</th></tr></thead><tbody>'
       +vals.map(v=>'<tr><td>'+escHtml(String(v.id==null?'-':v.id))+'</td><td>'+escHtml(String(v.label==null?'-':v.label))+'</td></tr>').join('')+'</tbody></table>'
      :'<p class="text-gray-400 text-sm">No values.</p>');
  };
}

// --- Tags: unassign (POST /tags/unassign {tag_id, entity_type, entity_id}) ---
// The route takes none of the tag_assignments id, so the panel asks for the tagged entity.
window.unassignTag=async function(tagId){
  const et=prompt('Unassign this tag from which entity TYPE? (e.g. lead, workflow, contact)');
  if(!et)return;
  const eid=prompt('Entity id (uuid) to unassign tag '+tagId+' from:');
  if(!eid)return;
  const r=await api('/tags/unassign',{method:'POST',body:JSON.stringify({tag_id:tagId,entity_type:et,entity_id:eid})});
  showMsg(r?(r.message||'Tag unassigned'):('Unassign failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
  if(r)renderPage();
};

// Init
// This script sits in <head>, so it runs BEFORE the parser has created <body> and
// document.body is still null — renderApp()/renderLogin() both start with
// document.body.innerHTML='' and threw "Cannot set properties of null", leaving
// admin.workflowswift.com a blank page for every account. Wait for the DOM instead.
function boot(){ if(TOKEN)renderApp();else renderLogin(); }
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>

// --- Integration Targets (GET/POST/PUT/DELETE /integration-targets) --------------------------
// Hand-written, NOT renderCRUD (kanban t_cb839034). A target's destination is EITHER a literal
// `webhook_url` OR a `provider_preset` key from the catalogue, and that second choice has to be a
// SELECT bound to GET /provider-presets. renderCRUD renders one plain-text input per
// field name, so it could not express the choice — which is why the column `provider_preset` had
// NO writer at all (5/5 live targets NULL) while
// integration_dispatch_handler::forward_dispatch was already reading it to turn a target into a
// URL, and why the 8-row catalogue the app serves had no caller anywhere in this console.
function renderIntegrationTargets(c){
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Integration Targets</h2><button class="btn btn-primary btn-sm" id="tgtAdd">+ Add</button></div>'
    +'<p class="text-xs text-gray-400 mb-4">A target needs a URL source: a webhook URL, or a provider preset from the catalogue (GET /provider-presets) whose base_url the dispatch resolves and appends the step\'s path to. Targets are aid-scoped.</p>'
    +'<div id="tgtList"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const list=c.querySelector('#tgtList');
  const load=async()=>{
    const d=await api('/integration-targets');
    if(d===null){list.innerHTML='<p class="text-red-400 text-sm">Could not load targets: '+escHtml(LAST_ERR||'request failed')+'</p>';return}
    const items=(d&&d.integration_targets)||[];
    if(!items.length){list.innerHTML='<p class="text-gray-400 text-sm">No targets yet.</p>';return}
    list.innerHTML='<table class="table"><thead><tr><th>Name</th><th>Provider</th><th>Preset</th><th>Webhook URL</th><th>Active</th><th style="width:130px"></th></tr></thead><tbody>'
      +items.map(t=>'<tr><td><strong>'+escHtml(t.name)+'</strong></td><td>'+escHtml(t.provider)+'</td>'
        +'<td>'+(t.provider_preset?escHtml(t.provider_preset):'<span class="text-gray-400">none</span>')+'</td>'
        +'<td class="text-xs">'+(t.webhook_url?escHtml(t.webhook_url):'<span class="text-gray-400">none</span>')+'</td>'
        +'<td>'+(t.is_active?'Active':'Inactive')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-ghost" data-edit="'+escHtml(t.id)+'">Edit</button>'
        +'<button class="btn btn-sm btn-danger" data-del="'+escHtml(t.id)+'">Del</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(b.getAttribute('data-edit')));
    list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Delete this target?'))return;
      const id=b.getAttribute('data-del');
      const r=await api('/integration-targets/'+encodeURIComponent(id),{method:'DELETE'});
      showMsg(r?'Deleted':('Delete failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
      if(r)load();
    });
  };
  const form=async(id)=>{
    // The catalogue is the app's own routable-provider list; if it cannot be read, a literal-URL
    // target is still perfectly creatable, so this degrades to "none" instead of blocking the form.
    let presets=[];
    const pd=await api('/provider-presets');
    if(pd&&pd.providers)presets=pd.providers;
    let item={};
    if(id){const d=await api('/integration-targets');const it=((d&&d.integration_targets)||[]).find(x=>x.id===id);if(it)item=it}
    const modal=h('div',{className:'modal-overlay',onclick:function(e){if(e.target===modal)modal.remove()}});
    const box=h('div',{className:'modal-box'});
    box.innerHTML='<h2 class="text-lg font-bold mb-4">'+(id?'Edit':'Add')+' Integration Target</h2>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Name</label><input class="input" id="tg_name" value="'+escHtml(item.name||'')+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Provider label</label><input class="input" id="tg_provider" value="'+escHtml(item.provider||'webhook')+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Provider preset</label>'
      +'<select class="input" id="tg_preset"><option value="">none (route by webhook URL)</option>'
      +presets.map(p=>'<option value="'+escHtml(p.key)+'"'+(item.provider_preset===p.key?' selected':'')+'>'+presetLabel(p)+'</option>').join('')
      +'</select></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Webhook URL</label>'
      +'<input class="input" id="tg_url" value="'+escHtml(item.webhook_url||'')+'" placeholder="https://… (leave blank when a preset routes the target)"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Active</label>'
      +'<input type="checkbox" id="tg_active" '+(item.is_active===false?'':'checked')+'></div>'
      +'<div id="tg_msg" class="text-sm mb-2"></div>'
      +'<div class="flex justify-end gap-2"><button class="btn btn-ghost" id="tg_cancel">Cancel</button><button class="btn btn-primary" id="tg_save">Save</button></div>';
    box.querySelector('#tg_cancel').onclick=()=>modal.remove();
    box.querySelector('#tg_save').onclick=async()=>{
      const preset=box.querySelector('#tg_preset').value;
      const url=box.querySelector('#tg_url').value.trim();
      const msg=box.querySelector('#tg_msg');
      if(preset===''&&url===''){msg.className='text-sm mb-2 text-red-500';msg.textContent='A target needs a webhook URL or a provider preset.';return}
      // provider_preset goes as null when "none" is chosen so the field can be CLEARED; the API reads
      // an absent field as "leave alone" and an explicit null as "clear" (same contract as api_key).
      const body={name:box.querySelector('#tg_name').value.trim()||'Target',
                  provider:box.querySelector('#tg_provider').value.trim()||'webhook',
                  provider_preset:preset===''?null:preset,
                  webhook_url:url,
                  is_active:box.querySelector('#tg_active').checked};
      const r=await api(id?'/integration-targets/'+encodeURIComponent(id):'/integration-targets',{method:id?'PUT':'POST',body:JSON.stringify(body)});
      if(r){showMsg('Saved!');modal.remove();load()}
      else{msg.className='text-sm mb-2 text-red-500';msg.textContent='Error saving: '+(LAST_ERR||'request failed')}
    };
    modal.appendChild(box);document.body.appendChild(modal);
  };
  c.querySelector('#tgtAdd').onclick=()=>form(null);
  load();
}

// The providers this platform actually uses, enumerated from the code:
/// integration_provider_presets (migration 045 + the preset seed), the AI providers in
/// src/handlers/user_integration_handler.rs, and the email providers in the admin email
/// settings. Keep this list and that union in step.
// 2026-10-11 programme run: this list is validated against `available_providers` by
// POST /provider-keys, and three of its old entries could never be saved —
// `mailchimp` (no transport in EMAIL_PROVIDERS and nothing reads it) and `webhook` (a per-step
// Notify CHANNEL whose URL lives in the step config, not a stored provider key) are gone, and
// `coreswift_crm` was corrected to the catalogue's real key `coreswift`. `gemini` and `sendgrid`
// stayed: both ARE callable (AI_PROVIDERS / EMAIL_PROVIDERS) and gained catalogue rows in 086.
const PROVIDER_SLOTS = [
  ['openai','OpenAI'], ['anthropic','Anthropic'], ['deepseek','DeepSeek'], ['gemini','Google Gemini'],
  ['mailgun','Mailgun'], ['sendgrid','SendGrid'], ['sendiio','Sendiio'],
  ['n8n','n8n'], ['coreswift','CoreSwift CRM'], ['smtp','SMTP'],
];

// Written out by hand because the generic renderCRUD form CANNOT work for a credential:
// it renders one plain-text input per field name, and this panel was declared as
// ['provider','key_prefix','is_active'] — so there was no input for the secret at all.
// Every save posted {provider,key_prefix,is_active}, and the API correctly answered
// 400 "api_key is required": the admin side had NO SLOT to enter a key. `key_prefix`
// is not even a property of the response, so that list column was always blank too.
function renderProviderKeys(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-2">Provider Keys</h2>'
    +'<p class="text-xs text-gray-400 mb-4">Per-account API keys for the providers this platform uses. '
    +'Reads only ever return a mask; the Encrypted column states whether the saved copy is encrypted at rest.</p>'
    +'<div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end mb-5">'
    +'<div><label class="block text-xs font-medium text-gray-500 mb-1">Provider</label>'
    +'<select id="pk_provider" class="input">'
    +PROVIDER_SLOTS.map(function(s){return '<option value="'+s[0]+'">'+s[1]+' ('+s[0]+')</option>'}).join('')
    +'</select></div>'
    +'<div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">API key</label>'
    +'<input id="pk_key" class="input" type="password" autocomplete="new-password" '
    +'placeholder="paste the provider key"></div>'
    +'<div><button class="btn btn-primary" id="pk_save">Save key</button></div>'
    +'</div><div id="pkdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';

  const list=c.querySelector('#pkdata');
  const short=(p)=>{const i=PROVIDER_SLOTS.findIndex(s=>s[0]===p);return i>=0?PROVIDER_SLOTS[i][1]:p};

  const load=async()=>{
    const d=await api('/provider-keys');
    const items=(d&&d.provider_keys)||[];
    if(!items.length){
      list.innerHTML='<p class="text-gray-400 text-sm">No provider keys stored yet. Pick a provider above, paste its key and press Save — an empty slot is fine, it is filled when the key arrives.</p>';
      return;
    }
    list.innerHTML='<table class="table"><thead><tr><th>Provider</th><th>Key</th><th>Stored</th><th>Encrypted</th><th>Active</th><th></th></tr></thead><tbody>'
      +items.map(k=>'<tr><td><strong>'+short(k.provider)+'</strong>'
        +'<span class="text-xs text-gray-400 ml-2">'+k.provider+'</span></td>'
        +'<td>'+(k.api_key||'(empty)')+'</td>'
        +'<td class="text-xs text-gray-500">'+String(k.updated_at||k.created_at||'').slice(0,10)+'</td>'
        +'<td>'+(k.has_key===false?'<span class="text-gray-400">'+"\u2014"+'</span>':(k.sealed===true?'<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:9999px;font-size:12px" data-pk="sealed">'+"\uD83D\uDD12 encrypted"+'</span>':'<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:9999px;font-size:12px" data-pk="plain">'+"\u26A0 in the clear"+'</span>'))+'</td>'
        +'<td>'+(k.is_active?'Yes':'No')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-danger" data-del="'+k.provider+'">Delete</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
      const p=b.getAttribute('data-del');
      if(!confirm('Delete the stored key for '+p+'?'))return;
      const r=await api('/provider-keys/'+encodeURIComponent(p),{method:'DELETE'});
      showMsg(r?'Deleted '+p:('Delete failed: '+LAST_ERR),r?undefined:'error');
      load();
    });
  };

  c.querySelector('#pk_save').onclick=async()=>{
    const provider=c.querySelector('#pk_provider').value;
    const api_key=c.querySelector('#pk_key').value.trim();
    if(!api_key){showMsg('Paste the key value first — an empty value is rejected by the API.','error');return}
    const r=await api('/provider-keys',{method:'POST',body:JSON.stringify({provider,api_key})});
    if(r){showMsg('Stored key for '+provider);c.querySelector('#pk_key').value='';load();}
    else showMsg('Save failed: '+LAST_ERR,'error');
  };

  load();
}

// --- Payments: Payment Providers (kanban t_cp-pay-ui) ---
// This panel was `renderCRUD(c,'payments','Payment Provider',['provider_type','is_active'],'/payment-providers')`,
// and against THIS resource the generic CRUD cannot work — three independent measurements:
//   * Add posts only provider_type + is_active, but POST /payment-providers refuses a create with no
//     api_key ("api_key is required when creating a new provider") — measured live: 400.
//   * the generic Edit does GET <ep>/<id> then PUT <ep>/<id>; NEITHER route exists for this resource
//     (both answer 405 Method Not Allowed) — so Edit could never open or save.
//   * the generic Del sends the row's `id` (a uuid), while DELETE /payment-providers/{provider_type}
//     matches on provider_type — so Delete raised "not found" for every row.
// Same rule the API Keys panel below already follows: a resource that is not a CRUD row gets its own
// renderer. The fields are the handler's own ones. A blank secret is the "not submitted" signal the
// handler keys on, so an edit that leaves both secret boxes empty KEEPS the stored credential rather
// than wiping it (the failure class fixed on the FunnelSwift console today).
function renderPaymentProviders(c){
    // At-rest posture of a payment provider's SAVED credential (kanban t_d1fcda7e). Measured by the
  // API off the ciphertext COLUMN, never asserted here: until 2026-10-16 this panel promised
  // "stored encrypted" whatever the row held, and `key_status` cannot tell a sealed row from a
  // legacy plaintext one. Tri-state — a missing field prints "unknown", never "in the clear".
  const postureCell=(set,sealed)=>!set?'<span class="text-gray-400">—</span>'
    :(sealed===true?'<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:9999px;font-size:12px" data-pp="sealed">encrypted</span>'
    :sealed===false?'<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:9999px;font-size:12px" data-pp="plain">in the clear</span>'
    :'<span class="text-gray-400" data-pp="unknown">unknown</span>');
const PSLOTS=[['stripe','Stripe'],['paypal','PayPal'],['square','Square'],['paddle','Paddle']];
  const pname=(p)=>{const i=PSLOTS.findIndex(s=>s[0]===p);return i>=0?PSLOTS[i][1]:(p||'')};
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-2"><h2 class="text-xl font-bold">Payment Providers</h2>'
    +'<button class="btn btn-primary btn-sm" id="pp_add">+ Add provider</button></div>'
    +'<p class="text-xs text-gray-400 mb-4">The payment accounts this install can take money through at checkout. A platform administrator manages them here; the secret key and the webhook signing secret are never shown back, and the Encrypted column states whether the saved copy is encrypted at rest.</p>'
    +'<div id="ppdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const list=c.querySelector('#ppdata');

  // kanban t_48e4dd2a — ask the provider directly whether a payment key works (the FunnelSwift
  // console's button, ported; precedent commit b153f98). Read-only: the app performs ONE balance or
  // token call and stores NOTHING when the key came from the box.
  //
  // A RAW fetch, NOT this panel's api() helper: api() reads the body of a failed answer only to
  // lift `message` into LAST_ERR and returns null, so a 424 refusal would reach the operator as the
  // bare provider sentence — with the MASK and the INACTIVE warning (both carried in the same body)
  // silently dropped. Measured before this change: the toast read "Stripe refused the key: Invalid
  // API Key provided: sk_test_***…" and nothing else. The key itself is never echoed back by either
  // form of the answer: only a mask is.
  const testKey=async(ptype,apiKey)=>{
    const p=String(ptype||'').trim();
    if(!p){showMsg('Choose a provider first','error');return}
    const usingBox=!!(apiKey&&String(apiKey).trim());
    showMsg('Testing the '+(usingBox?'key in the box':('stored '+(pname(p)||p)+' key'))+'…');
    try{
      const res=await fetch(API+'/payment-providers/'+encodeURIComponent(p)+'/test',{
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},TOKEN?{'Authorization':'Bearer '+TOKEN}:{}),
        body:JSON.stringify({api_key:usingBox?String(apiKey).trim():''})
      });
      let j={};
      try{j=await res.json()}catch(e){j={}}
      const tail=j.api_key_masked?(' (key '+j.api_key_masked+')'):'';
      const inactive=(j.stored_active===false)?' — this provider row is INACTIVE, so checkout still refuses until it is set Active.':'';
      showMsg((j.message||(res.ok?'The provider accepted the key':'The key test could not run'))+tail+inactive,
              res.ok?undefined:'error');
    }catch(err){
      showMsg('Could not run the key test: '+((err&&err.message)?err.message:err),'error');
    }
  };

  const form=(row)=>{
    const isEdit=!!row;
    const val=(k,d)=>((row&&row[k]!==undefined&&row[k]!==null)?String(row[k]):(d===undefined?'':d));
    const modal=h('div',{className:'modal-overlay'});
    modal.onclick=(e)=>{if(e.target===modal)modal.remove()};
    const box=h('div',{className:'modal-box'});
    box.innerHTML='<h2 class="text-lg font-bold mb-4">'+(isEdit?'Edit':'Add')+' payment provider</h2><form id="ppf">'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Provider</label>'
      +'<select class="input" name="provider_type"'+(isEdit?' disabled':'')+'>'
      +PSLOTS.map(s=>'<option value="'+s[0]+'"'+(val('provider_type')===s[0]?' selected':'')+'>'+s[1]+'</option>').join('')
      +'</select></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Label (what this install calls it)</label>'
      +'<input class="input" name="label" value="'+escHtml(val('label',''))+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Secret key'+(isEdit?' &mdash; leave blank to keep the stored key':'')+'</label>'
      +'<input class="input" type="password" name="api_key" autocomplete="new-password" placeholder="'+(isEdit?'(unchanged)':'sk_live_... / sk_test_...')+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Webhook signing secret'+(isEdit?' &mdash; leave blank to keep the stored secret':'')+'</label>'
      +'<input class="input" type="password" name="webhook_secret" autocomplete="new-password" placeholder="'+(isEdit?'(unchanged)':'whsec_...')+'"></div>'
      +'<div class="mb-3"><label class="block text-xs font-medium text-gray-500 mb-1">Publishable key</label>'
      +'<input class="input" name="publishable_key" value="'+escHtml(val('publishable_key',''))+'"></div>'
      +'<div class="mb-2 flex items-center gap-2"><input type="checkbox" id="pp_test"'+(isEdit&&row.is_test_mode===false?'':' checked')+'>'
      +'<label for="pp_test" class="text-sm">Test mode (use the provider\'s sandbox)</label></div>'
      +'<div class="mb-1 flex items-center gap-2"><input type="checkbox" id="pp_active"'+(isEdit&&row.is_active?' checked':'')+'>'
      +'<label for="pp_active" class="text-sm">Active (offer this provider at checkout)</label></div>'
      +'</form><div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" id="pp_tk" title="Asks the provider whether the key in this box works, without saving it.">Test key</button><button class="btn btn-ghost" id="pp_cancel">Cancel</button><button class="btn btn-primary" id="pp_save">Save</button></div>';
    modal.appendChild(box);document.body.appendChild(modal);
    const q=(n)=>box.querySelector('[name='+n+']');
    box.querySelector('#pp_cancel').onclick=()=>modal.remove();
    // kanban t_48e4dd2a — the box's own "Test key": whatever is in the Secret key field is tested
    // AS TYPED and never stored, so a key can be checked before it is committed — and a bad key can
    // no longer be discovered only by a customer pressing Upgrade.
    box.querySelector('#pp_tk').onclick=()=>testKey(q('provider_type').value,q('api_key').value);
    box.querySelector('#pp_save').onclick=async()=>{
      const body={
        provider_type:isEdit?row.provider_type:q('provider_type').value,
        label:q('label').value.trim(),
        publishable_key:q('publishable_key').value.trim(),
        is_test_mode:box.querySelector('#pp_test').checked,
        is_active:box.querySelector('#pp_active').checked,
      };
      const k=q('api_key').value.trim();if(k)body.api_key=k;
      const w=q('webhook_secret').value.trim();if(w)body.webhook_secret=w;
      if(!isEdit&&!body.api_key){showMsg('The secret key is required when adding a provider — the API refuses a create without it.','error');return}
      const r=await api('/payment-providers',{method:'POST',body:JSON.stringify(body)});
      if(r){showMsg(r.status==='created'?('Added '+pname(body.provider_type)):('Updated '+pname(body.provider_type)));modal.remove();load();}
      else showMsg('Save failed: '+LAST_ERR,'error');
    };
  };

  const load=async()=>{
    const d=await api('/payment-providers');
    const items=(d&&d.providers)||[];
    if(!items.length){
      list.innerHTML='<p class="text-gray-400 text-sm">No payment provider is configured yet. Add one above and checkout will offer it; until then checkout should refuse rather than pretend to charge.</p>';
      return;
    }
    list.innerHTML='<table class="table"><thead><tr><th>Provider</th><th>Label</th><th>Secret key</th><th>Encrypted</th><th>Mode</th><th>Active</th><th></th></tr></thead><tbody>'
      +items.map(p=>'<tr><td><strong>'+escHtml(pname(p.provider_type))+'</strong>'
        +'<span class="text-xs text-gray-400 ml-2">'+escHtml(p.provider_type||'')+'</span></td>'
        +'<td>'+escHtml(p.label||'')+'</td>'
        +'<td>'+(p.key_status==='configured'?'stored':'not set')+'</td>'
        +'<td data-pp-posture>key '+postureCell(p.api_key_set,p.api_key_sealed)+' webhook '+postureCell(p.webhook_secret_set,p.webhook_secret_sealed)+'</td>'
        +'<td>'+(p.is_test_mode?'Test':'Live')+'</td>'
        +'<td>'+(p.is_active?'Yes':'No')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-ghost" data-test="'+escHtml(p.provider_type||'')+'" title="Asks the provider whether the STORED key of this row works.">Test stored key</button> '
        +'<button class="btn btn-sm btn-ghost" data-edit="'+escHtml(p.provider_type||'')+'">Edit</button> '
        +'<button class="btn btn-sm btn-danger" data-del="'+escHtml(p.provider_type||'')+'">Remove</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('button[data-test]').forEach(b=>b.onclick=()=>testKey(b.getAttribute('data-test'),''));
    list.querySelectorAll('button[data-edit]').forEach(b=>b.onclick=()=>form(items.find(x=>x.provider_type===b.getAttribute('data-edit'))));
    list.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
      const p=b.getAttribute('data-del');
      if(!confirm('Remove the '+pname(p)+' configuration? Checkout will stop offering it.'))return;
      const r=await api('/payment-providers/'+encodeURIComponent(p),{method:'DELETE'});
      showMsg(r?('Removed '+pname(p)):('Remove failed: '+LAST_ERR),r?undefined:'error');
      load();
    });
  };

  c.querySelector('#pp_add').onclick=()=>form(null);
  load();
}

// --- API Keys (tenant-scoped: POST /api-keys -> {key, prefix, message}) ---
// Stripped out of the generic renderCRUD for exactly the reason an API key is not a CRUD
// row: the value exists in the clear exactly once. POST /api-keys answers
// {key, prefix, message:"Save this key — it will not be shown again"} and GET /api-keys
// only ever returns `prefix`. The panel was declared with a `key_prefix` column, which is
// not a property of the response at all (so that column rendered blank), and its form only
// posted `name` — a key created from this console was therefore never displayed and could
// never be used by anything. This panel shows the value once, with the API's own warning,
// and keeps the prefix in the list as the only identifier that survives.
function renderApiKeys(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-2">API Keys</h2>'
    +'<p class="text-xs text-gray-400 mb-4">Bearer credentials for the WorkflowSwift API and the Swift Market Intel Chrome extension. '
    +'The key value is returned once, at creation — afterwards only its prefix is readable.</p>'
    +'<div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end mb-5">'
    +'<div class="md:col-span-3"><label class="block text-xs font-medium text-gray-500 mb-1">Name</label>'
    +'<input id="ak_name" class="input" placeholder="what this key is for (e.g. market-intel-extension)"></div>'
    +'<div><button class="btn btn-primary" id="ak_create">Create key</button></div></div>'
    +'<div id="aknew"></div><div id="akdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';

  const list=c.querySelector('#akdata');

  const showOnce=function(k){
    c.querySelector('#aknew').innerHTML='<div class="p-3 mb-4 rounded-lg bg-amber-50 border border-amber-300">'
      +'<p class="text-sm font-semibold text-amber-800 mb-1">Copy this key now — it will not be shown again.</p>'
      +'<div class="flex items-center gap-2"><code class="text-xs break-all bg-white border rounded px-2 py-1 flex-1">'+escHtml(k.key)+'</code>'
      +'<button class="btn btn-sm" id="ak_copy">Copy</button></div></div>';
    const b=c.querySelector('#ak_copy');
    if(b)b.onclick=function(){
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(k.key).then(function(){showMsg('API key copied')},function(){showMsg('Copy blocked — select the value above','error')});
      }else showMsg('Copy blocked — select the value above','error');
    };
  };

  const load=async()=>{
    const d=await api('/api-keys');
    if(d===null){list.innerHTML='<p class="text-red-400 text-sm">'+escHtml(LAST_ERR||'Could not load API keys')+'</p>';return}
    const items=unwrapList(d);
    if(!items.length){list.innerHTML='<p class="text-gray-400 text-sm">No API keys yet. Name one above and press Create — the value is shown once, right after it is minted.</p>';return}
    list.innerHTML='<table class="table"><thead><tr><th>Name</th><th>Key prefix</th><th>Created</th><th>Last used</th><th>Active</th><th style="width:100px"></th></tr></thead><tbody>'
      +items.map(k=>'<tr><td><strong>'+escHtml(k.name||'-')+'</strong></td>'
        +'<td class="text-xs text-gray-500">'+escHtml(k.prefix||'-')+'…</td>'
        +'<td class="text-xs text-gray-500">'+String(k.created_at||'').slice(0,10)+'</td>'
        +'<td class="text-xs text-gray-500">'+(k.last_used_at?String(k.last_used_at).slice(0,16).replace('T',' '):'never')+'</td>'
        +'<td>'+(k.is_active?'Yes':'No')+'</td>'
        +'<td class="text-right"><button class="btn btn-sm btn-danger" data-del="'+escHtml(k.id)+'">Delete</button></td></tr>').join('')
      +'</tbody></table>';
    list.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
      const id=b.getAttribute('data-del');
      if(!confirm('Delete this API key? Anything using it stops working immediately.'))return;
      const r=await api('/api-keys/'+encodeURIComponent(id),{method:'DELETE'});
      showMsg(r?'API key deleted':('Delete failed: '+(LAST_ERR||'request failed')),r?undefined:'error');
      load();
    });
  };

  c.querySelector('#ak_create').onclick=async()=>{
    const name=(c.querySelector('#ak_name').value||'').trim()||'default';
    const r=await api('/api-keys',{method:'POST',body:JSON.stringify({name})});
    if(!r||!r.key){
      // No `key` in the answer means the mint never ran: the plan gate answers 402
      // ("API access is not included in your current plan…"). LAST_ERR holds the API's own
      // sentence, so show that verbatim instead of a generic failure.
      showMsg('Create failed: '+(LAST_ERR||'no key returned'),'error');return;
    }
    c.querySelector('#ak_name').value='';
    showMsg('API key created');
    showOnce(r);
    load();
  };

  load();
}

// Escape anything that came out of the API or an operator's typing before it is
// concatenated into innerHTML — a key *name* is free text, and so is a workspace name
// (tenant-controlled at the unauthenticated signup door: kanban t_d5d208d3).
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderN8N(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">n8n Proxy</h2><div id="n8ndata"></div></div>';
  api('/n8n/health').then(d=>{
    c.querySelector('#n8ndata').innerHTML=d?`<div class="p-4 bg-green-50 rounded-lg"><p class="text-green-700 font-semibold">✅ n8n Connected</p><pre class="text-xs text-green-600 mt-2 overflow-x-auto">${escHtml(JSON.stringify(d,null,2))}</pre></div>`:'<p class="text-red-400">n8n unreachable.</p>';
  });
}

function renderBridge(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">Bridge (OpenClaw)</h2><div id="bridata"></div></div>';
  api('/bridge-tasks').then(d=>{
    const el=c.querySelector('#bridata');

    el.innerHTML=d.tasks.map(t=>`<div class="p-3 border-b"><strong>${escHtml(t.name||t.id)}</strong><span class="text-xs text-gray-500 ml-2">${escHtml(t.status)}</span></div>`).join('');
  });
}

// ── MY PROFILE (fleet profile contract) ─────────────────────────────────────────────
// The backend has carried the whole profile surface since card t_39cea779 — PUT /auth/profile
// (name/username/company), POST /auth/avatar (multipart picture) and PUT /auth/password
// (current + new) — and the tenant SPA exercises it, but THIS console's My Profile screen was
// read-only: name and email as text, no picture, no company, no password box. The console's own
// guide (MYPROFILE_HELP below) tells the operator "Set your name, company and picture" and
// "Change your password", so a documented surface the screen does not offer is the defect this
// closes. A backend route with no UI is a defect — the same rule ADASwift's console applied.
// The Role line below printed `me.role` verbatim, so an operator read the database's own enum
// (`super_admin`, `company_admin`, `team_member`, ...) — the same defect CoreSwift's panel fixed
// with roleLabel, and the same one this app's own tenant console avoids. This is the last place
// in the fleet that showed a raw role enum; a missing role is an em-dash, never a made-up word.
const ROLE_LABELS={owner:'Owner',admin:'Admin',super_admin:'Super admin',agency_admin:'Agency admin',
  client_admin:'Client admin',company_admin:'Company admin',team_member:'Team member',
  member:'Member',user:'Owner',viewer:'Viewer'};
// Unknown values are shown as-is (honest, never an invented role); a missing one is an em-dash.
const roleLabel=r=>{const s=String(r==null?'':r).trim();if(!s)return '—';return ROLE_LABELS[s.toLowerCase()]||s};
function renderProfile(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">My Profile</h2><div id="pdata"><p class="text-gray-400">Loading...</p></div></div>';
  const host=c.querySelector('#pdata');
  api('/auth/me').then(d=>{
    if(!d){host.innerHTML='<p class="text-red-400">Could not load your profile: '+escHtml(LAST_ERR||'request failed')+'</p>';return}
    const me=(d&&d.user)||d||{};
    host.innerHTML='';
    const wrap=h('div',{className:'grid grid-cols-2 gap-6'});
    const left=h('div',{}),right=h('div',{});
    wrap.appendChild(left);wrap.appendChild(right);host.appendChild(wrap);

    // ── picture + name + company (the editable half) ──
    left.appendChild(h('label',{className:'text-xs text-gray-500'},'Profile picture'));
    const picRow=h('div',{className:'flex items-center gap-3 mt-1 mb-3'});
    // BOTH cells are built and then shown/hidden by `paint()` below, so an upload and a removal can
    // each repaint this screen IN PLACE. A full renderApp() here would rebuild the screen and throw
    // away the confirmation message that very action is; the fleet's FunnelSwift hit exactly that.
    const im=h('img',{id:'wsac-av',alt:'Profile picture',style:'width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid #e5e7eb;flex:none'});
    const ph=h('span',{id:'wsac-avph',style:'width:72px;height:72px;border-radius:50%;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:24px;flex:none'},(me.name||me.email||'U').charAt(0).toUpperCase());
    if(me.avatar_url){im.src=me.avatar_url;im.style.display='';ph.style.display='none'}
    else{im.style.display='none';ph.style.display='flex'}
    picRow.appendChild(im);picRow.appendChild(ph);
    const fileIn=h('input',{id:'wsac-file',type:'file',accept:'image/png,image/jpeg,image/webp,image/gif',style:'display:none'});
    const pickBtn=h('button',{className:'btn btn-ghost btn-sm',id:'wsac-avpick'},me.avatar_url?'Replace picture':'Upload picture');
    pickBtn.onclick=()=>fileIn.click();
    // The REMOVAL twin. The email-branding logo has had its own DELETE since it shipped, but the
    // profile picture could only ever be REPLACED: the upload upserts one row per user, so an
    // operator who wanted their initials back had no way to ask and this screen could only offer
    // "Upload picture". Painted HIDDEN while no picture exists, REVEALED by a successful upload in
    // place, WITHDRAWN again once the removal lands.
    const delBtn=h('button',{className:'btn btn-ghost btn-sm',id:'wsac-avdel',style:'margin-left:6px'},'Remove picture');
    delBtn.style.display=me.avatar_url?'':'none';
    const avMsg=h('span',{id:'wsac-avmsg',className:'text-xs text-gray-500',style:'margin-left:8px'},'');
    // One repaint for both actions, so the three UI states can never disagree with the state the
    // server just reported: the picture, the placeholder and the Remove control move together.
    const paint=()=>{
      const url=me.avatar_url||'';
      if(url){im.src=url;im.style.display='';ph.style.display='none'}
      else{im.removeAttribute('src');im.style.display='none';ph.style.display='flex'}
      pickBtn.textContent=url?'Replace picture':'Upload picture';
      delBtn.style.display=url?'':'none';
    };
    fileIn.onchange=async()=>{
      const f=fileIn.files&&fileIn.files[0];if(!f)return;
      if(f.size>2*1024*1024){showMsg('That image is larger than 2 MB','error');fileIn.value='';return}
      const fd=new FormData();fd.append('file',f,f.name||'picture');
      pickBtn.disabled=true;
      try{
        const res=await fetch(API+'/auth/avatar',{method:'POST',headers:TOKEN?{'Authorization':'Bearer '+TOKEN}:{},body:fd});
        const j=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(j.message||j.error||('HTTP '+res.status));
        me.avatar_url=j.avatar_url||'';
        // The screen was painted when there was NO picture, so the Remove control came out hidden.
        // `paint()` reveals it here rather than making the operator reopen the tab.
        paint();avMsg.textContent='Picture updated';
        showMsg('Profile picture updated','success');
      }catch(e){showMsg('Upload failed: '+e.message,'error');fileIn.value='';avMsg.textContent=''}
      pickBtn.disabled=false;
    };
    delBtn.onclick=async()=>{
      if(!me.avatar_url){showMsg('There is no picture to remove','error');return}
      if(!window.confirm('Remove your profile picture?'))return;
      delBtn.disabled=true;
      try{
        const res=await fetch(API+'/auth/avatar',{method:'DELETE',headers:TOKEN?{'Authorization':'Bearer '+TOKEN}:{}});
        const j=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(j.message||j.error||('HTTP '+res.status));
        me.avatar_url='';
        paint();avMsg.textContent='Picture removed';
        showMsg('Profile picture removed','success');
      }catch(e){showMsg('Remove failed: '+e.message,'error')}
      delBtn.disabled=false;
    };
    picRow.appendChild(h('div',{},pickBtn,delBtn,h('p',{className:'text-xs text-gray-400'},'PNG, JPEG, WebP or GIF, up to 2 MB.'),fileIn,avMsg));
    left.appendChild(picRow);

    left.appendChild(h('label',{className:'text-xs text-gray-500'},'Name'));
    const nameIn=h('input',{className:'input mb-3',maxlength:'200'});nameIn.value=me.name||'';
    left.appendChild(nameIn);
    left.appendChild(h('label',{className:'text-xs text-gray-500'},'Company'));
    const compIn=h('input',{className:'input mb-3',maxlength:'200'});compIn.value=me.company||'';
    left.appendChild(compIn);
    const saveBtn=h('button',{className:'btn btn-primary'},'Update profile');
    saveBtn.onclick=async()=>{
      const name=nameIn.value.trim(),company=compIn.value.trim();
      if(!name){showMsg('Name cannot be empty','error');return}
      saveBtn.disabled=true;saveBtn.textContent='Saving...';
      const r=await api('/auth/profile',{method:'PUT',body:JSON.stringify({name,company})});
      saveBtn.disabled=false;saveBtn.textContent='Update profile';
      if(r){showMsg('Profile updated','success');renderApp();}else showMsg('Save failed: '+(LAST_ERR||'request failed'),'error');
    };
    left.appendChild(saveBtn);

    // ── read-only identity + the password box ──
    right.appendChild(h('label',{className:'text-xs text-gray-500'},'Email'));
    right.appendChild(h('p',{className:'font-semibold mb-3'},me.email||'-'));
    right.appendChild(h('label',{className:'text-xs text-gray-500'},'Role'));
    right.appendChild(h('p',{className:'font-semibold mb-3'},roleLabel(me.role)));
    right.appendChild(h('label',{className:'text-xs text-gray-500'},'Plan'));
    right.appendChild(h('p',{className:'font-semibold mb-4'},me.plan_name||'Free'));

    right.appendChild(h('label',{className:'text-xs text-gray-500'},'Change password'));
    const curIn=h('input',{className:'input mb-2',type:'password',autocomplete:'current-password',placeholder:'Current password'});
    const newIn=h('input',{className:'input mb-2',type:'password',autocomplete:'new-password',placeholder:'New password (8+ characters)'});
    right.appendChild(curIn);right.appendChild(newIn);
    const pwBtn=h('button',{className:'btn btn-primary'},'Update password');
    pwBtn.onclick=async()=>{
      const cur=curIn.value,nw=newIn.value;
      if(!cur||!nw){showMsg('Enter your current and new password','error');return}
      if(nw.length<8){showMsg('New password must be at least 8 characters','error');return}
      pwBtn.disabled=true;pwBtn.textContent='Saving...';
      const r=await api('/auth/password',{method:'PUT',body:JSON.stringify({current_password:cur,new_password:nw})});
      pwBtn.disabled=false;pwBtn.textContent='Update password';
      if(r){showMsg('Password updated','success');curIn.value='';newIn.value='';}else showMsg('Password change failed: '+(LAST_ERR||'request failed'),'error');
    };
    right.appendChild(pwBtn);
  });
}

  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-4">&#127912; Email Branding</h2><div id="bdata"><p class="text-gray-400">Loading...</p></div></div>';

  else box.appendChild(h('span',{className:'text-xs text-gray-400'},'No logo yet'));

    const fd=new FormData();fd.append('file',f,f.name||'logo');const res=await fetch(API+'/settings/branding/logo',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});

    btns.appendChild(rmBtn);
  }

  // What a RECIPIENT sees — mirrors Branding::header_html (src/branding.rs): a centred logo (max
  // 56px high / 240px wide); otherwise the brand name in 20px #111827; then a 3px rule in the brand
  // colour. Nothing at all when neither is set, which is why the note says the app's own header
  // stays. Repainted from the FIELD values on every keystroke (not from the saved document), so a
  // colour or name can be judged before saving. It sends nothing and saves nothing.
  const prevWrap=h('div',{className:'mt-5 pt-4',style:'border-top:1px solid #e2e8f0'});

  prevWrap.appendChild(h('p',{className:'text-xs text-gray-500 mb-3'},'The header block the app puts at the top of every email this account sends. It follows the fields above as you type; this preview sends nothing and saves nothing.'));
  const bpBox=h('div',{id:'bp-box',style:'border:1px solid #e2e8f0;border-radius:12px;padding:22px;background:#fff;max-width:560px'});
  prevWrap.appendChild(bpBox);

      bpBox.appendChild(line);
      bpBox.appendChild(h('div',{id:'bp-rule',style:'border-top:3px solid '+col+';margin:0 0 18px'}));
    }
    bpBox.appendChild(h('div',{style:'font:14px/1.5 -apple-system,\'Segoe UI\',Roboto,Helvetica,Arial,sans-serif;color:#111827'},'Hi Alex — this is a sample of the message body. Only the header above comes from your branding.'));
    bpBlank.style.display=branded?'none':'block';
    bpBlank.textContent=branded?'':'Nothing is set yet, so mail keeps the WorkflowSwift header.';
  };
  paint();
}

// The signed-in account's OWN tier comes from GET /auth/me (`plan_name`), which the server
// resolves through the SAME resolver every entitlement gate uses (features::resolve_plan_id), so
// this screen can never name a different tier from the one the app enforces. The catalogue from
// GET /plans is only what else is on offer. Before this, the card headed "My Plan" printed the
// whole catalogue and never said which plan the account was actually on — the one place a level
// appears on this console, showing every level instead of theirs.
// ── PLAN REQUESTS (2026-10-19) ────────────────────────────────────────────────────────────────
// "Ask support if you need a different plan" WAS the upgrade path on this screen: the customer
// could see every plan and its price and then had to leave the console and write an email, so the
// ask was never recorded against the workspace. Each paid plan now carries a Request button that
// files the ask as a real tenant-scoped ticket (POST /tickets — the same queue the operator already
// answers under Support > Tickets), so the request is recorded, attributed and visible.
// No payment is taken here and the message says so; a second click on a plan that already has an
// OPEN request is refused locally, so the queue cannot be spammed.
async function requestPlan(btn){
  const name=btn.getAttribute('data-plan-name')||'';
  const slug=btn.getAttribute('data-plan-slug')||'';
  const price=btn.getAttribute('data-plan-price')||'';
  if(!slug){showMsg('That plan carries no identifier — ask support to add one','error');return}
  const label=btn.textContent;
  btn.disabled=true; btn.textContent='Requesting…';
  try{
    const existing=await api('/tickets?per_page=50');
    const items=(existing&&Array.isArray(existing.items))?existing.items:[];
    const already=items.find(t=>/^Plan request/i.test(String(t.subject||''))
      && String(t.subject||'').includes(name)
      && !['closed','resolved','done'].includes(String(t.status||'').toLowerCase()));
    if(already){
      showMsg('You already have an open request for '+name+' — no need to ask twice');
      btn.textContent='Requested'; btn.disabled=false; return;
    }
    const priced=price?('$'+price+'/mo'):'price on request';
    const r=await api('/tickets',{method:'POST',body:JSON.stringify({
      subject:'Plan request — '+name+' ('+priced+')',
      description:'This workspace asked to move to the '+name+' plan (slug: '+slug+', '+priced+').\n\n'
        +'Filed from Admin > Profile & Account > Plans & Credits. No payment was taken in the console: '
        +'our team sets the plan up on this workspace and confirms.',
      priority:'high',
      source:'plan_request'
    })});
    if(!r){
      showMsg('Could not file the request: '+(LAST_ERR||'please try again'),'error');
      btn.textContent=label; btn.disabled=false; return;
    }
    showMsg('Request sent — our team will move this workspace to '+name+'. Nothing was charged.');
    btn.textContent='Requested';
  }catch(e){
    showMsg('Could not file the request: '+String((e&&e.message)||e),'error');
    btn.textContent=label; btn.disabled=false;
  }
}

async function renderPlansCredits(c){
  c.innerHTML=`<div class="space-y-4">
    <div class="card"><h2 class="text-xl font-bold mb-4">My Plan</h2><div id="pldata"><p class="text-gray-400 text-sm">Loading...</p></div></div>
    <div class="card"><h2 class="text-xl font-bold mb-4">Credits</h2><div id="crdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>
    <div class="card"><h2 class="text-xl font-bold mb-4">All plans</h2><div id="plall"><p class="text-gray-400 text-sm">Loading...</p></div></div>
  </div>`;
  const me=await api('/auth/me');
  const cat=await api('/plans');
  const plans=(cat&&Array.isArray(cat.plans))?cat.plans:[];
  // `/auth/me` answers `{"user": {...}}` — the server wraps MeResponse (src/auth/handlers.rs::me ends
  // with `json!({ "user": me })`), so the tier lives at `me.user.plan_name`. Measured live
  // 2026-10-18: that field answers "Professional" for the operator account.
  const myName=String((me&&me.user&&me.user.plan_name)||'').trim();
  const same=n=>String(n||'').trim().toLowerCase()===myName.toLowerCase();
  const mine=myName?plans.find(p=>same(p.name)||same(p.slug)):null;

  const el=c.querySelector('#pldata');
  if(!myName){
    el.innerHTML='<p class="text-red-400 text-sm">Could not read your plan: '+escHtml(LAST_ERR||'request failed')+'</p>';
  }else{
    el.innerHTML='';
    el.appendChild(h('div',{className:'flex items-center gap-3'},
      h('div',{className:'text-3xl font-bold text-blue-600'},myName),
      h('span',{className:'badge',style:'background:#d1fae5;color:#065f46'},'current plan')));
    const price=mine?(mine.price_monthly!=null?mine.price_monthly:mine.price):null;
    el.appendChild(h('p',{className:'text-sm text-gray-500 mt-2'},
      price!=null&&price!==''?('$'+price+' per month. Pick another plan in the list below and press Request — nothing is charged here.')
                             :'This is the plan your account runs on.'));
    // A tier's `features` is a JSONB OBJECT of enforced limits (max_users, max_instances,
    // max_tags ...), not a list of sentences: print only the caps the app actually enforces,
    // with -1 / "unlimited" read as unlimited. Retired and support-promise keys are never
    // named here (see admin-guide.html, "Plan limits - settable AND enforced").
    const f=(mine&&mine.features&&typeof mine.features==='object'&&!Array.isArray(mine.features))?mine.features:null;
    const LAB={max_users:'users',max_instances:'instances',max_tags:'tags',max_workflows:'workflows'};
    const lim=k=>{
      const v=f?f[k]:null;
      if(v==null||v==='')return '';
      if(v===-1||v==='unlimited')return 'unlimited '+LAB[k];
      if(typeof v==='number'||/^[0-9]+$/.test(String(v)))return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,',')+' '+LAB[k];
      return '';
    };
    const bits=['max_users','max_instances','max_tags','max_workflows'].map(lim).filter(Boolean);
    if(bits.length)el.appendChild(h('p',{className:'text-xs text-gray-500 mt-2'},'Included: '+bits.join(' \u00b7 ')));
  }

  const all=c.querySelector('#plall');
  if(!plans.length){
    all.innerHTML='<p class="text-gray-400 text-sm">No plans are on offer right now.</p>';
  }else{
    all.innerHTML=plans.map(p=>{
      const pr=(p.price_monthly!=null?p.price_monthly:p.price);
      const isMine=same(p.name)||same(p.slug);
      const paid=Number(pr)>0;
      return '<div class="flex justify-between items-center p-3 border-b">'
        +'<div><strong>'+escHtml(p.name||'')+'</strong>'
        +(isMine?'<span class="badge ml-2" style="background:#d1fae5;color:#065f46">your plan</span>':'')
        +'<span class="text-xs text-gray-500 ml-2">'+escHtml(p.slug||'')+'</span></div>'
        +'<div class="flex items-center gap-3">'
        +'<span class="font-semibold text-sm">$'+escHtml(pr==null?'0':pr)+'/mo</span>'
        +(paid&&!isMine
          ? '<button class="btn btn-primary btn-sm" data-plan-slug="'+escHtml(p.slug||'')+'" '
            +'data-plan-name="'+escHtml(p.name||'')+'" data-plan-price="'+escHtml(String(pr))+'">Request this plan</button>'
          : '')
        +'</div></div>';
    }).join('');
    all.querySelectorAll('button[data-plan-slug]').forEach(btn=>{
      btn.onclick=()=>requestPlan(btn);
    });
  }

  const cr=await api('/credits/balance');
  c.querySelector('#crdata').innerHTML='<div class="text-center py-4"><div class="text-4xl font-bold text-blue-600">'+escHtml((cr&&cr.balance)||0)+'</div><div class="text-xs text-gray-500 mt-1">credits remaining</div></div>';
}

// --- Admin Views ---
// Admin > Usage. Until 2026-10-19 this screen printed the API's JSON into a <pre>: the operator's
// only view of platform usage was escaped JSON, so "how many workspaces / runs / credits are out
// there" could not be read at a glance. It is a real table now — totals, one row per workspace —
// with the raw answer kept behind a disclosure for support. Each row also carries the workspace's
// PLAN TIER, read from the same field /admin/accounts reports (the tier the gates enforce), so an
// operator can see who is on what without switching screens.
function renderAdminUsage(c){
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-1"><h2 class="text-xl font-bold">Platform Usage</h2><span class="text-xs text-gray-400" id="utot"></span></div>'
   +'<p class="text-xs text-gray-400 mb-4">One row per workspace: the plan it is on, its credit balance, how many workflow runs it has made, and whether its automation backend is provisioned. Totals for the platform sit above the table.</p>'
   +'<div id="udata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const fail=()=>{const h=c.querySelector('#udata');if(h)h.innerHTML='<p class="text-red-400">Not available.</p>'};
  Promise.all([api('/admin/usage'),api('/admin/plans')]).then(res=>{
    const d=res[0];
    const PD=res[1];
    const PLANS=((PD&&(PD.plans||PD.items))||[]).filter(p=>p&&p.is_active!==false&&p.slug);
    const host=c.querySelector('#udata');
    if(!host)return;
    if(!d||!Array.isArray(d.accounts)){fail();return}
    const rows=d.accounts;
    const credits=rows.reduce((s,r)=>s+Number(r.credits_balance||0),0);
    const runs=rows.reduce((s,r)=>s+Number(r.workflows_run||0),0);
    const prov=rows.filter(r=>r.n8n_provisioned).length;
    const esc=v=>escHtml(String(v==null?'':v));
    // The Plan cell is WRITABLE. This screen is the operator's one view of what each
    // workspace is on, so a read-only badge here meant switching screens to change it.
    // PUT /admin/accounts/{aid}/plan is the SAME handler Admin > Users (Tenants) uses, so
    // there is one write path, and the row the operator reads is the row that changes.
    const planPicker=(r)=>{
      const cur=String(r.plan_slug||'');
      if(!PLANS.length)return cur?'<span class="badge badge-blue">'+esc(r.plan_name||cur)+'</span>':'<span class="text-gray-400">\u2014</span>';
      const none=cur?'':'<option value="" disabled selected>\u2014 no plan \u2014</option>';
      const opts=PLANS.map(p=>'<option value="'+esc(p.slug)+'"'+(p.slug===cur?' selected':'')+'>'+esc(p.name)+'</option>').join('');
      return '<select class="input text-xs" data-usage-plan="'+esc(r.aid)+'">'+none+opts+'</select>';
    };
    const when=v=>{const t=Date.parse(v);return isNaN(t)?'\u2014':new Date(t).toLocaleDateString()};
    const kpi=(label,val)=>'<div class="rounded-lg bg-gray-50 px-3 py-2"><div class="text-xs uppercase text-gray-400">'+label+'</div><div class="text-lg font-semibold">'+val+'</div></div>';
    let html='<div class="grid grid-cols-4 gap-3 mb-4">'
      +kpi('Workspaces',rows.length)
      +kpi('Workflow runs',runs.toLocaleString())
      +kpi('Credits outstanding',credits.toLocaleString())
      +kpi('Automation provisioned',prov+' / '+rows.length)+'</div>';
    html+='<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs uppercase text-gray-400 border-b">'
      +'<th class="py-2">Workspace</th><th class="py-2">Plan</th><th class="py-2">Credits</th><th class="py-2">Workflow runs</th><th class="py-2">Automation</th><th class="py-2">Created</th></tr></thead><tbody>';
    rows.forEach(r=>{
      html+='<tr class="border-b last:border-0"><td class="py-2 font-medium">'+esc(r.account_name||'(untitled workspace)')+'</td>'
        +'<td class="py-2">'+planPicker(r)+'</td>'
        +'<td class="py-2">'+Number(r.credits_balance||0).toLocaleString()+'</td>'
        +'<td class="py-2">'+Number(r.workflows_run||0).toLocaleString()+'</td>'
        +'<td class="py-2">'+(r.n8n_provisioned?'<span class="badge badge-green">provisioned</span>':'<span class="badge">not yet</span>')+'</td>'
        +'<td class="py-2 text-gray-500">'+when(r.created_at)+'</td></tr>';
    });
    html+='</tbody></table></div>';
    html+='<details class="mt-4"><summary class="text-xs text-gray-400 cursor-pointer">Raw API answer</summary><pre class="text-xs bg-gray-50 p-4 rounded-lg overflow-x-auto mt-2">'+escHtml(JSON.stringify(d,null,2))+'</pre></details>';
    host.innerHTML=html;
    host.querySelectorAll('select[data-usage-plan]').forEach(sel=>{
      sel.onchange=async()=>{
        const aid=sel.getAttribute('data-usage-plan'), slug=sel.value;
        if(!aid||!slug)return;
        if(!confirm('Move this workspace to the "'+slug+'" plan?')){renderAdminUsage(c);return;}
        const r=await api('/admin/accounts/'+encodeURIComponent(aid)+'/plan',{method:'PUT',body:JSON.stringify({plan_slug:slug})});
        if(r)showMsg('Workspace moved to the '+slug+' plan');
        else showMsg('Plan change failed: '+LAST_ERR,'error');
        renderAdminUsage(c);
      };
    });
    const tot=c.querySelector('#utot');if(tot)tot.textContent=rows.length+' workspaces';
  }).catch(fail);
}

// Generic single-setting editor (any key in admin_settings is editable here).
async function editSetting(key){
  const d=await api('/admin/settings/'+encodeURIComponent(key));
  if(!d){alert('Could not load setting '+key);return}
  const cur=typeof d.value==='string'?d.value:JSON.stringify(d.value,null,2);
  const next=prompt('Value for "'+key+'" (text or JSON):',cur);
  if(next===null)return;
  let value=next;
  try{value=JSON.parse(next)}catch(e){/* keep as plain text */}
  const r=await api('/admin/settings/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({value})});
  alert(r?'Saved '+key:'Save failed for '+key);
  if(r)renderPage();
}

   +'<p class="text-xs text-gray-500 mb-3">The last 50 transactional emails this installation tried to send, newest first. The one-line status above only remembers the MOST RECENT message &mdash; every later mail overwrites it &mdash; so this list is the history: a welcome or password mail the provider refused stays visible here after other mail succeeds. <em>Not sent</em> means the recipient was a reserved/test address, so nothing was attempted and no customer was affected.</p>'
   +'<div id="esends"><p class="text-gray-400 text-sm">Loading...</p></div></div>';

  // are read by POST /api/v1/internal/provision-free-account, the receiver FunnelSwift's tag
  // orchestrator calls; this card is where they are set.
  api('/admin/provisioning-settings').then(d=>{

    if(on)on.onchange=save;
    if(pl)pl.onchange=save;
  });

  api('/admin/settings').then(d=>{
    const el=c.querySelector('#sdata');
    if(!el)return;
    const items=(d&&d.items)||[];
    if(!items.length){el.innerHTML='<p class="text-gray-400 text-sm">No settings.</p>';return}

    el.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>editSetting(b.getAttribute('data-k')));

  // The send HISTORY (GET /admin/email-log, migration 091). Loaded beside the one-line status
  // because that status slot is overwritten by the next mail: an operator asking "did this
  // customer ever get their password?" can only be answered here. Defined at screen scope so the
  // "Send test email" press can refresh it too.
  const loadSends=async()=>{
    const el=c.querySelector('#esends');
    if(!el)return;
    const sd=await api('/admin/email-log');
    if(!sd||!sd.sends){el.innerHTML='<p class="text-red-500 text-sm">Could not load the send history.</p>';return}
    if(!sd.sends.length){el.innerHTML='<p class="text-gray-400 text-sm">No email has been attempted from this install yet.</p>';return}
    const esc2=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const tone=st=>st==='sent'?'background:#dcfce7;color:#166534':(st==='withheld'?'background:#fef3c7;color:#92400e':'background:#fee2e2;color:#991b1b');
    const label=st=>st==='sent'?'sent':(st==='withheld'?'not sent':'FAILED');
    el.innerHTML='<table class="w-full text-sm"><thead><tr class="text-xs text-gray-500 text-left"><th class="py-1">When</th><th>To</th><th>Email</th><th>Result</th></tr></thead><tbody>'
      +sd.sends.map(s=>'<tr class="border-t"><td class="py-1 whitespace-nowrap text-xs text-gray-500">'+esc2(s.at?new Date(s.at).toLocaleString():'')+'</td><td class="text-xs font-mono">'+esc2(s.to)+'</td><td class="text-xs">'+esc2(s.template||'')+'</td><td><span style="padding:1px 8px;border-radius:9999px;font-size:11px;'+tone(s.status)+'" title="'+esc2(s.detail||'')+'">'+label(s.status)+'</span></td></tr>').join('')

  api('/admin/settings/email').then(d=>{

    const v=(d&&d.value)||{};
    const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const st=c.querySelector('#estatus');
    // ONE renderer, called on load AND after the test press (2026-10-14). Three states, not two: a

    const renderStatus=(val)=>{

      }
    };
    window._wfEmailStatus=renderStatus;
    renderStatus(v);

    // At-rest posture of the SAVED credential, PRINTED and not asserted (rule: CoreSwift's panel,
    // kanban t_d1fcda7e). "Configured" and "encrypted at rest" are two different facts and the
    // operator sees both: the API answers `credential_present`/`sealed` from the STORED row.
    const epost=c.querySelector('#eposture');
    if(epost){
      if(!d||d.credential_present!==true){epost.innerHTML='';}
      else if(d.sealed===true){epost.innerHTML='<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:9999px;font-size:12px" data-email-provider="sealed">'+"\uD83D\uDD12 credential encrypted at rest"+'</span>';}
      else{epost.innerHTML='<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:9999px;font-size:12px" data-email-provider="sealed">'+"\u26A0 credential stored in the clear"+'</span> <span class="text-xs text-red-600">The saved key is readable in the database as it stands. Restart the app (or save the key again from this panel) and it is encrypted at rest.</span>';}
    }

    const f=(id,label,ph,val)=>'<div><label class="text-xs text-gray-500">'+label+'</label><input id="'+id+'" class="input" placeholder="'+(ph||'')+'" value="'+String(val==null?'':val).replace(/"/g,'&quot;')+'"></div>';
    form.innerHTML='<div><label class="text-xs text-gray-500">Provider</label><select id="e_provider" class="input">'
      +['smtp','mailgun','sendgrid','sendiio'].map(p=>'<option value="'+p+'"'+((v.provider||'smtp')===p?' selected':'')+'>'+p+'</option>').join('')
      +'</select></div>'
      +f('e_from_address','From address','billing@yourdomain.com',v.from_address)
      +f('e_from_name','From name','WorkflowSwift',v.from_name)
      +f('e_api_url','API URL (mailgun / sendgrid / sendiio)','https://api.mailgun.net/v3/<domain>/messages',v.api_url)
      +f('e_api_key','API key (leave the mask to keep the stored key)','',v.api_key)
      +f('e_smtp_host','SMTP host','smtp.mailgun.org',v.smtp_host)
      +f('e_smtp_port','SMTP port','587',v.smtp_port||587)

// The workspace's OWN owner, for the operator lists (kanban t_81a1ba13). GET /admin/accounts
// answers `owner_email` (the account's own user row; `email` carries the same value for the older
// spelling). A reserved-domain address can never be a customer, so it is badged as a probe - that is
// what keeps a leftover probe account from reading like a paying one. The badge carries its colours
// INLINE: this console's Tailwind build ships no yellow utility (measured: /tw.css holds no
// `yellow` rule at all), so a utility class here would render an unstyled word.
//
// kanban cron-1016: the badge's first cut tested only the reserved TLDs, so the fleet's OWN
// machine-minted probe addresses - which are not reserved domains - went unbadged. Measured live
// 2026-10-16 against this app's own `accounts` + `users` rows: THREE rows sat in the operator's list
// looking like customers - `Tenancy Canary A/B` and `Verify Fixture`, owners
// `probe-canary-a@swiftsoftware.dev` and `verify-fixture-...@swiftsoftware.dev`. Two arms now, the
// fleet shape: the reserved TLDs (and example.com/.net/.org), and the fleet's own probe domains
// (swiftsoftware.dev/.local, sw.dev, local.<app>, and maxxspace.com - the mail.tm probe inbox).
// `swiftsoftware.com` is deliberately NOT here: real, routable, the operator's own.
const RESERVED_ADDR_RE = /@(?:[^@]*\.)?(?:invalid|example|test|local)$|@(?:[^@]*\.)?example\.(?:com|net|org)$/i;
const FLEET_PROBE_ADDR_RE = /@(?:[^@]*\.)?(?:swiftsoftware\.(?:dev|local)|sw\.dev|maxxspace\.com)$|@local\.(?:funnelswift|coreswift|adaswift|incentiveswift|workflowswift|missedcallrespondr|multidirectory)$/i;
const isProbeAddress = (addr) => RESERVED_ADDR_RE.test(String(addr || '')) || FLEET_PROBE_ADDR_RE.test(String(addr || ''));
// The AUTHORITATIVE arm (kanban t_c13803ad): `accounts.probe_harness` is written at signup by the
// door that minted the workspace, so a non-empty value names a harness even when the owner address
// looks ordinary. Before this the list could only GUESS from the address, so a harness that signed
// up with an ordinary-looking address rendered as an ordinary customer. The address arms stay as a
// FALLBACK for accounts minted before the column existed — the column simply outranks them.
const probeHarnessOf = (a) => String((a && a.probe_harness) || '').trim();
function probeBadgeHtml(harness){
  const title = harness
    ? 'minted by the &quot;' + escHtml(harness) + '&quot; test harness &mdash; a probe, not a customer'
    : 'a reserved or fleet-probe address &mdash; a probe, not a customer';
  return ' <span class="badge" style="background:#fef3c7;color:#92400e" title="' + title + '">probe</span>';
}
function ownerCellHtml(a){
  const oe=String((a&&(a.owner_email||a.email))||'').trim();
  const harness=probeHarnessOf(a);
  if(!oe) return '<span class="text-gray-400">\u2014</span>'+(harness ? probeBadgeHtml(harness) : '');
  const probe=!!harness || isProbeAddress(oe);
  return escHtml(oe)+(probe ? probeBadgeHtml(harness) : '');
}

// ── Accounts: the platform-wide list + the bulk retire write (kanban t_265ce9f9) ──────────────
// The read is the same platform-gated list the Users (Tenants) panel already uses
// (GET /admin/accounts). Selection is a per-row checkbox plus a select-all header; the ONE write is
// POST /admin/accounts/bulk-delete, which answers PER ID — a row the backend refuses (the account
// you are signed in as, a portfolio company, this app's own workspace, or one whose `WFS <id>` n8n
// mirrors cannot be retired) keeps its reason on screen instead of vanishing behind a generic
// failure. The single-account DELETE (/admin/accounts/{id}) is the same operation for one row; this
// panel is the batch form of it, so the operator no longer needs a psql session to clear junk.
function renderAdminAccounts(c){
  c.innerHTML='<div class="card"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Accounts</h2>'+
    '<div class="flex items-center gap-2"><button class="btn btn-outline btn-sm" id="accProbes" data-tenants="select-probes" disabled>Select probes (0)</button>'+
    '<span class="text-xs text-gray-500" id="accMonitors" title="live tenancy-canary fixtures that a cron monitor seeds and checks — they stay in the list and are never mass-deleted"></span>'+
    '<button class="btn btn-danger btn-sm" id="accDel" disabled>Delete selected</button></div></div>'+
    '<p class="text-xs text-gray-400 mb-4">Every account on this platform. Tick rows and press <b>Delete selected</b> to remove them permanently, with all their data. Three are refused by rule and cannot be forced here: the account you are signed in as, a portfolio company (SwiftImpact / ZaarHub / Giraudy) and this app\'s own workspace — the reason is kept next to the row that was kept.</p>'+
    '<div id="accdata"><p class="text-gray-400 text-sm">Loading...</p></div></div>';
  const btn=c.querySelector('#accDel');
  // Refusals from the last write, rendered ONCE on the re-render that follows it.
  let reasons=[];
  // The row set the picker works from (cron 2026-10-18). One click ticks every probe row — the same
  // two arms the badge already uses (`probe_harness`, else a reserved/fleet-probe owner address) — so
  // a test-account sweep cannot under-count and no longer means ticking rows by eye. Rows the API
  // refuses are NOT filtered out: bulk-delete answers per id and the reason stays on the row.
  let LIST=[];
  const box=()=>Array.from(c.querySelectorAll('.acc-chk'));
  const sync=()=>{
    const picked=box().filter(b=>b.checked);
    btn.disabled=picked.length===0;
    btn.textContent=picked.length?('Delete selected ('+picked.length+')'):'Delete selected';
    const a=c.querySelector('#accAll');
    if(a)a.checked=box().length>0&&picked.length===box().length;
  };
  const load=()=>api('/admin/accounts').then(d=>{
    const items=(d&&d.accounts)||(d&&d.items)||[];
    LIST=items;
    const el=c.querySelector('#accdata');
    if(!items.length){el.innerHTML='<p class="text-gray-400 text-sm">No accounts yet.</p>';sync();return}
    el.innerHTML='<table class="table"><thead><tr><th style="width:32px"><input type="checkbox" id="accAll" title="Select all"></th><th>Name</th><th>Owner</th><th>Slug</th><th>Plan</th><th>Active</th><th>Created</th><th></th></tr></thead><tbody>'+
      items.map(i=>{
        // The API answers the tier nested as plan:{name,slug}; the flat spellings stay as fallback.
        const cur=(i.plan&&(i.plan.slug||i.plan.name))||i.plan_slug||i.plan_name||'';
        const aid=i.id||i.account_id||'';
        return '<tr data-acc="'+aid+'">'+
        '<td><input type="checkbox" class="acc-chk" value="'+aid+'"></td>'+
        '<td class="acc-name"><strong>'+(i.name||'-')+'</strong></td>'+
        '<td>'+ownerCellHtml(i)+'</td>'+
        '<td>'+(i.account_slug||i.slug||'-')+'</td>'+
        '<td>'+(cur||'-')+'</td>'+
        '<td><span class="badge '+(i.is_active?'bg-green-100 text-green-700':'bg-red-100 text-red-700')+'">'+(i.is_active?'Active':'Inactive')+'</span></td>'+
        '<td class="text-xs text-gray-400">'+((i.created_at||'').slice(0,10))+'</td>'+
        '<td class="text-right"><button class="btn btn-sm btn-ghost" onclick="event.preventDefault();startImpersonation(\''+aid+'\')">Impersonate</button></td>'+
      '</tr>'}).join('')+'</tbody></table>';
    const a=el.querySelector('#accAll');
    if(a)a.addEventListener('change',()=>{box().forEach(b=>{b.checked=a.checked});sync()});
    box().forEach(b=>b.addEventListener('change',sync));
    // The reason a row was KEPT — written into that row's name cell, so it is not a generic toast.
    reasons.forEach(f=>{
      const note=document.createElement('div');
      note.className='text-xs text-red-600';
      note.textContent=f.error;
      const row=el.querySelector('tr[data-acc="'+f.id+'"]');
      const cell=row&&row.querySelector('td.acc-name');
      if(cell)cell.appendChild(note);
      else el.appendChild(note);
    });
    reasons=[];
    // The picker: count the probe rows the list actually holds, then tick exactly them.
    const pb=c.querySelector('#accProbes');
    if(pb){
      // Live MONITORS are not cleanup candidates (cron 2026-10-19): the tenancy-canary fixtures
      // (`Tenancy Canary A/B`, `probe-canary-*@swiftsoftware.dev`) match the same probe predicate,
      // and a cron re-seeds them in every app — so ticking them for deletion just churns live
      // monitoring. They keep the [probe] badge and stay in the table; only the counter changes.
      const isMonitor=(i)=>/^tenancy canary/i.test(String((i&&i.name)||''))||
        /^probe-canary/i.test(String((i&&(i.owner_email||i.email))||''));
      const isProbe=(i)=>!isMonitor(i)&&(!!probeHarnessOf(i)||isProbeAddress(String((i&&(i.owner_email||i.email))||'')));
      const probes=LIST.filter(isProbe);
      const monitors=LIST.filter(isMonitor).length;
      const mnote=c.querySelector('#accMonitors');
      if(mnote)mnote.textContent=monitors?(monitors+' live monitor(s) excluded'):'';
      pb.textContent='Select probes ('+probes.length+')';
      pb.disabled=probes.length===0;
      pb.onclick=()=>{
        const want=new Set(probes.map(i=>i.id||i.account_id));
        box().forEach(b=>{b.checked=want.has(b.value)});
        sync();
      };
    }
    sync();
  });
  btn.onclick=async()=>{
    const ids=box().filter(b=>b.checked).map(b=>b.value).filter(Boolean);
    if(!ids.length)return;
    if(!confirm('Delete '+ids.length+' account(s)? This permanently removes the account and all of its data. This cannot be undone.'))return;
    btn.disabled=true;
    const r=await api('/admin/accounts/bulk-delete',{method:'POST',body:JSON.stringify({ids})});
    if(!r){showMsg('Delete failed: '+LAST_ERR,'error');load();return}
    const failed=(r&&r.failed)||[];
    reasons=failed;
    const n=(r&&typeof r.deleted==='number')?r.deleted:0;
    showMsg(n+' account(s) deleted'+(failed.length?(' — '+failed.length+' refused or not found'):''),failed.length?'error':'success');
    load();
  };
  load();
}

// --- Integration destination values (GET /integration-destinations) ---------------------------
// The provider / action / destination-type lists come from the destination CATALOGUE route
// GET /integration-destinations: its 3-level cascade (no params -> providers, ?provider= ->
// actions, ?provider=&action= -> destination types) is exactly the shape this panel needs.
// Before kanban t_92388cf3 all three lists were hardcoded here (3 providers, 3-3-2 types), so the
// panel could not reach catalogue tuples /values DOES serve — e.g. coreswift / add_note / category.
// The value lookup itself is unchanged: GET /integration-destinations/values?provider=&
// destination_type= answers 400 unless BOTH params are present, so Load stays disabled until a
// destination type is picked.
function renderDestinationValues(c){
  c.innerHTML='<div class="card"><h2 class="text-xl font-bold mb-1">Integration Destination Values</h2>'
   +'<p class="text-xs text-gray-400 mb-4">The values a step can target for a provider + destination type (GET /integration-destinations/values). Provider, action and destination type are read from the destination catalogue (GET /integration-destinations); the <b>source</b> line says whether the values are live from the provider API or the built-in fallback.</p>'
   +'<div class="flex gap-3 items-end mb-4">'
   +'<div><label class="text-xs text-gray-500">Provider</label><select id="dvprov" class="input"><option value="">Loading&hellip;</option></select></div>'
   +'<div><label class="text-xs text-gray-500">Action</label><select id="dvact" class="input"><option value="">&mdash;</option></select></div>'
   +'<div><label class="text-xs text-gray-500">Destination type</label><select id="dvtype" class="input"><option value="">&mdash;</option></select></div>'
   +'<button class="btn btn-primary btn-sm" id="dvload" disabled>Load values</button></div>'
   +'<div id="dvdata"><p class="text-gray-400 text-sm">Pick a provider and load.</p></div></div>';
  const psel=c.querySelector('#dvprov'),asel=c.querySelector('#dvact'),tsel=c.querySelector('#dvtype');
  const dbox=c.querySelector('#dvdata'),lbtn=c.querySelector('#dvload');
  const fill=(sel,rows,ph)=>{ sel.innerHTML=(rows.length?'':'<option value="">'+escHtml(ph)+'</option>')
    +rows.map(r=>'<option value="'+escHtml(r.v)+'">'+escHtml(r.l)+'</option>').join(''); };
  const fail=(what)=>{ dbox.innerHTML='<p class="text-red-500 text-sm">'+escHtml(what)+' failed: '+escHtml(LAST_ERR||'request failed')+'</p>'; lbtn.disabled=true; };
  const loadTypes=async()=>{
    fill(tsel,[],'pick an action'); lbtn.disabled=true;
    if(!psel.value||!asel.value)return;
    const d=await api('/integration-destinations?provider='+encodeURIComponent(psel.value)+'&action='+encodeURIComponent(asel.value));
    if(!d)return fail('Destination catalogue');
    const rows=((d&&d.destinations)||[]).map(x=>({v:x.type,l:x.label||x.type}));
    fill(tsel,rows,'this action targets nothing');
    lbtn.disabled=!rows.length;
    if(!rows.length)dbox.innerHTML='<p class="text-gray-400 text-sm">No destination types for '+escHtml(psel.value)+' / '+escHtml(asel.value)+'.</p>';
  };
  const loadActions=async()=>{
    fill(asel,[],'no actions'); fill(tsel,[],'pick an action'); lbtn.disabled=true;
    if(!psel.value)return;
    const d=await api('/integration-destinations?provider='+encodeURIComponent(psel.value));
    if(!d)return fail('Destination catalogue');
    const rows=((d&&d.actions)||[]).map(x=>({v:x.key,l:x.label||x.key}));
    fill(asel,rows,'no actions');
    if(!rows.length){ dbox.innerHTML='<p class="text-gray-400 text-sm">This provider has no destination catalogue rows.</p>'; return; }
    dbox.innerHTML='<p class="text-gray-400 text-sm">Pick a destination type and load.</p>';
    await loadTypes();
  };
  psel.onchange=loadActions; asel.onchange=loadTypes;
  (async()=>{
    const d=await api('/integration-destinations');
    if(!d)return fail('Destination catalogue');
    const provs=((d&&d.providers)||[]).map(x=>({v:x.key,l:x.name||x.key}));
    fill(psel,provs,'no providers');
    if(!psel.value){lbtn.disabled=true;return}
    // Land on a provider that actually HAS catalogue rows: the providers are listed by name, and
    // the platform's own list is mostly email/AI/API providers with no destinations at all. The
    // scan stops at the first hit (coreswift), so it is two requests, not twenty.
    for(const key of provs.map(x=>x.v)){
      psel.value=key; await loadActions();
      if(asel.value)break;
    }
  })();
  lbtn.onclick=async()=>{
    if(!psel.value||!tsel.value)return;
    dbox.innerHTML='<p class="text-gray-400 text-sm">Loading...</p>';
    const d=await api('/integration-destinations/values?provider='+encodeURIComponent(psel.value)+'&destination_type='+encodeURIComponent(tsel.value));
    if(!d){dbox.innerHTML='<p class="text-red-500 text-sm">Request failed: '+escHtml(LAST_ERR)+'</p>';return}
    const vals=(d&&d.values)||[];
    dbox.innerHTML='<p class="text-xs text-gray-400 mb-2">source: '+escHtml(String(d.source||'-'))+' ('+vals.length+' value'+(vals.length===1?'':'s')+')</p>'
     +(vals.length?'<table class="table"><thead><tr><th>Value id</th><th>Label</th></tr></thead><tbody>'
       +vals.map(v=>'<tr><td>'+escHtml(String(v.id==null?'-':v.id))+'</td><td>'+escHtml(String(v.label==null?'-':v.label))+'</td></tr>').join('')+'</tbody></table>'
      :'<p class="text-gray-400 text-sm">No values.</p>');
  };
}

// Init
// This script sits in <head>, so it runs BEFORE the parser has created <body> and
// document.body is still null — renderApp()/renderLogin() both start with
// document.body.innerHTML='' and threw "Cannot set properties of null", leaving
// admin.workflowswift.com a blank page for every account. Wait for the DOM instead.
function boot(){
  // Nothing to adopt without the operator's own session: drop any parked tenant session too, so a
  // stale support token cannot sit in storage waiting for someone else's sign-in.
  if(!TOKEN){clearImpersonation();renderLogin();return}
  // Read WHO WE ARE first — the operator's own session — and only then adopt a parked support
  // session, so the tenant half can never render in front of a dead operator session. A reload (or
  // any navigation) mid-support therefore comes back as the tenant WITH its banner and its Stop
  // control, instead of silently dropping the session and becoming the operator with no notice.
  loadMe().then(()=>{
    if(!TOKEN)return;   // the read was refused: api() already ended the session and drew the sign-in
    const hadParked=!!sessionStorage.getItem(IMP_REC_KEY);
    if(adoptImpersonation())showMsg('Resumed the support session as '+(IMPERSONATION.user_name||IMPERSONATION.tenant_id));
    else if(hadParked)showMsg('The support session has ended','error');
    renderApp();
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

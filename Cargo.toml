[package]
name = "workflowswift-api"
version = "0.1.0"
edition = "2021"
description = "WorkflowSwift -- Multi-tenant Workflow Automation Platform"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport"] }
axum = "0.8"
tokio = { version = "1", features = ["full", "signal"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
redis = { version = "0.25", features = ["tokio-comp"] }
governor = "0.6"
hyper = "1"
url = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
# Tests only: `ServiceExt::oneshot` drives a real Router through the middleware stack. The
# production graph does not enable tower's `util` feature, and tests must not widen it.
tower = { version = "0.4", features = ["util"] }
# Tests only: a request body that never arrives is built from a `futures_core::Stream` via
# `Body::from_stream`, which is how the body-read deadline is proven to fire. futures-core is
# already in the production graph (axum-core depends on it), so this makes the trait nameable in
# tests without adding a package.
futures-core = "0.3"

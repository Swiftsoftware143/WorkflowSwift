name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pin to 1.97.1 to match the production box rustc (see rust-toolchain.toml).
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release

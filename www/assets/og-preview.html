<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WorkflowSwift OG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Nimbus Sans','DejaVu Sans',sans-serif;width:1200px;height:630px;overflow:hidden}
.bg{width:1200px;height:630px;background:linear-gradient(135deg,#0a0c10 0%,#0f1520 50%,#0a0c10 100%);position:relative;overflow:hidden}
.accent-bar{position:absolute;left:0;top:0;width:6px;height:100%;background:linear-gradient(180deg,#3b82f6 0%,#06b6d4 100%)}
.glow1{position:absolute;top:-80px;right:40px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.06) 0%,transparent 70%)}
.glow2{position:absolute;bottom:-40px;right:200px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.04) 0%,transparent 70%)}
.content{position:absolute;left:80px;top:64px;z-index:1}
.badge{display:inline-flex;align-items:center;padding:8px 20px;border:1.5px solid #3b82f6;border-radius:100px;background:rgba(59,130,246,0.12);margin-bottom:20px}
.badge-text{font-size:14px;font-weight:700;color:#3b82f6;letter-spacing:0.04em}
.headline{font-size:52px;font-weight:900;line-height:1.2;color:#ffffff;margin-bottom:6px}
.headline-accent{font-size:52px;font-weight:900;color:#3b82f6;margin-bottom:24px}
.subtitle{font-size:21px;color:#9ca3af;line-height:1.5;margin-bottom:32px}
.subtitle2{font-size:21px;color:#9ca3af;margin-bottom:4px}
.pills{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.pill{border:1.5px solid rgba(59,130,246,0.4);border-radius:100px;padding:8px 20px;background:rgba(59,130,246,0.08);font-size:13px;font-weight:700;color:#3b82f6}
.pill-neutral{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#9ca3af;font-size:13px;font-weight:600;border-radius:100px;padding:8px 20px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-width:230px;width:auto;padding:0 32px;height:56px;border-radius:12px;background:linear-gradient(135deg,#3b82f6 0%,#06b6d4 100%);font-size:22px;font-weight:800;color:#ffffff}
.visual{position:absolute;right:70px;top:100px;opacity:0.5}
/* Flow nodes */
.flow-node{width:140px;height:52px;border-radius:12px;border:2px solid rgba(59,130,246,0.15);background:rgba(59,130,246,0.05);margin-bottom:12px;display:flex;align-items:center;padding:0 16px;gap:10px}
.flow-dot{width:12px;height:12px;border-radius:50%}
.flow-dot-blue{background:rgba(59,130,246,0.4)}
.flow-dot-cyan{background:rgba(6,182,212,0.35)}
.flow-dot-purple{background:rgba(139,92,246,0.25)}
.flow-bar{width:80px;height:6px;border-radius:3px;background:rgba(59,130,246,0.15)}
.flow-line{width:2px;height:12px;margin-left:69px;background:rgba(59,130,246,0.2);margin-bottom:4px;margin-top:4px}
.dot{position:absolute;border-radius:50%;background:rgba(59,130,246,0.12)}
.d1{top:40px;right:380px;width:8px;height:8px}
.d2{top:180px;right:130px;width:6px;height:6px}
.d3{top:360px;right:400px;width:8px;height:8px}
.d4{top:490px;right:120px;width:6px;height:6px}
.branding{position:absolute;left:80px;bottom:54px;display:flex;align-items:center;gap:10px}
.brand-name{font-size:16px;font-weight:800;color:#ffffff}
.brand-accent{font-size:16px;font-weight:800;color:#3b82f6}
.brand-domain{font-size:13px;color:#6b7280}
.outer-border{position:absolute;inset:0;border:1px solid rgba(255,255,255,0.06)}
</style>
</head>
<body>
<div class="bg">
  <div class="accent-bar"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="content">
    <div class="badge"><span class="badge-text">⚡ AUTOMATE &amp; VISUALIZE</span></div>
    <div class="headline">Build Workflows That</div>
    <div class="headline-accent">Actually Work.</div>
    <div class="subtitle">No-code automation meets dynamic data dashboards.</div>
    <div class="subtitle2">300+ integrations, AI-powered steps, 16 industry templates.</div>

    <div class="pills" style="margin-top:28px">
      <span class="pill">Zapier Alternative</span>
      <span class="pill">n8n Alternative</span>
      <span class="pill-neutral">Make.com</span>
      <span class="pill-neutral">Power Automate</span>
    </div>

    <div class="cta">Start Free  &rarr;</div>
  </div>

  <!-- Workflow visual - nodes connected -->
  <div class="visual">
    <div class="flow-node">
      <div class="flow-dot flow-dot-blue"></div>
      <div class="flow-bar"></div>
    </div>
    <div class="flow-line"></div>
    <div class="flow-node">
      <div class="flow-dot flow-dot-cyan"></div>
      <div class="flow-bar" style="width:100px"></div>
    </div>
    <div class="flow-line"></div>
    <div class="flow-node" style="border-color:rgba(139,92,246,0.2)">
      <div class="flow-dot flow-dot-purple"></div>
      <div class="flow-bar" style="width:60px"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <div style="width:68px;height:68px;border-radius:14px;border:2px solid rgba(59,130,246,0.15);background:rgba(59,130,246,0.04);display:flex;align-items:center;justify-content:center;font-size:24px">📊</div>
      <div style="width:68px;height:68px;border-radius:14px;border:2px solid rgba(6,182,212,0.12);background:rgba(6,182,212,0.03);display:flex;align-items:center;justify-content:center;font-size:24px">🤖</div>
      <div style="width:68px;height:68px;border-radius:14px;border:2px solid rgba(139,92,246,0.1);background:rgba(139,92,246,0.03);display:flex;align-items:center;justify-content:center;font-size:24px">📈</div>
    </div>
  </div>

  <!-- Dots -->
  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="dot d3"></div>
  <div class="dot d4"></div>

  <div class="branding">
    <span class="brand-name">Workflow</span><span class="brand-accent">Swift</span>
    <span class="brand-domain">workflowswift.com</span>
  </div>

  <div class="outer-border"></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in — WorkflowSwift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#1e1b4b,#312e81);display:flex;justify-content:center;align-items:center;min-height:100vh}
.c{background:#fff;border-radius:12px;padding:40px;width:380px;max-width:95vw;box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center}
.c h1{font-size:22px;color:#1e1b4b;margin-bottom:4px}
.c p.sub{font-size:13px;color:#64748b;margin-bottom:20px}
.tabs{display:flex;margin-bottom:20px;border-bottom:1px solid #e2e8f0}
.tab{flex:1;padding:10px;cursor:pointer;font-size:14px;font-weight:600;color:#94a3b8;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#6366f1;border-bottom-color:#6366f1}
.pane{display:none}.pane.on{display:block}
.c input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:12px;display:block;outline:none}
.c input:focus{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.c button{width:100%;padding:12px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.c button:hover{background:#4f46e5}
.c button:disabled{opacity:.5}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-top:12px;display:none}
.msg.e{background:#fee2e2;color:#991b1b;display:block}
.msg.i{color:#6366f1;display:block}
.msg.ok{background:#dcfce7;color:#166534;display:block;text-align:left;line-height:1.5}
.note{font-size:12px;color:#94a3b8;text-align:left;margin-bottom:12px;line-height:1.5}
.lk{margin-top:16px;font-size:12px;border-top:1px solid #f1f5f9;padding-top:14px}
.lk a{color:#6366f1}
.fp{margin-top:2px;font-size:12px}
.fp a{color:#6366f1}
</style>
</head>
<body>
<div class="c">
<h1>WorkflowSwift</h1>
<p class="sub">Automate Everything. Visualize Everything.</p>

<div class="tabs">
  <div class="tab on" id="tabLogin">Sign in</div>
  <div class="tab" id="tabRegister">Create account</div>
</div>

<div class="pane on" id="paneLogin">
  <input id="e" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
  <button id="b" onclick="L()">Sign In</button>
  <div class="fp"><a href="/forgot-password.html">Forgot password?</a></div>
  <div id="m" class="msg"></div>
</div>

<div class="pane" id="paneRegister">
  <input id="rn" name="name" type="text" maxlength="243" placeholder="Full name" autocomplete="name" aria-label="Full name">
  <input id="re" name="email" type="email" placeholder="you@company.com" autocomplete="email" aria-label="Email">
  <p class="note">No password to choose &mdash; we'll email your login details so you can confirm your address by signing in.</p>
  <!-- The tier the visitor clicked on /pricing (cron 2026-10-21). Hidden unless ?plan= names one. -->
  <div id="rplan" class="note" style="display:none;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:8px;padding:9px 11px;text-align:left"></div>
  <button id="rb" onclick="R()">Create Free Account</button>
  <div id="rm" class="msg"></div>
</div>

<div class="lk"><a href="https://admin.workflowswift.com/">Admin Portal</a> &middot; <a href="https://workflowswift.com/privacy">Privacy</a> &middot; <a href="https://workflowswift.com/terms">Terms</a></div>
</div>
<script>
var TAB_L=document.getElementById('tabLogin'),TAB_R=document.getElementById('tabRegister');
var PANE_L=document.getElementById('paneLogin'),PANE_R=document.getElementById('paneRegister');
function swap(isLogin){
  TAB_L.classList.toggle('on',isLogin);TAB_R.classList.toggle('on',!isLogin);
  PANE_L.classList.toggle('on',isLogin);PANE_R.classList.toggle('on',!isLogin);
  document.title=(isLogin?'Sign in':'Create account')+' — WorkflowSwift';
}
TAB_L.onclick=function(){swap(true)};
TAB_R.onclick=function(){swap(false)};
// The marketing site's Sign-up links 301 here with ?register=1, so open that tab directly.
try{ if(new URLSearchParams(window.location.search).get('register')) swap(false); }catch(e){}

/* ---- The PLAN a visitor chose on /pricing (cron 2026-10-21) ------------------------------------
   The pricing page's CTAs link to `app.workflowswift.com/register?plan=starter|professional|
   enterprise`; nginx now carries that slug here. Signup still mints a FREE workspace (the public
   door refuses to grant a priced tier — a slug is honoured only when the tier costs nothing), but
   the choice is shown back to the visitor and, once the account exists, filed as the SAME plan
   request the dashboard's Plan & Billing screen files (`POST /api/v1/tickets` with `plan_slug` and
   `source: 'plan_request'`, validated server-side against the active catalogue). Before this a
   person who clicked "Choose Professional" and signed up left no trace anywhere.
   Prices are the catalogue's own (`plan_tiers`: starter 29, professional 79, enterprise 199). */
var PLAN_CATALOGUE={starter:{name:'Starter',price:29},professional:{name:'Professional',price:79},enterprise:{name:'Enterprise',price:199}};
function chosenPlan(){try{var s=(new URLSearchParams(window.location.search).get('plan')||'').trim().toLowerCase();var h=PLAN_CATALOGUE[s];return h?{slug:s,name:h.name,price:h.price}:null}catch(e){return null}}
function paintChosenPlan(){var el=document.getElementById('rplan');if(!el)return;var p=chosenPlan();if(!p){el.style.display='none';return}
  el.innerHTML='<strong>You picked the '+p.name+' plan &mdash; $'+p.price+'/month.</strong> Create your free workspace below and we will pass your request to the team, who switch a workspace onto a paid plan by hand.';
  el.style.display='block'}
paintChosenPlan();
function filePlanRequest(token,plan){if(!plan||!token)return Promise.resolve(false);
  return fetch('/api/v1/tickets',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({subject:'Plan request: '+plan.name+' plan',
      description:'Chose the '+plan.name+' plan ($'+plan.price+'/month) on the pricing page and then created a workspace. Self-serve checkout is not open yet, so the switch has to be made by the team.',
      priority:'normal',source:'plan_request',plan_slug:plan.slug})})
    .then(function(r){return r.ok}).catch(function(){return false})}

/* ---- Sign in (unchanged behaviour: token stored out of band, then /app) ---- */
function L(){
var e=document.getElementById("e").value.trim(),p=document.getElementById("p").value,m=document.getElementById("m"),b=document.getElementById("b");
if(!e||!p){m.className="msg e";m.textContent="Enter email and password";return}
m.className="msg i";m.textContent="Signing in...";b.disabled=true;
fetch("/api/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})})
.then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error((typeof x.error==="string"&&x.error)||(typeof x.message==="string"&&x.message)||"Invalid credentials");return x})})
.then(function(d){var t=d.token||d.access_token;
if(!t){m.className="msg e";m.textContent="Login response carried no session token";b.disabled=false;return}
try{localStorage.setItem("ws_fs_token",t);sessionStorage.setItem("wf_token",t)}catch(ex){}
/* The session is handed over OUT OF BAND: /login and /app are the same origin, so the storages
   above are already visible to the SPA, and the bearer token is never put in the URL. */
window.location.replace("/app")})
.catch(function(err){m.className="msg e";m.textContent=err.message;b.disabled=false});
}

/* ---- Create account: NAME + EMAIL only. The server mints the password and emails it, so there
   is NO auto-login here - the user confirms their address by signing in with the password sent. */
function R(){
var n=document.getElementById("rn").value.trim(),e=document.getElementById("re").value.trim(),m=document.getElementById("rm"),b=document.getElementById("rb");
if(!n){m.className="msg e";m.textContent="Enter your full name";return}
if(!e){m.className="msg e";m.textContent="Enter your email address";return}
b.disabled=true;b.textContent="Creating account...";
fetch("/api/v1/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify((function(){var w=chosenPlan();return w?{name:n,email:e,plan_slug:w.slug}:{name:n,email:e}})())})
.then(function(r){return r.json().then(function(d){return{r:r,d:d}})})
.then(function(x){
  if(!x.r.ok){m.className="msg e";m.textContent=(x.d&&((typeof x.d.error==='string'&&x.d.error)||x.d.message))||"Registration failed. Please try again.";b.disabled=false;b.textContent="Create Free Account";return}
  // The send can FAIL server-side (SMTP outage, provider refusal) while the account is still
  // created, and this app's signup mints the password ON THE SERVER — so a failed mail leaves an
  // account nobody can sign into. The server answers `credentials_emailed`; telling a new customer
  // to "check your email" when nothing was delivered sends them to an inbox that stays empty. Say
  // what happened and hand them the door that actually works (parity with the other five apps).
  var mailed = !(x.d && x.d.credentials_emailed === false);
  m.className="msg ok";
  m.innerHTML=(mailed
    ? "<strong>Account created!</strong><br>Check your email &mdash; we sent your login details to "+e.replace(/[<>&]/g,"")+"."
    : "<strong>Your account is created &mdash; but the email with your login details could NOT be sent.</strong><br>Nothing reached "+e.replace(/[<>&]/g,"")+". Choose your password below and you can sign in straight away.")
   +" You can change your password any time in your profile settings."
   +'<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);font-size:13px">'
   +(mailed
      ? 'Nothing in your inbox after a minute? Check your spam folder, then '
        +'<a href="/forgot-password.html?email='+encodeURIComponent(e)+'" style="font-weight:600">send yourself a reset code</a>.'
      : 'A reset code would be emailed by the same mailer that just failed, so it would not arrive either. The field below is the door that works &mdash; your account already exists.')
   +'</div>';
  b.textContent=mailed?"Check your email":"Account created";
  // The field the message promises. Rendered here, wired to the token `register` returned.
  if(!mailed)showInitialPassword(x.d);
  // The tier they clicked on /pricing, filed against the token the signup just returned
  // (cron 2026-10-21). Best-effort: it must never cost the visitor their account.
  // The register answer names the session `access_token` (the fleet's RegisterResponse); `token` is
  // accepted too so this keeps working if the shape ever matches the other apps'.
  // The pick already rode the register call (cron 2026-10-23), so the server filed it with the
// account. This follow-up stays as the fallback for a page cached before that change; the
// handler keeps ONE open request per tier, so the two paths can never write two rows.
/* ---- The failed-mail signup door (kanban class 2026-10-27) -------------------------------------
   `register` mints the first password on the server and emails it. When that send fails the
   account exists and NOBODY can sign into it: this pane collects name + email only, and the
   /forgot-password.html link mails a reset code through the SAME mailer that just failed. Every
   door the page used to offer failed for the reason that produced the message.

   The only path that survives a broken mailer is to choose the password HERE, on the session the
   signup just returned: POST /api/v1/auth/initial-password accepts that token and nothing else (a
   sign-in token, an impersonation token and an API key all carry `pwd_minted: false`), it is
   accepted only while `users.password_undelivered` is still set — so the offer works exactly once —
   and saving it also tells the customer to sign in with the address they just used.

   The field is its OWN element after #rm, never inside it: the plan-request follow-up below does
   `m.innerHTML += …`, which would throw away an input rendered in there (and its click handler)
   while the customer is still typing. DOM nodes are built with textContent, so the address never
   becomes markup. */
function showInitialPassword(reg){
  var tok=reg&&(reg.access_token||reg.token);
  var old=document.getElementById('initPwBox');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  if(!tok)return;
  var rm=document.getElementById('rm');
  if(!rm||!rm.parentNode)return;
  var box=document.createElement('div');
  box.id='initPwBox';
  box.style.cssText='margin-top:12px;text-align:left';
  var lab=document.createElement('label');
  lab.setAttribute('for','initPw');
  lab.style.cssText='display:block;font-size:13px;font-weight:600;margin-bottom:6px';
  lab.textContent='Choose your password (at least 8 characters)';
  var inp=document.createElement('input');
  inp.id='initPw';inp.type='password';inp.autocomplete='new-password';
  inp.setAttribute('aria-label','Choose your password');
  var btn=document.createElement('button');
  btn.type='button';btn.id='initPwBtn';btn.textContent='Save my password';
  var msg=document.createElement('div');
  msg.id='initPwMsg';msg.className='msg';
  box.appendChild(lab);box.appendChild(inp);box.appendChild(btn);box.appendChild(msg);
  rm.parentNode.insertBefore(box,rm.nextSibling);
  btn.addEventListener('click',function(){
    var pw=inp.value;
    if(pw.length<8){msg.className='msg e';msg.textContent='Use at least 8 characters.';return}
    btn.disabled=true;btn.textContent='Saving...';
    fetch('/api/v1/auth/initial-password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({password:pw})})
    .then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{r:r,d:d}})})
    .then(function(res){
      if(res.r.ok){
        msg.className='msg ok';
        msg.innerHTML='Password saved. <a href="/login" style="font-weight:700;text-decoration:underline">Sign in with the address you just used</a>.';
        btn.textContent='Saved';inp.disabled=true;
        return;
      }
      msg.className='msg e';
      msg.textContent=(res.d&&(res.d.message||res.d.error))||'That did not save. Please try again.';
      btn.disabled=false;btn.textContent='Save my password';
    })
    .catch(function(){msg.className='msg e';msg.textContent='Network error. Please try again.';btn.disabled=false;btn.textContent='Save my password'});
  });
}

var want=chosenPlan();
  var sessTok=x.d&&(x.d.access_token||x.d.token);
  if(want){filePlanRequest(sessTok,want).then(function(ok){
    m.innerHTML+='<div style="margin-top:8px">'+(ok
      ?'Your <strong>'+want.name+'</strong> plan request is with us &mdash; the team switches a workspace onto a paid plan by hand. You can follow it under Plan &amp; Billing in the dashboard.'
      :'To move onto the <strong>'+want.name+'</strong> plan, use the <strong>Plan &amp; Billing</strong> screen in the dashboard &mdash; one press files the same request.')+'</div>';
  });}
})
.catch(function(err){m.className="msg e";m.textContent="Network error. Please try again.";b.disabled=false;b.textContent="Create Free Account"});
}
</script>
</body>
</html>

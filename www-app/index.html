<script>
!function(){
  var p = window.location.pathname;
  if (p === '/login' || p === '/login.html' || p.startsWith('/api/') || p.startsWith('/ref/')) return;
  var t = localStorage.getItem('ws_fs_token') || localStorage.getItem('token') || localStorage.getItem('access_token') || sessionStorage.getItem('wf_token');
  if (!t) window.location.replace('/login');
}();
</script>

<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.26.4';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);
const root = document.getElementById('app');

const API = (() => {
  const base = '/api/v1';
  let token = sessionStorage.getItem('wf_token');
  let user = JSON.parse(sessionStorage.getItem('wf_user') || 'null');
  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => {
    const ct = r.headers.get('content-type') || '';
    const d = ct.includes('json') ? await r.json() : await r.text();
    if (!r.ok) {
      // Prefer a STRING error/message. The API returns {"code":402,"error":true,"message":"..."}
      // for plan-gate refusals, so a truthy d.error would otherwise surface as the literal "true".
      const body = typeof d === 'string' ? d : (d || {});
      const msg = (typeof body.error === 'string' && body.error)
        || (typeof body.message === 'string' && body.message)
        || (typeof d === 'string' ? d : '')
        || ('Request failed (HTTP ' + r.status + ')');
      const err = new Error(msg);
      err.status = r.status;
      throw err;
    }
    return d;
  };
  return {
    register: (name, email, password) => fetch(base + '/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, email, password}) }).then(handle),
    login: (email, password) => fetch(base + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) }).then(handle),
    get: (p) => fetch(base + p, { headers: headers() }).then(handle),
    post: (p, b) => fetch(base + p, { method:'POST', headers: headers(), body: b === undefined ? undefined : JSON.stringify(b) }).then(handle),
    put: (p, b) => fetch(base + p, { method:'PUT', headers: headers(), body: JSON.stringify(b) }).then(handle),
    del: (p) => fetch(base + p, { method:'DELETE', headers: headers() }).then(handle),
    getIndustries: () => fetch(base + '/industries', { headers: headers() }).then(handle),
    getAccountIndustry: () => fetch(base + '/accounts/industry', { headers: headers() }).then(handle),
    putAccountIndustry: (slug, primary) => fetch(base + '/accounts/industry', { method:'PUT', headers: headers(), body: JSON.stringify({ industry_slug: slug, set_as_primary: !!primary }) }).then(handle),
    getDashboardWidgets: (slug) => fetch(base + '/dashboard/widgets' + (slug ? ('?industry=' + encodeURIComponent(slug)) : ''), { headers: headers() }).then(handle),
    getDashboardTabs: (slug) => fetch(base + '/dashboard/tabs' + (slug ? ('?industry=' + encodeURIComponent(slug)) : ''), { headers: headers() }).then(handle),
    // The per-metric SPA helper that called that route was removed with it (kanban t_0fffb921): it
    // was defined here and never called, and the per-widget data the dashboard needs already arrives
    // in getDashboardWidgets (each widget carries its own `data`).
    pushDashboardData: (industry_slug, metric_key, value) => fetch(base + '/dashboard/push-widget-data', { method:'POST', headers: headers(), body: JSON.stringify({ industry_slug, metric_key, value }) }).then(handle),
    listApiKeys: () => fetch(base + '/api-keys', { headers: headers() }).then(handle),
    createApiKey: (name) => fetch(base + '/api-keys', { method:'POST', headers: headers(), body: JSON.stringify({ name }) }).then(handle),
    revokeApiKey: (id) => fetch(base + '/api-keys/' + encodeURIComponent(id), { method:'DELETE', headers: headers() }).then(handle),
    // --- Provider keys (the platform's third-party credentials, per account). The API
    // masks on read (`api_key` comes back as `sk-...xyz`) and encrypts at rest; the value
    // is only ever sent on write. NOTE: the routes are `/provider-keys` and
    // `/provider-keys/{provider}` (DELETE by provider, not by id).
    listProviderKeys: () => fetch(base + '/provider-keys', { headers: headers() }).then(handle),
    saveProviderKey: (provider, api_key) => fetch(base + '/provider-keys', { method:'POST', headers: headers(), body: JSON.stringify({ provider, api_key }) }).then(handle),
    deleteProviderKey: (provider) => fetch(base + '/provider-keys/' + encodeURIComponent(provider), { method:'DELETE', headers: headers() }).then(handle),
    // --- Team management (see TeamView). NOTE: /users and /users/team are registered WITHOUT a
    // trailing slash — a request to /api/v1/users/ answers 404 while /api/v1/users answers 200.
    listUsers: () => fetch(base + '/users', { headers: headers() }).then(handle),
    inviteUser: (b) => fetch(base + '/users/invite', { method:'POST', headers: headers(), body: JSON.stringify(b) }).then(handle),
    setUserPermissions: (id, permissions) => fetch(base + '/users/' + encodeURIComponent(id) + '/permissions', { method:'PUT', headers: headers(), body: JSON.stringify({ permissions }) }).then(handle),
    setUserRole: (id, role) => fetch(base + '/users/' + encodeURIComponent(id) + '/role', { method:'PUT', headers: headers(), body: JSON.stringify({ role }) }).then(handle),
    removeUser: (id) => fetch(base + '/users/' + encodeURIComponent(id), { method:'DELETE', headers: headers() }).then(handle),
    // --- Panel wiring: endpoints that were served but reachable from no shipped surface ---
    getTimeline: () => fetch(base + '/dashboard/timeline', { headers: headers() }).then(handle),
    getPlanCapabilities: () => fetch(base + '/plans/capabilities', { headers: headers() }).then(handle),
    rolloverCredits: () => fetch(base + '/credits/rollover', { method:'POST', headers: headers(), body: JSON.stringify({}) }).then(handle),
    removeAccountIndustry: (slug) => fetch(base + '/accounts/industry/' + encodeURIComponent(slug), { method:'DELETE', headers: headers() }).then(handle),
    // --- Prospecting surface: enrich (paid/mocked server-side) + the Hexomatic enrichment key ---
    enrichBusiness: (b) => fetch(base + '/prospecting/enrich', { method:'POST', headers: headers(), body: JSON.stringify(b) }).then(handle),
    getHexomaticKey: () => fetch(base + '/accounts/hexomatic-key', { headers: headers() }).then(handle),
    setHexomaticKey: (key) => fetch(base + '/accounts/hexomatic-key', { method:'PUT', headers: headers(), body: JSON.stringify({ key }) }).then(handle),
    // --- Builder + Renditions (kanban t_ef3b13f4): the step-config and rendition APIs were
    // served with NO caller — the Builder view was a stub. These are the only callers.
    getSteps: (id) => fetch(base + '/workflows/' + encodeURIComponent(id) + '/steps', { headers: headers() }).then(handle),
    addStep: (id, b) => fetch(base + '/workflows/' + encodeURIComponent(id) + '/steps', { method:'POST', headers: headers(), body: JSON.stringify(b) }).then(handle),
    updateStep: (id, sid, b) => fetch(base + '/workflows/' + encodeURIComponent(id) + '/steps/' + encodeURIComponent(sid), { method:'PUT', headers: headers(), body: JSON.stringify(b) }).then(handle),
    deleteStep: (id, sid) => fetch(base + '/workflows/' + encodeURIComponent(id) + '/steps/' + encodeURIComponent(sid), { method:'DELETE', headers: headers() }).then(handle),
    reorderSteps: (id, step_ids) => fetch(base + '/workflows/' + encodeURIComponent(id) + '/steps/reorder', { method:'PUT', headers: headers(), body: JSON.stringify({ step_ids }) }).then(handle),
    validateSteps: (steps) => fetch(base + '/workflows/validate-steps', { method:'POST', headers: headers(), body: JSON.stringify({ steps }) }).then(handle),
    renditionSummary: () => fetch(base + '/renditions/summary', { headers: headers() }).then(handle),
    listRenditions: (qs) => fetch(base + '/renditions' + (qs ? ('?' + qs) : ''), { headers: headers() }).then(handle),
    workflowRenditions: (id) => fetch(base + '/renditions/workflow/' + encodeURIComponent(id), { headers: headers() }).then(handle),
    stitchRenditions: (b) => fetch(base + '/renditions/stitch', { method:'POST', headers: headers(), body: JSON.stringify(b) }).then(handle),
    get token(){ return token; }, get user(){ return user; },
    get isLoggedIn(){ return !!sessionStorage.getItem('wf_token'); },
    setAuth(t, u){ token = t; user = u; sessionStorage.setItem('wf_token', t); sessionStorage.setItem('wf_user', JSON.stringify(u)); },
    logout(){ token = null; user = null; sessionStorage.removeItem('wf_token'); sessionStorage.removeItem('wf_user'); }
  };
})();

const S = { view:'login', loading:false, error:null, showRegister:false, current:'dashboard', toast:null, modal:null, industries:null, accIndustry:null, widgets:null, widgetsSlug:null, dashboardTabs:null, pickingIndustry:false, pendingView:'app', accLoaded:false, dataVer:0, apiKeys:null, extBuild:null, hexKey:null, hexKeyInput:'', enrich:null, enriching:null, newApiKey:null, builder:null, steps:null, stepsWf:null, stepValidation:null, stepDraft:null, widgetCat:null, rendSummary:null, renditions:null, rendWf:'', rendStatus:'active', rendSel:null, stitchName:'', modalErr:null };

// Views call their loaders from inside render (the house pattern: `if(!S.x) loadX();`), and
// every loader calls renderApp() again — a *re-entrant* preact render. The inner render
// replaces preact's root vnode while the outer diff is still running; after that every later
// render diffs against a stale tree and the DOM stops updating altogether (the app "freezes"
// on whichever view is open when the first request lands). Defer re-entrant renders instead.
let __rendering = false;
let __pendingRender = false;
const renderApp = () => {
  if (__rendering) { __pendingRender = true; return; }
  __rendering = true;
  try { render(html`<${App} />`, root); } finally { __rendering = false; }
  if (__pendingRender) { __pendingRender = false; renderApp(); }
};
const toast = (msg, type) => { S.toast = { msg, type: type==='err'?'t-err':'t-ok' }; renderApp(); setTimeout(() => { S.toast = null; renderApp(); }, 3000); };
const setView = (v, params) => { S.current = v; S.viewParams = params || {}; renderApp(); };
const closeModal = () => { S.modal = null; renderApp(); };
// Team / plan / timeline state (kept out of the S literal above so the two lanes editing this
// file do not collide on one very long line).
Object.assign(S, { users:null, teamErr:null, invited:null, permsTarget:null, timeline:null, planCaps:null, rolloverMsg:null, timelineTried:false, planCapsTried:false });

const statusBadge = (s) => {
  const m = { active:'b-green', pending:'b-amber', running:'b-blue', completed:'b-green', failed:'b-red', draft:'b-gray', deleted:'b-red', paused:'b-gray', won:'b-green', lost:'b-red', open:'b-blue', closed:'b-gray' };
  return html`<span class="badge ${m[String(s).toLowerCase()] || 'b-gray'}">${s || '—'}</span>`;
};
const fmtDate = (d) => d ? new Date(d).toLocaleString() : '—';
const fmtAmt = (n) => n === undefined || n === null ? '—' : Number(n).toLocaleString();

// ---- Auth views ----
const LoginView = () => {
  let email='', password='';
  const submit = async (e) => { e.preventDefault(); if(!email||!password) return; S.loading=true; S.error=null; renderApp();
    try { const r = await API.login(email, password); API.setAuth(r.token || r.access_token, r.user || r); S.view='app'; }
    catch(err){ S.error=err.message; } S.loading=false; renderApp(); };
  return html`
    <div class="flex items-center justify-center min-h-screen px-4">
      <div class="card w-full max-w-md">
        <div class="text-center mb-8"><div class="text-4xl mb-3">⚡</div><h1 class="text-2xl font-extrabold text-gray-900">WorkflowSwift</h1><p class="text-sm text-gray-500 mt-2">Sign in to your workspace</p></div>
        <form onSubmit=${submit} class="space-y-5">
          <div><label class="label">Email</label><input type="email" class="input" onInput=${e=>email=e.target.value} placeholder="you@company.com" autocomplete="email" required /></div>
          <div><label class="label">Password</label><input type="password" class="input" onInput=${e=>password=e.target.value} placeholder="••••••••" autocomplete="current-password" required /></div>
          ${S.error && html`<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 flex items-center gap-2"><span>⚠️</span> ${S.error}</div>`}
          <button type="submit" class="btn w-full" disabled=${S.loading}>${S.loading?'Signing in...':'Sign In'}</button>
        </form>
        <button class="btn-outline w-full mt-4 text-sm" onClick=${()=>{S.showRegister=true;S.error=null;renderApp();}}>Create Free Account</button>
        <div class="mt-6 text-center text-xs text-gray-400"><p>WorkflowSwift v2.0</p></div>
      </div>
    </div>`;
};
const RegisterView = () => {
  let name='', email='', password='';
  const submit = async (e) => { e.preventDefault(); if(!name||!email||!password) return; S.loading=true; S.error=null; renderApp();
    try { const r = await API.register(name, email, password); API.setAuth(r.token || r.access_token, r.user || r); S.view='pick'; S.pickingIndustry=true; }
    catch(err){ S.error=err.message; } S.loading=false; renderApp(); };
  return html`
    <div class="flex items-center justify-center min-h-screen px-4">
      <div class="card w-full max-w-md">
        <div class="text-center mb-8"><div class="text-4xl mb-3">🚀</div><h1 class="text-2xl font-extrabold text-gray-900">Create your account</h1><p class="text-sm text-gray-500 mt-2">Start automating with WorkflowSwift</p></div>
        <form onSubmit=${submit} class="space-y-5">
          <div><label class="label">Full Name</label><input type="text" class="input" onInput=${e=>name=e.target.value} placeholder="Jane Doe" required /></div>
          <div><label class="label">Email</label><input type="email" class="input" onInput=${e=>email=e.target.value} placeholder="you@company.com" required /></div>
          <div><label class="label">Password</label><input type="password" class="input" onInput=${e=>password=e.target.value} placeholder="••••••••" minlength="6" autocomplete="new-password" required /></div>
          ${S.error && html`<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 flex items-center gap-2"><span>⚠️</span> ${S.error}</div>`}
          <button type="submit" class="btn w-full" disabled=${S.loading}>${S.loading?'Creating...':'Create Free Account'}</button>
        </form>
        <button class="btn-outline w-full mt-4 text-sm" onClick=${()=>{S.showRegister=false;S.error=null;renderApp();}}>Back to Sign In</button>
      </div>
    </div>`;
};

// ---- Industry picker (signup step: industry = category) ----
const IndustryPickerView = ({ asModal }) => {
  if (!S.industries && !S.loading) { loadIndustries(); }
  if (!S.accIndustry && !S.loading) { loadAccountIndustry(); }
  const list = S.industries || [];
  const mine = (S.accIndustry && S.accIndustry.industries) || [];
  const removeIndustry = async (slug, nm) => {
    if (!confirm('Remove the ' + (nm || slug) + ' dashboard from your account? Your stored data is kept.')) return;
    try {
      const r = await API.removeAccountIndustry(slug);
      toast((r && r.message) || ("Industry '" + slug + "' dashboard removed"));
      S.accIndustry = null; S.accLoaded = false; S.widgets = null; S.widgetsSlug = null; S.viewParams = {};
      await loadAccountIndustry();
    } catch(e) { toast(e.message, 'err'); }
    renderApp();
  };
  let sel = S.selectedIndustry || null;
  const pick = async (ic) => { try { sel = ic.slug || ic.industry_slug || ic.id; S.selectedIndustry = sel; renderApp(); } catch(e){} };
  const done = async () => { if(!sel) return toast('Pick an industry to continue','err'); S.loading=true; renderApp();
    try { await API.putAccountIndustry(sel, true); toast('Dashboard ready for ' + (S.selectedIndustryName||sel));

const sampleValueFor = (w, idx) => {
  const t = String(w.title || w.widget_type || '').toLowerCase();
  const mk = String((w.config||{}).metric_key || '').toLowerCase();
  const wt = wtype(w);
  if (wt.includes('trend') || wt.includes('chart')) return [12,18,25,20,30,42,55];
  if (wt.includes('feed') || wt.includes('activity')) return 4;
  if (t.includes('solicit') || mk.includes('solicit')) return 23;
  if (t.includes('bid') || mk.includes('bid')) return 9;
  if (t.includes('awarded') || t.includes('revenu') || t.includes('value') || mk.includes('awarded') || mk.includes('revenue')) return 125000;
  if ((t.includes('pending') || t.includes('task') || mk.includes('pending')) && !mk.includes('activity')) return 12;
  if (t.includes('today')) return 3;
  if (t.includes('milestone')) return 5;
  if (t.includes('complete') || mk.includes('complete')) return 41;
  if (t.includes('active') || mk.includes('active')) return 7;
  if (t.includes('integratio')) return 6;
  return 3 + (idx || 0);
};

const wtype = (w) => String(w.widget_type || w.type || '').toLowerCase();
const wnum = (w) => {

  if (typeof d === 'number' || typeof d === 'string') return d;
  if (d && typeof d === 'object') {
    for (const k of ['value','current','total','count','amount','revenue']) if (d[k]!=null) return d[k];

};
const wcfg = (w) => w.config || {};
const gradientFor = (w) => { const t=wtype(w); if(t.includes('revenue')||(wcfg(w).currency)) return 'g-gold'; if(t.includes('trend')||t.includes('chart')) return 'g-blue'; if(t.includes('feed')||t.includes('activity')) return 'g-purple'; if(t.startsWith('stat')) return 'g-green'; return 'g-slate'; };
const countUp = (id, target) => {
  const el = document.getElementById(id); if(!el || target==null) return;
  const isCurrency = el.getAttribute('data-cur')==='1';
  const s = isCurrency ? Number(target) : Number(target);
  const dur=900, t0=performance.now();
  const step=(now)=>{ const p=Math.min((now-t0)/dur,1); const v=s*p; el.textContent = isCurrency ? fmtAmt(v) : Math.round(v).toLocaleString(); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const renderWidget = (w, idx) => {
  const t = wtype(w); const slug = currentIndustrySlug();

  }
  const n = wnum(w);
  if (t.includes('revenue') || (wcfg(w).currency)) {
    const cur = (wcfg(w).currency || 'USD');
    const suffix = wcfg(w).suffix || '';
    const id = 'wcur_'+ (w.id||idx);
    const hasVal = n != null;
    return html`<div class="mrevenue ${gradientFor(w)}" key=${w.id||idx}><span class="mico">${icon}</span><div class="msub">${title}</div><div class="mnum" id="${hasVal?id:''}" data-cur="${hasVal?1:''}">${hasVal?'…':'—'}</div>${hasVal ? html`${wcfg(w).delta!=null?html`<div class="mtrend ${Number(wcfg(w).delta)>=0?'up':'down'}">${Number(wcfg(w).delta)>=0?'▲':'▼'} ${Math.abs(wcfg(w).delta)}${suffix||''}</div>`:''}<div class="text-xs opacity-75 mt-1">${cur} · live</div>` : html`<div class="text-xs opacity-75 mt-2">Awaiting data…</div>`}</div>`; }
  if (t.includes('trend') || t.includes('chart')) {
    return html`<div class="mchart g-blue" key=${w.id||idx} style="grid-column:span 2"><div class="mtitle-chart"><span>${icon} ${title}</span><span class="text-xs opacity-60">live</span></div>${renderSvgChart(w)}</div>`;
  }
  const suffix = wcfg(w).suffix || '';
  const id = 'wc_'+ (w.id||idx);
  const hasVal = n != null;
  return html`<div class="mcounter ${gradientFor(w)}" key=${w.id||idx}><span class="mico">${icon}</span><div class="msub">${title}</div><div class="mnum" id="${hasVal?id:''}">${hasVal?'…':'—'}</div>${hasVal ? (wcfg(w).delta!=null?html`<div class="mtrend ${Number(wcfg(w).delta)>=0?'up':'down'}">${Number(wcfg(w).delta)>=0?'▲':'▼'} ${Math.abs(wcfg(w).delta)}${suffix}</div>`:html`<div>&nbsp</div>`) : html`<div class="text-xs opacity-75 mt-2">Awaiting data…</div>`}</div>`; };
const renderSvgChart = (w) => {
  const d = w.data || {};
  const points = Array.isArray(d) ? d : (d.points || d.series || d.values || []);
  const labels = Array.isArray(d) ? null : (d.labels||null);
  const vals = points.map(p => typeof p==='number' ? p : (p.value ?? p.y ?? 0));
  // A trend widget with no points used to emit an SVG path of "" + " L320 130 …", which the
  // browser rejects ("Expected moveto path command") and nothing rendered. One point also
  // divided by (n-1)=0 and produced NaN. Both are handled here.
  if (!vals.length) return html`<div class="empty" style="height:130px;display:flex;align-items:center;justify-content:center">No data points yet</div>`;
  const max = Math.max(1, ...vals); const W=320, H=130; const n=vals.length;
  const pts = vals.map((v,i)=>({x:(n>1?(i/(n-1)):0.5)*W, y:H-(v/max)*(H-16)-6}));
  const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const area = path + ' L'+W+' '+H+' L0 '+H+' Z';
  const gLabels = labels || vals.map((_,i)=>'m'+(i+1));
  return html`<svg viewBox="0 0 ${W} ${H}" class="svgchart" preserveAspectRatio="none">
    <defs><linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00d4ff" stop-opacity=".45"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75].map(f=>html`<line x1=0 x2=${W} y1=${H*f} y2=${H*f} stroke="rgba(255,255,255,.08)"/>`) }
    <path d=${area} fill="url(#fillg)"/>
    <path d=${path} fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>html`<circle cx=${p.x.toFixed(1)} cy=${p.y.toFixed(1)} r="3" fill="#fff"><title>${gLabels[i]}: ${vals[i]}</title></circle>`)}
  </svg>`;
};

// Run history for one instance: GET /instances/{id}/logs (workflow_execution_logs).
// One row per step attempt, written by the execution engine — this is the surface
// that makes the log table readable instead of write-only.
const LogsModal = () => {
  const inst = (S.instances || []).find(x => x.id === S.logsInstanceId);
  const logs = S.instanceLogs;
  return html`<${ModalShell} title=${inst ? 'Run history — ' + inst.name : 'Run history'} onClose=${closeModal}>
    ${inst ? html`<p class="text-sm text-gray-500 mb-3">Instance status: <b>${inst.status}</b>${inst.completed_at ? ' · finished ' + fmtDate(inst.completed_at) : ' · not finished'}</p>` : null}
    ${inst && inst.status === 'pending' ? html`<p class="text-xs text-gray-500 mb-3">A <b>delay</b> step advances by itself once its due time passes (background worker). A <b>manual</b> step waits for a decision — Approve or Reject below.</p>` : null}
    ${logs === null ? html`<p class="text-sm text-gray-500">Loading…</p>`
      : logs.length === 0 ? html`<p class="text-sm text-gray-500">No log rows for this instance. Runs before execution logging was added have none.</p>`
      : html`<table class="table"><thead><tr><th>#</th><th>Step</th><th>Status</th><th>ms</th><th></th></tr></thead><tbody>
        ${logs.map(l => html`<tr key=${l.id}><td>${(l.sort_order ?? 0) + 1}</td><td>${l.step_name}<div class="text-xs text-gray-400">${l.step_type}</div>${l.error_message ? html`<div class="text-xs text-red-600">${l.error_message}</div>` : null}${l.due_date ? html`<div class="text-xs text-gray-400">due ${fmtDate(l.due_date)}</div>` : null}</td><td>${statusBadge(l.status)}</td><td>${l.duration_ms ?? '—'}</td><td class="text-right whitespace-nowrap">${canDecideStep(l) ? (isWaitStep(l.step_type) ? html`<button class="btn-green text-xs" onClick=${()=>decideStep(S.logsInstanceId, l.instance_step_id, 'approve')}>Run now</button>` : html`<button class="btn-green text-xs" onClick=${()=>decideStep(S.logsInstanceId, l.instance_step_id, 'approve')}>Approve</button> <button class="btn-outline text-xs" onClick=${()=>decideStep(S.logsInstanceId, l.instance_step_id, 'reject')}>Reject</button>`) : null}</td></tr>`)}
      </tbody></table>`}
  <//>`;
};
// A log row is actionable exactly when its step row is still waiting AND the step
// is one the engine cannot settle alone: a manual/approval gate, or a delay that
// can be fast-forwarded. UI half of POST /instances/{id}/steps/{step_id}/decision
// (backend: instance_handler::decide_instance_step).
const isWaitStep = (t) => t === 'delay' || t === 'wait';
const canDecideStep = (l) => !!l.instance_step_id && ['manual', 'approval', 'delay', 'wait'].includes(l.step_type) && (l.instance_step_status === 'pending' || l.instance_step_status === 'in_progress');
const decideStep = async (instanceId, stepId, decision) => {
  if (!instanceId || !stepId) return;
  try {
    const r = await API.post('/instances/' + instanceId + '/steps/' + stepId + '/decision', { decision: decision });
    const pend = r.pending_steps || 0;
    const failed = r.failed_steps || 0;
    toast(`Step ${decision}d — run ${r.status}${pend ? `, ${pend} still waiting` : ''}${failed ? `, ${failed} failed` : ''}`, (r.status !== 'completed') ? 'err' : undefined);
    S.instances = null;
    await loadInstances();
    try { const lg = await API.get('/instances/' + instanceId + '/logs'); S.instanceLogs = lg.logs || []; } catch(e) { S.instanceLogs = []; }
    renderApp();
  } catch(e) { toast(e.message, 'err'); }
};
const openLogs = async (id) => {
  S.logsInstanceId = id; S.instanceLogs = null; S.modal = 'logs'; renderApp();
  try { const r = await API.get('/instances/' + id + '/logs'); S.instanceLogs = r.logs || []; } catch(e){ S.instanceLogs = []; toast(e.message,'err'); }
  renderApp();
};

  S.enriching = null; renderApp();
};

// ===== Surface selector =====
// Surfaces are DEFINED in the admin panel (admin.workflowswift.com → Admin → Surfaces).
// The user app must not create them, so the standalone Surfaces page + create modal were
// removed. What remains here is a FILTER fed by the same read-only registry, and it only
// renders when the tenant actually has >=1 surface.
//
// Param names differ by endpoint and are NOT interchangeable:
//   GET /workflows?surface=<uuid>      (workflow_handler::list_workflows)
//   GET /templates?surface=<uuid>      (template_handler::list_templates)
//   GET /leads?surface_id=<uuid>       (leads_handler::list_leads)
Object.assign(S, { surfaces:null, surfacesTried:false, surfaceCbs:null, wfSurface:'', tplSurface:'', leadSurface:'', wfEdit:null });

// Load the registry at most once per session.
// CRITICAL: nothing here may call renderApp() *synchronously* while a view is rendering.
// Views call ensureSurfaces() from inside their render body; renderApp() defers a re-entrant
// render (`__pendingRender`) and then re-runs it, so a synchronous renderApp() from inside a
// render loops forever (Maximum call stack size exceeded) and leaves the old DOM in place
// because the render that threw never removed it. Everything below is therefore async-only,
// and `surfacesTried` latches so the request is issued exactly once.
const fetchSurfaces = (done) => {
  API.get('/surfaces')
    .then(r => { S.surfaces = (r && r.surfaces) || []; })
    .catch(() => { S.surfaces = []; })
    .then(() => { const q = (S.surfaceCbs || []).concat(done || []); S.surfaceCbs = []; q.forEach(f => f()); });
};
const ensureSurfaces = () => {
  if (S.surfacesTried) return;          // loaded, in flight, or already failed — never re-render
  S.surfacesTried = true;
  fetchSurfaces([() => { if (!S.modal) renderApp(); }]);
};
// Open the create/edit workflow modal. The surface select needs the registry, so wait for it
// (asynchronously) before mounting the form — mounting first and re-rendering later would wipe
// whatever the operator had typed.
const loadSurfacesOnce = (cb) => {
  if (S.surfaces) { if (cb) cb(); return; }
  if (S.surfacesTried) { S.surfaceCbs = (S.surfaceCbs || []).concat(cb || []); return; }
  S.surfacesTried = true;
  fetchSurfaces(cb ? [cb] : []);
};

const SurfaceFilter = ({ value, onChange }) => {
  ensureSurfaces();
  const list = S.surfaces || [];
  if (!list.length) return null;
  return html`<select class="input text-sm" style="max-width:200px" value=${value || ''} onChange=${e => onChange(e.target.value)}>
    <option value="">Surface: All</option>
    ${list.map(s => html`<option key=${s.id} value=${s.id}>Surface: ${s.name}</option>`)}

};

// ===== Builder (kanban t_ef3b13f4) =====
// GET/POST /workflows/{id}/steps, PUT/DELETE /workflows/{id}/steps/{step_id},
// PUT /workflows/{id}/steps/reorder and POST /workflows/validate-steps were all served and
// called by NOTHING: this view was the literal stub "Builder interface — step configuration
// coming next." while the feature contract requires it (§E: steps can be added, edited,
// reordered, deleted; §G: "Builder" is in the user nav). This is that surface. No server
// change was needed — every call below hits an existing, live handler.
const STEP_TYPES = [
  { k:'data-card', label:'Data Card', hint:'Always step 1 — pulls the run\'s data from a named dashboard widget.' },
  { k:'ai-action', label:'AI Action', hint:'Runs an LLM prompt; the output stays editable.' },
  { k:'export', label:'Export', hint:'CSV / Resend / SendGrid / CoreSwift CRM.' },
  { k:'notify', label:'Notify', hint:'Email or webhook notification.' },
  { k:'delay', label:'Delay / Wait', hint:'Parks the instance until due; the execution worker advances it.' },
  { k:'fork', label:'Fork', hint:'Splits the run into parallel branches.' },
];
const STEP_TYPES_EXTRA = [
  { k:'http-request', label:'HTTP Request' }, { k:'action', label:'Action' },
  { k:'render_video', label:'Render Video' }, { k:'render_image', label:'Render Image' },
  { k:'render_audio', label:'Render Audio' }, { k:'research', label:'Research' },
  { k:'condition', label:'Condition' }, { k:'webhook', label:'Webhook' }, { k:'manual', label:'Manual / Approval' },
];
const ALL_STEP_TYPES = STEP_TYPES.concat(STEP_TYPES_EXTRA);
const stepTypeLabel = (k) => ((ALL_STEP_TYPES.filter(t => t.k === k)[0]) || {}).label || k;
const stepTypeHint = (k) => ((ALL_STEP_TYPES.filter(t => t.k === k)[0]) || {}).hint || '';
const cfgOf = (s) => (s && s.config && typeof s.config === 'object') ? s.config : {};
const stepSummary = (s) => { const c = cfgOf(s);
  return c.widget_name || c.prompt || c.url || c.query || c.recipient || c.destination || c.endpoint
    || (c.duration_seconds ? (c.duration_seconds + 's') : '')
    || (Array.isArray(c.branches) ? (c.branches.length + ' branch(es)') : '') || '—'; };

// The Data Card selector must offer real dashboard widgets BY NAME (contract §E), so it reads the
// same endpoint the dashboard renders from, and keeps both halves of the config (name + metric_key).
const loadWidgetCatalog = async () => { if (S.widgetCat) return;
  try { const r = await API.getDashboardWidgets(currentIndustrySlug());
    S.widgetCat = (r.widgets || []).map(w => ({ id: w.id, title: w.title || w.name || '', metric_key: ((w.config || {}).metric_key || '') })); }
  catch(e){ S.widgetCat = []; } renderApp(); };
const openStepModal = (wfId, step) => { loadWidgetCatalog(); S.stepValidation = null;
  const c = cfgOf(step);
  const base = { wfId, id: step ? step.id : null, type: step ? step.step_type : 'data-card', name: '', desc: '', widget_name: '', metric_key: '',
    prompt: '', url: '', method: 'GET', destination: 'csv', channel: 'email', recipient: '', subject: '',
    duration_seconds: 60, branches: '', query: '', provider: '', endpoint: '' };
  S.stepDraft = step ? Object.assign(base, { name: step.name || '', desc: step.description || '',
    widget_name: c.widget_name || '', metric_key: c.metric_key || '', prompt: c.prompt || '', url: c.url || '',
    method: c.method || 'GET', destination: c.destination || 'csv', channel: c.channel || 'email',
    recipient: c.recipient || '', subject: c.subject || '', duration_seconds: c.duration_seconds || (c.duration_ms ? Math.round(c.duration_ms / 1000) : 60),
    branches: Array.isArray(c.branches) ? c.branches.map(b => typeof b === 'string' ? b : ((b && b.name) || '')).join('\n') : '',
    query: c.query || '', provider: c.provider || '', endpoint: c.endpoint || '' }) : base;
  S.modal = 'step'; renderApp(); };
// The config keys below are the ones the execution engine actually reads (src/execution.rs):
// data-card reads widget_name + metric_key, export reads format + targets, delay reads
// duration_seconds, fork reads branches, notify reads channel + recipient.
const draftConfig = (d) => { switch (d.type) {
  case 'data-card': return { widget_name: d.widget_name, metric_key: d.metric_key };
  case 'ai-action': return { prompt: d.prompt };
  case 'export': return { destination: d.destination, format: 'csv', targets: [d.destination] };
  case 'notify': return { channel: d.channel, recipient: d.recipient, subject: d.subject };
  // duration_ms is the key BOTH the executor (delay_duration_ms) and validate-steps read — validate
  // only looks at duration_ms, so writing duration_seconds alone made a correct delay step report
  // "Delay duration is 0ms". Both keys are written so the edit form round-trips in seconds.
  case 'delay': case 'wait': return { duration_ms: (Number(d.duration_seconds) || 0) * 1000, duration_seconds: Number(d.duration_seconds) || 0 };
  case 'fork': return { branches: String(d.branches || '').split('\n').map(s => s.trim()).filter(Boolean).map(n => ({ name: n })) };
  case 'http-request': case 'action': return { url: d.url, method: String(d.method || 'GET').toUpperCase() };
  case 'webhook': return { url: d.url };
  case 'research': return { query: d.query };
  case 'render_video': case 'render_image': case 'render_audio': case 'render_media':
    return { provider: d.provider, endpoint: d.endpoint };
  default: return {};
} };

const BuilderView = () => {
  const wfId = S.viewParams && S.viewParams.id;
  if (!S.workflows && !S.loading) loadWorkflows();
  if (!wfId) return html`
    <div>
      <header class="mb-5"><h1 class="text-xl font-extrabold text-gray-900">Workflow Builder</h1>
        <p class="text-sm text-gray-500 mt-1">Pick a workflow to configure its steps.</p></header>
      ${(S.workflows || []).length === 0
        ? html`<div class="empty">No workflows yet. Create one under Workflows, then configure its steps here.</div>`
        : html`<div class="card" style="padding:0;overflow:auto"><table class="table"><thead><tr><th>Name</th><th>Status</th><th>Steps</th><th></th></tr></thead><tbody>
            ${(S.workflows || []).map(w => html`<tr key=${w.id}><td class="font-semibold">${w.name}</td>
              <td>${statusBadge(w.is_active ? 'active' : 'deleted')}</td><td>${w.step_count != null ? w.step_count : '—'}</td>
              <td class="text-right"><button class="btn text-xs" onClick=${()=>setView('builder', { id: w.id })}>Configure steps</button></td></tr>`)}
          </tbody></table></div>`}
    </div>`;
  if (S.stepsWf !== wfId && !S.loading) loadSteps(wfId);
  const steps = (S.stepsWf === wfId) ? (S.steps || []) : [];
  const wf = (S.workflows || []).filter(w => w.id === wfId)[0];
  const v = S.stepValidation;
  const move = async (i, dir) => { const ids = steps.map(s => s.id); const j = i + dir;
    if (j < 0 || j >= ids.length) return; const nx = ids.slice(); const t = nx[i]; nx[i] = nx[j]; nx[j] = t;
    S.loading = true; renderApp();
    try { await API.reorderSteps(wfId, nx); toast('Step order saved'); S.stepsWf = null; loadSteps(wfId); }
    catch(e){ toast(e.message, 'err'); } S.loading = false; renderApp(); };
  const validate = async () => { S.loading = true; renderApp();
    try { S.stepValidation = await API.validateSteps(steps.map(s => ({ step_type: s.step_type, name: s.name, description: s.description, config: cfgOf(s) }))); }
    catch(e){ S.stepValidation = { valid: false, errors: [e.message], warnings: [] }; }
    S.loading = false; renderApp(); };
  const del = async (sid, nm) => { if (!confirm('Delete step "' + nm + '"?')) return;
    S.loading = true; renderApp();
    try { await API.deleteStep(wfId, sid); toast('Step deleted'); S.stepsWf = null; loadSteps(wfId); }
    catch(e){ toast(e.message, 'err'); } S.loading = false; renderApp(); };
  return html`
    <div>
      <header class="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div><h1 class="text-xl font-extrabold text-gray-900">Workflow Builder</h1>
          <p class="text-sm text-gray-500 mt-1">${wf ? wf.name : (wfId || 'Workflow')} · ${steps.length} step(s)</p></div>
        <div class="flex gap-2 items-center">
          <button class="btn-outline text-sm" onClick=${()=>{S.stepsWf=null;loadSteps(wfId);}} disabled=${S.loading}>Refresh</button>
          <button class="btn-outline text-sm" onClick=${validate} disabled=${S.loading || !steps.length}>Validate</button>
          <button class="btn text-sm" onClick=${()=>openStepModal(wfId, null)}>+ Add Step</button>
          <button class="btn-outline text-sm" onClick=${()=>setView('workflows')}>Back</button>
        </div>
      </header>
      ${v ? html`<div class="card mb-4" style="border-left:4px solid ${v.valid ? '#10b981' : '#ef4444'}">
        <div class="font-semibold mb-1">${v.valid ? '✓ Validation passed' : '✗ Validation failed'}</div>
        ${(v.errors || []).map((e, i) => html`<div class="text-sm text-red-600" key=${'e' + i}>• ${e}</div>`)}
        ${(v.warnings || []).map((w, i) => html`<div class="text-sm text-gray-600" key=${'w' + i}>⚠ ${w}</div>`)}
        ${!(v.errors || []).length && !(v.warnings || []).length ? html`<div class="text-sm text-gray-500">No errors or warnings.</div>` : null}
      </div>` : null}
      ${steps.length === 0 ? html`<div class="empty">No steps yet. Step 1 must be a Data Card — it is what pulls the run's data.</div>` : html`
      <div class="card" style="padding:0;overflow:auto"><table class="table"><thead><tr><th>#</th><th>Type</th><th>Name</th><th>Config</th><th></th></tr></thead><tbody>
        ${steps.map((s, i) => html`<tr key=${s.id}>
          <td class="font-semibold">${i + 1}</td>
          <td><span class="text-xs">${stepTypeLabel(s.step_type)}</span></td>
          <td class="font-semibold">${s.name}</td>
          <td class="text-xs text-gray-600" style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${stepSummary(s)}</td>
          <td class="text-right whitespace-nowrap">
            <button class="btn-outline text-xs" onClick=${()=>move(i, -1)} disabled=${i === 0} title="Move up">↑</button>
            <button class="btn-outline text-xs" onClick=${()=>move(i, 1)} disabled=${i === steps.length - 1} title="Move down">↓</button>
            <button class="btn-outline text-xs" onClick=${()=>openStepModal(wfId, s)}>Edit</button>
            <button class="btn-red text-xs" onClick=${()=>del(s.id, s.name)}>Del</button>
          </td></tr>`)}
      </tbody></table></div>`}
    </div>`;
};

// ===== Renditions (kanban t_ef3b13f4) =====
// GET /renditions/summary, GET /renditions/workflow/{id} and POST /renditions/stitch were served
// with no caller in any shipped surface. A render step's output is logged into account_renditions
// (the app's own n8n converter emits that callback), so without this view a render step produced
// something the product could never show.
// GET /renditions has NO default status filter, so it returns soft-deleted rows too (DELETE sets
// status='expired'). The summary counters only count status='active', so the gallery beside them
// listed rows the counters denied — the endpoint's own `status` param is used instead.
const rendQs = (extra) => (S.rendStatus && S.rendStatus !== 'all' ? 'status=' + S.rendStatus + '&' : '') + (extra || 'limit=60');
const loadRenditions = async () => { S.loading = true; renderApp();
  try { S.rendSummary = await API.renditionSummary();
    const r = await API.listRenditions(rendQs()); S.renditions = r.renditions || []; S.rendWf = ''; }
  catch(e){ toast(e.message, 'err'); S.rendSummary = {}; S.renditions = []; }
  S.loading = false; renderApp(); };
const loadWfRenditions = async (wfId) => { S.rendWf = wfId || ''; S.rendSel = []; S.renditions = null;
  S.loading = true; renderApp();
  try { const r = wfId ? await API.workflowRenditions(wfId) : await API.listRenditions(rendQs());
    S.renditions = r.renditions || []; }
  catch(e){ toast(e.message, 'err'); S.renditions = []; }
  S.loading = false; renderApp(); };
const toggleRend = (id) => { const sel = S.rendSel || []; const i = sel.indexOf(id);
  if (i >= 0) sel.splice(i, 1); else sel.push(id); S.rendSel = sel; renderApp(); };
const stitchSelected = async () => { const sel = S.rendSel || [];
  if (sel.length < 2) return toast('Select at least 2 renditions to stitch', 'err');
  S.loading = true; renderApp();
  try { await API.stitchRenditions({ name: S.stitchName || 'Stitched rendition', child_ids: sel });
    toast('Stitch group created'); S.stitchName = ''; S.rendSel = []; await loadRenditions(); }
  catch(e){ toast(e.message, 'err'); } S.loading = false; renderApp(); };

const RenditionsView = () => {
  if (!S.renditions && !S.loading) loadRenditions();
  if (!S.workflows && !S.loading) loadWorkflows();
  const s = S.rendSummary || {};
  const list = S.renditions || [];
  const sel = S.rendSel || [];
  const chip = (label, n) => html`<span class="text-xs" style="border:1px solid #e5e7eb;border-radius:999px;padding:2px 8px;margin-right:6px">${label} ${n}</span>`;
  const card = (r) => { const thumb = r.thumbnail_url || r.preview_url || '';
    const title = r.step_name || r.provider_asset_id || 'Rendition';
    const picked = sel.indexOf(r.id) >= 0;
    return html`<div class="card" key=${r.id} style="padding:12px;margin-bottom:0;border:1px solid ${picked ? '#10b981' : '#e5e7eb'}">
      ${thumb ? html`<img src=${thumb} alt=${title} style="width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px" />`
              : html`<div class="empty" style="height:120px;display:flex;align-items:center;justify-content:center;margin-bottom:8px">${(r.asset_type || 'media')}</div>`}
      <div class="font-semibold text-sm" style="word-break:break-all">${title}</div>
      <div class="text-xs text-gray-500 mt-1">${r.provider || 'unknown'} · ${r.asset_type || '—'} · ${r.status || '—'}${r.status && r.status !== 'active' ? html`<span style="color:#b45309">(expired — retained until purge)</span>` : null}</div>
      <div class="text-xs text-gray-400 mt-0.5">${r.created_at ? fmtDate(r.created_at) : ''}</div>
      <div class="mt-2 flex gap-2 items-center">
        <input type="checkbox" checked=${picked} onChange=${()=>toggleRend(r.id)} title="Select for stitching" />
        ${r.provider_asset_url ? html`<a class="text-xs" href=${r.provider_asset_url} target="_blank" rel="noopener">Open asset ↗</a>` : null}
      </div>
    </div>`; };
  return html`
    <div>
      <header class="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div><h1 class="text-xl font-extrabold text-gray-900">Renditions</h1>
          <p class="text-sm text-gray-500 mt-1">Media produced by render steps — logged per workflow.</p></div>
        <div class="flex gap-2 items-center">
          <select class="input" style="width:auto" value=${S.rendWf || ''} onChange=${e=>loadWfRenditions(e.target.value)}>
            <option value="">All renditions</option>
            ${(S.workflows || []).map(w => html`<option key=${w.id} value=${w.id}>${w.name}</option>`)}
          </select>
          <select class="input" style="width:auto" value=${S.rendStatus} onChange=${e=>{S.rendStatus=e.target.value;S.renditions=null;loadRenditions();}}>
            <option value="active">Active</option><option value="expired">Expired</option><option value="all">All statuses</option>
          </select>
          <button class="btn-outline text-sm" onClick=${()=>{S.renditions=null;S.rendSummary=null;loadRenditions();}} disabled=${S.loading}>${S.loading ? spinner() : 'Refresh'}</button>
        </div>
      </header>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        ${statCard('Active renditions', s.total_active || 0, '🎬')}
        ${statCard('Expiring in 7 days', s.expiring_soon || 0, '⏳')}
        ${statCard('Asset types', (s.by_type || []).length, '🗂️')}
        ${statCard('Providers', (s.by_provider || []).length, '🔌')}
      </div>
      ${(s.by_type || []).length ? html`<div class="mb-4">${(s.by_type || []).map((b, i) => html`${chip(b.asset_type || '—', b.count)}`)}
        ${(s.by_provider || []).map((b, i) => html`${chip(b.provider || '—', b.count)}`)}</div>` : null}
      <div class="card mb-4 flex items-center gap-2 flex-wrap">
        <input class="input" style="width:auto" placeholder="Stitch group name" value=${S.stitchName} onInput=${e=>{S.stitchName=e.target.value;renderApp();}} />
        <button class="btn text-sm" onClick=${stitchSelected} disabled=${sel.length < 2 || S.loading}>Stitch selected (${sel.length})</button>
        <span class="text-xs text-gray-500">Groups 2+ renditions into one parent rendition.</span>
      </div>
      ${list.length === 0
        ? html`<div class="empty">No renditions yet. A Render step (Builder) or the n8n mirror's log node posts one here per generated asset.</div>`
        : html`<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${list.map(card)}</div>`}
    </div>`;
};

// Boot into the app view when a session token exists (avoids landing on login
// even after a successful sign-in at /login).
(function () {
  // Adopt the session handed over by /login. login.html writes BOTH the same-origin
  // localStorage 'ws_fs_token' and sessionStorage 'wf_token' and then navigates to a
  // bare /app - deliberately NOT to /app?token=<jwt>, because the query string is
  // recorded by the nginx/Cloudflare access log, the browser history and every
  // outbound Referer header. The SPA's API client only reads sessionStorage
  // 'wf_token', so adoption still happens here when only localStorage was populated
  // (a second tab, or a reload that dropped sessionStorage):
  const incoming = sessionStorage.getItem('wf_token')
    || localStorage.getItem('ws_fs_token') || localStorage.getItem('token') || localStorage.getItem('access_token');
  if (incoming && !sessionStorage.getItem('wf_token')) API.setAuth(incoming, null);

  // A token supplied in the URL is IGNORED on purpose (session-fixation guard: a link
  // carrying someone else's token must never log you into their account). Strip it from
  // the address bar so a legacy ?token= bookmark cannot linger in history.
  if (new URLSearchParams(window.location.search).get('token')) {
    try { history.replaceState(null, '', window.location.pathname + window.location.hash); } catch (e) { /* non-fatal */ }
  }

  // Deep link support: app.workflowswift.com/#api-keys opens the API Keys panel
  // (the extension's setup guide links straight to it).
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  const deepId = VIEW_MAP[h] ? h : null;
  if (API.isLoggedIn && S.view === 'login') {
    S.view = 'app'; S.current = deepId || S.current || 'dashboard'; renderApp();
  } else if (deepId && API.isLoggedIn) {
    S.current = deepId; renderApp();
  }
})();
